        html += '<div class="stats-section"><h3>Averages</h3><div class="avg-grid">';
        html += '<div class="avg-item"><div class="value">' + fmtDuration(data.averages.session_duration) + '</div><div class="label">Avg Session Duration</div></div>';
        html += '<div class="avg-item"><div class="value">' + (data.averages.agents_per_session || 0).toFixed(1) + '</div><div class="label">Agents / Session</div></div>';
        html += '</div></div>';
      }

      morphdomUpdate(el, html);
    }

    function setStatsViewMode(mode) {
      statsViewMode = mode;
      loadStats();
    }

    function renderTimelineSection(rawTimeline) {
      var gran = timelineGranularity || autoGranularity(rawTimeline);
      var filtered = filterTimelineByPeriod(rawTimeline, timelinePeriod);
      var aggregated = aggregateTimeline(filtered, gran);
      var allKeys = aggregated.map(function(a) { return a.key; });

      var maxCount = aggregated.length ? Math.max.apply(null, aggregated.map(function(t) { return t.count; })) : 0;

      var html = '<div class="stats-section" id="timeline-section"><h3>Timeline</h3>';

      // Controls row
      html += '<div class="timeline-controls">';

      // Granularity selector
      html += '<div class="timeline-granularity">';
      ['hour', 'day', 'week', 'month'].forEach(function(g) {
        var active = g === gran ? ' active' : '';
        var label = g.charAt(0).toUpperCase() + g.slice(1);
        html += '<button class="tl-btn' + active + '" onclick="setTimelineGranularity(\'' + g + '\')">' + label + '</button>';
      });
      html += '</div>';

      // Period selector
      html += '<div class="timeline-period">';
      [['24h', 'Last 24h'], ['7d', 'Last 7d'], ['30d', 'Last 30d'], ['all', 'All time']].forEach(function(p) {
        var active = p[0] === timelinePeriod ? ' active' : '';
        html += '<button class="tl-btn' + active + '" onclick="setTimelinePeriod(\'' + p[0] + '\')">' + p[1] + '</button>';
      });
      html += '</div>';

      html += '</div>'; // end timeline-controls

      if (!aggregated.length) {
        html += '<div class="empty-state">No data for this period</div>';
        html += '</div>';
        return html;
      }

      // Scrollable chart
      html += '<div class="timeline-scroll">';
      html += '<div class="timeline-chart">';
      aggregated.forEach(function(t, i) {
        var pct = maxCount > 0 ? (t.count / maxCount * 100) : 0;
        var label = fmtTimelineLabel(t.key, gran, i, allKeys);
        // Convert newlines in label to <br> for HTML rendering
        var htmlLabel = label.split('\n').map(function(part) { return esc(part); }).join('<br>');
        var tooltipText = fmtTimelineTooltip(t, gran);
        // Encode tooltip for data attribute
        var safeTooltip = tooltipText.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        // Split label: date part (if any) goes on second line below time
        var labelParts = label.split('\n');
        var timePart = labelParts.length > 1 ? esc(labelParts[1]) : esc(labelParts[0]);
        var datePart = labelParts.length > 1 ? '<br>' + esc(labelParts[0]) : '';
        html += '<div class="timeline-bar-wrap" data-tooltip="' + safeTooltip + '" onmouseenter="showTimelineTooltip(event)" onmouseleave="hideTimelineTooltip()">' +
          '<div class="timeline-bar-area">' +
            '<div class="timeline-count">' + t.count + '</div>' +
            '<div class="timeline-bar" style="height:' + Math.max(pct, 3) + '%"></div>' +
          '</div>' +
          '<div class="timeline-label">' + timePart + datePart + '</div>' +
        '</div>';
      });
      html += '</div></div>'; // end chart + scroll

      html += '</div>'; // end stats-section
      return html;
    }

    function setTimelineGranularity(g) {
      timelineGranularity = g;
      if (rawTimelineCache) {
        var section = document.getElementById('timeline-section');
        if (section) {
          var parent = section.parentNode;
          var temp = document.createElement('div');
          temp.innerHTML = renderTimelineSection(rawTimelineCache);
          parent.replaceChild(temp.firstChild, section);
        }
      }
    }

    function setTimelinePeriod(p) {
      timelinePeriod = p;
      // Reset granularity to auto when period changes
      timelineGranularity = null;
      if (rawTimelineCache) {
        var section = document.getElementById('timeline-section');
        if (section) {
          var parent = section.parentNode;
          var temp = document.createElement('div');
          temp.innerHTML = renderTimelineSection(rawTimelineCache);
          parent.replaceChild(temp.firstChild, section);
        }
      }
    }

    var timelineTooltipEl = null;
    function showTimelineTooltip(event) {
      var wrap = event.currentTarget;
      var text = wrap.getAttribute('data-tooltip');
      if (!text) return;
      if (!timelineTooltipEl) {
        timelineTooltipEl = document.createElement('div');
        timelineTooltipEl.className = 'timeline-tooltip';
        document.body.appendChild(timelineTooltipEl);
      }
      timelineTooltipEl.textContent = text;
      timelineTooltipEl.classList.add('visible');
      var rect = wrap.getBoundingClientRect();
      timelineTooltipEl.style.left = (rect.left + rect.width / 2 - 40) + 'px';
      timelineTooltipEl.style.top = (rect.top - 40) + 'px';
    }

    function hideTimelineTooltip() {
      if (timelineTooltipEl) {
        timelineTooltipEl.classList.remove('visible');
      }
    }

    function toggleAgentDetail(type) {
      expandedAgentType = expandedAgentType === type ? null : type;
      loadStats();
    }

    function renderAgentDetailPanel(type) {
      if (!globalToolData) return '';

      var agentTypes = globalToolData.agent_types || {};
      var toolsForAgent = agentTypes[type] || {};
      var sorted = Object.entries(toolsForAgent).sort(function(a, b) { return b[1] - a[1]; });
      var totalTools = sorted.reduce(function(s, e) { return s + e[1]; }, 0);

      // Count sessions using this agent type
      var sessionCount = 0;
      sessionsCache.forEach(function(s) {
        if (s.agent_types && s.agent_types.indexOf(type) !== -1) sessionCount++;
      });

      var html = '<div class="agent-detail-panel">';
      html += '<h4>' + esc(type) + ' Details</h4>';
      html += '<div class="agent-detail-row"><span class="dl">Sessions using this type</span><span class="dv">' + sessionCount + '</span></div>';
      html += '<div class="agent-detail-row"><span class="dl">Total tool calls</span><span class="dv">' + totalTools + '</span></div>';

      if (sorted.length > 0) {
        // Mini stacked bar
        html += '<div style="margin:8px 0 4px 0;">';
        html += '<div class="tool-usage-bar" style="height:20px;">';
        sorted.forEach(function(entry) {
          var pct = totalTools > 0 ? (entry[1] / totalTools * 100) : 0;
          html += '<div class="tool-usage-segment" style="width:' + pct + '%;background:' + getToolColor(entry[0]) + '" title="' + esc(entry[0]) + ': ' + entry[1] + '"></div>';
        });
        html += '</div></div>';

        // Tool table
        html += '<table class="tool-stats-table">';
        html += '<thead><tr><th>Tool</th><th>Calls</th><th>%</th></tr></thead><tbody>';
        sorted.forEach(function(entry) {
          var pct = totalTools > 0 ? (entry[1] / totalTools * 100).toFixed(1) : '0.0';
          html += '<tr>';
          html += '<td><span class="tool-color-dot" style="background:' + getToolColor(entry[0]) + ';display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:middle;"></span>' + esc(entry[0]) + '</td>';
          html += '<td>' + entry[1] + '</td>';
          html += '<td>' + pct + '%</td>';
          html += '</tr>';
        });
        html += '</tbody></table>';
      } else {
        html += '<div style="color:var(--text-dim);font-size:11px;margin-top:6px;">No tool data for this agent type</div>';
      }

      html += '</div>';
      return html;
    }

    // ===== Tool Usage Statistics Section (single /api/stats/tools call) =====
    function renderGlobalToolUsage() {
      if (!globalToolData) return '';

      var totals = globalToolData.totals || {};
      var agentTypes = globalToolData.agent_types || {};
      var sorted = Object.entries(totals)
        .filter(function(e) { return e[0] !== 'supercharge'; })
        .sort(function(a, b) { return b[1] - a[1]; });

      if (sorted.length === 0) return '';

      var total = sorted.reduce(function(s, e) { return s + e[1]; }, 0);
      var superchargeCount = totals.supercharge || 0;

      var html = '<div class="stats-section"><h3>Tool Usage</h3>';

      // Supercharge highlight
      if (superchargeCount > 0) {
        html += '<div style="margin-bottom:10px;font-size:11px;">';
        html += '<span class="supercharge-highlight">supercharge</span> bash calls: <b style="color:var(--text-bright)">' + superchargeCount + '</b>';
        html += '</div>';
      }

      // Stacked bar
      html += '<div class="tool-usage-bar">';
      sorted.forEach(function(entry) {
        var pct = total > 0 ? (entry[1] / total * 100) : 0;
        var label = pct > 5 ? entry[0] : '';
        html += '<div class="tool-usage-segment" style="width:' + pct + '%;background:' + getToolColor(entry[0]) + '" title="' + esc(entry[0]) + ': ' + entry[1] + '">' + esc(label) + '</div>';
      });
      html += '</div>';

      // Table
      html += '<table class="tool-stats-table">';
      html += '<thead><tr><th>Tool</th><th>Calls</th><th>%</th></tr></thead><tbody>';
      sorted.forEach(function(entry) {
        var pct = total > 0 ? (entry[1] / total * 100).toFixed(1) : '0.0';
        html += '<tr>';
        html += '<td><span class="tool-color-dot" style="background:' + getToolColor(entry[0]) + ';display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:middle;"></span>' + esc(entry[0]) + '</td>';
        html += '<td>' + entry[1] + '</td>';
        html += '<td>' + pct + '%</td>';
        html += '</tr>';
      });
      html += '</tbody></table>';

      // Per-agent-type grouped bars
      var agentTypeKeys = Object.keys(agentTypes);
      if (agentTypeKeys.length > 0) {
        // Collect all tool names across agents
        var allTools = {};
        agentTypeKeys.forEach(function(at) {
          Object.keys(agentTypes[at]).forEach(function(t) { allTools[t] = true; });
        });
        var toolNames = Object.keys(allTools).sort();

        html += '<h4 style="font-size:11px;color:var(--text-bright);margin-top:16px;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px;">Tool Usage by Agent Type</h4>';
        html += '<div class="agent-tool-grid">';

        var maxAgentTotal = 0;
        agentTypeKeys.forEach(function(at) {
          var atTotal = Object.values(agentTypes[at]).reduce(function(s, v) { return s + v; }, 0);
          if (atTotal > maxAgentTotal) maxAgentTotal = atTotal;
        });

        agentTypeKeys.sort(function(a, b) {
          var aTotal = Object.values(agentTypes[a]).reduce(function(s, v) { return s + v; }, 0);
          var bTotal = Object.values(agentTypes[b]).reduce(function(s, v) { return s + v; }, 0);
          return bTotal - aTotal;
        }).forEach(function(at) {
          var atTools = agentTypes[at];
          var atTotal = Object.values(atTools).reduce(function(s, v) { return s + v; }, 0);

          html += '<div class="agent-tool-row">';
          html += '<div class="agent-tool-row-label" style="color:var(--' + agentColor(at) + ')">' + esc(at) + '</div>';
          html += '<div class="agent-tool-row-bar">';

          var sortedAgentTools = Object.entries(atTools).sort(function(a, b) { return b[1] - a[1]; });
          sortedAgentTools.forEach(function(entry) {
            var pct = maxAgentTotal > 0 ? (entry[1] / maxAgentTotal * 100) : 0;
            html += '<div class="agent-tool-row-segment" style="width:' + pct + '%;background:' + getToolColor(entry[0]) + '" title="' + esc(entry[0]) + ': ' + entry[1] + '"></div>';
          });

          html += '</div>';
          html += '<span style="font-family:var(--mono);font-size:10px;color:var(--text-dim);min-width:35px;text-align:right;">' + atTotal + '</span>';
          html += '</div>';
        });

        html += '</div>';
      }

      html += '</div>';
      return html;
    }

    // ===== Browse =====
    var browseActiveSubtab = 'framework';

    function switchBrowseSubtab(subtab, btn) {
      browseActiveSubtab = subtab;
      document.querySelectorAll('.browse-subtab-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      document.querySelectorAll('.browse-subpanel').forEach(function(p) { p.style.display = 'none'; p.classList.remove('active'); });
      var panel = document.getElementById('browse-' + subtab);
      panel.style.display = 'block';
      panel.classList.add('active');
      if (subtab === 'framework') loadMemories();
      if (subtab === 'projects') loadProjectTasks();
    }

    async function loadBrowse() {
      if (browseActiveSubtab === 'framework') {
        loadMemories();
      } else {
        loadProjectTasks();
      }
    }

    // -- Framework (Memories) sub-tab --
    async function loadMemories() {
      var el = document.getElementById('browse-framework');
      try {
        var resp = await fetch('/api/browse/memories');
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        var data = await resp.json();
        renderMemories(data, el);
      } catch(e) {
        el.innerHTML = '<div class="empty-state">Failed to load memories</div>';
      }
    }

    function renderMemories(data, el) {
      var categories = data.categories;
      if (!categories || Object.keys(categories).length === 0) {
        el.innerHTML = '<div class="empty-state">No memory files found</div>';
        return;
      }

      var html = '';
      Object.keys(categories).sort().forEach(function(cat) {
        var items = categories[cat];
        if (!items || items.length === 0) return;
        var catLabel = cat.replace(/\//g, ' / ');
        html += '<div class="memory-category">' + esc(catLabel) + '</div>';
        items.forEach(function(mem) {
          var keywords = '';
          if (mem.keywords && mem.keywords.length > 0) {
            keywords = '<div class="memory-tags">';
            mem.keywords.forEach(function(kw) {
              keywords += '<span class="memory-tag">' + esc(kw) + '</span>';
            });
            keywords += '</div>';
          }
          var updated = mem.updated ? '<span class="memory-date">' + esc(mem.updated) + '</span>' : '';
          var preview = mem.preview ? '<div class="memory-preview">' + esc(mem.preview) + '</div>' : '';
          html += '<div class="memory-card" data-path="' + esc(mem.path) + '" onclick="toggleMemoryCard(this)">';
          html += '<div class="memory-card-head">';
          html += '<span class="memory-title">' + esc(mem.title || mem.path) + '</span>';
          html += updated;
          html += '</div>';
          html += keywords;
          html += preview;
          html += '<div class="memory-expand" style="display:none"></div>';
          html += '</div>';
        });
      });

      el.innerHTML = html;
    }

    async function toggleMemoryCard(card) {
      var expandEl = card.querySelector('.memory-expand');
      if (card.classList.contains('expanded')) {
        card.classList.remove('expanded');
        expandEl.style.display = 'none';
        return;
      }

      card.classList.add('expanded');
      expandEl.style.display = 'block';

      if (expandEl.dataset.loaded) return;

      expandEl.innerHTML = '<div class="empty-state" style="padding:10px">Loading...</div>';
      try {
        var path = card.dataset.path;
        var source = card.dataset.source || 'framework';
        var resp = await fetch('/api/browse/memories/' + encodeURIComponent(path) + '?source=' + source);
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        var data = await resp.json();
        var content = data.content || '';
        var rendered;
        if (typeof marked !== 'undefined') {
          try { rendered = marked.parse(content); } catch(e) { rendered = '<pre style="white-space:pre-wrap">' + esc(content) + '</pre>'; }
        } else {
          rendered = '<pre style="white-space:pre-wrap">' + esc(content) + '</pre>';
        }
        expandEl.innerHTML = '<div class="task-overlay-content" style="max-height:none">' + rendered + '</div>';
        expandEl.dataset.loaded = '1';
      } catch(e) {
        expandEl.innerHTML = '<div class="empty-state" style="padding:10px">Failed to load content</div>';
      }
    }

    // -- Projects sub-tab --
    var browseProjectDrill = null; // {slug, name, path} when drilled into a project

    async function loadProjectTasks() {
      var el = document.getElementById('browse-projects');
      // Sync from Sessions tab: use currentProject or first expanded project
      if (!browseProjectDrill) {
        var syncSlug = null;
        if (currentProject) {
          syncSlug = currentProject.slug;
        } else if (expandedProjectSlugs.size > 0) {
          syncSlug = expandedProjectSlugs.values().next().value;
        }
        if (syncSlug) {
          var projMatch = projectsCache.find(function(p) { return p.project_slug === syncSlug; });
          if (projMatch) {
            browseProjectDrill = { slug: syncSlug, name: projMatch.display_name || syncSlug, path: projMatch.project_path || '' };
          }
        }
      }
      if (browseProjectDrill) {
        await loadProjectDetail(browseProjectDrill, el);
      } else {
        await loadProjectList(el);
      }
    }

    async function loadProjectList(el) {
      try {
        var resp = await fetch('/api/projects');
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        var projects = await resp.json();
        renderBrowseProjectList(projects, el);
      } catch(e) {
        el.innerHTML = '<div class="empty-state">Failed to load projects</div>';
      }
    }

    function renderBrowseProjectList(projects, el) {
      if (!projects || projects.length === 0) {
        el.innerHTML = '<div class="empty-state">No projects found</div>';
        return;
      }
      var html = '';
      projects.sort(function(a, b) {
        return (b.total_tokens || 0) - (a.total_tokens || 0);
      });
      projects.forEach(function(p) {
        var name = p.display_name || p.project_slug;
        var sessions = p.session_count || 0;
        var tokens = (p.total_tokens || 0);
        html += '<div class="project-header" style="cursor:pointer" onclick="browseProjectDrillIn(\'' + esc(p.project_slug) + '\', \'' + esc(name) + '\', \'' + esc(p.project_path || '') + '\')">';
        html += '<span class="project-expand-arrow">&#9654;</span>';
        html += '<span class="project-name">' + esc(name) + '</span>';
        html += '<span class="project-meta">' + sessions + ' sessions · ' + fmtTokens(tokens) + ' tokens</span>';
        html += '</div>';
      });
      el.innerHTML = html;
    }

    function browseProjectDrillIn(slug, name, path) {
      browseProjectDrill = { slug: slug, name: name, path: path };
      // Sync to Sessions tab — set currentProject so switching back shows the same project
      if (!currentProject || currentProject.slug !== slug) {
        currentProject = { slug: slug, name: name };
      }
      loadProjectTasks();
    }

    function browseProjectBack() {
      browseProjectDrill = null;
      currentProject = null;
      loadProjectTasks();
    }

    async function loadProjectDetail(proj, el) {
      el.innerHTML = '<div class="empty-state">Loading...</div>';
      try {
        var pathParam = proj.path ? '?project_path=' + encodeURIComponent(proj.path) : '';
        var results = await Promise.all([
          fetch('/api/browse/tasks' + pathParam).then(function(r) { return r.json(); }),
          fetch('/api/browse/project-memories' + pathParam).then(function(r) { return r.json(); })
        ]);
        renderProjectDetail(proj, results[0], results[1], el);
      } catch(e) {
        el.innerHTML = '<div class="empty-state">Failed to load project data</div>';
      }
    }

    function renderProjectDetail(proj, taskData, memData, el) {
      var active = taskData.active || {};
      var archived = taskData.archived || [];
      var agentTypes = Object.keys(active).sort();
      var memCategories = memData.categories || {};
      var memItems = memCategories.project || [];

      var html = '<div class="back-button" onclick="browseProjectBack()">&larr; All Projects</div>';
      html += '<div style="font-size:14px;font-weight:600;color:var(--text-bright);margin-bottom:12px">' + esc(proj.name) + '</div>';

      // Project memories section
      if (memItems.length > 0) {
        html += '<div class="memory-category">Memories (' + memItems.length + ')</div>';
        memItems.forEach(function(mem) {
          var keywords = '';
          if (mem.keywords && mem.keywords.length > 0) {
            keywords = '<div class="memory-tags">';
            mem.keywords.forEach(function(kw) {
              keywords += '<span class="memory-tag">' + esc(kw) + '</span>';
            });
            keywords += '</div>';
          }
          var updated = mem.updated ? '<span class="memory-date">' + esc(mem.updated) + '</span>' : '';
          var preview = mem.preview ? '<div class="memory-preview">' + esc(mem.preview) + '</div>' : '';
          html += '<div class="memory-card" data-path="' + esc(mem.path) + '" data-source="project" onclick="toggleMemoryCard(this)">';
          html += '<div class="memory-card-head">';
          html += '<span class="memory-title">' + esc(mem.title || mem.path) + '</span>';
          html += updated;
          html += '</div>';
          html += keywords;
          html += preview;
          html += '<div class="memory-expand" style="display:none"></div>';
          html += '</div>';
        });
      }

      // Tasks section
      if (agentTypes.length > 0) {
        html += '<div class="memory-category">Tasks</div>';
        agentTypes.forEach(function(atype) {
          var tasks = active[atype];
          if (!tasks || tasks.length === 0) return;
          var color = agentColor(atype);
          html += '<div class="task-group">';
          html += '<div class="task-group-header"><span class="badge badge-' + color + '">' + esc(atype) + '</span> <span class="task-group-count">' + tasks.length + ' task' + (tasks.length !== 1 ? 's' : '') + '</span></div>';
          tasks.forEach(function(t) {
            var statusClass = t.status === 'completed' ? 'status-completed' : 'status-pending';
            var shortUuid = (t.uuid || '').substring(0, 8);
            html += '<div class="task-card" data-uuid="' + esc(t.uuid) + '" onclick="toggleTaskCard(this)">';
            html += '<div class="task-card-head">';
            html += '<span class="status-dot ' + statusClass + '"></span>';
            html += '<span class="badge badge-' + color + '" style="font-size:9px;padding:0 4px;">' + esc(atype) + '</span>';
            html += '<span class="task-card-uuid">' + esc(shortUuid) + '</span>';
            html += '<span class="task-card-title">' + esc(t.title || 'Untitled') + '</span>';
            html += '<span class="task-card-date">' + (t.created_at ? esc(fmtTime(t.created_at)) : '') + '</span>';
            html += '</div>';
            html += '<div class="task-expand" style="display:none"></div>';
            html += '</div>';
          });
          html += '</div>';
        });
      }

      if (archived.length > 0) {
        html += '<details class="task-archive-section"><summary class="task-archive-header">Archived (' + archived.length + ')</summary>';
        html += '<div class="task-archive-list">';
        archived.forEach(function(t) {
          var color = agentColor(t.agent_type);
          var shortUuid = (t.uuid || '').substring(0, 8);
          html += '<div class="task-card task-card-archived" data-uuid="' + esc(t.uuid) + '" onclick="toggleTaskCard(this)">';
          html += '<div class="task-card-head">';
          html += '<span class="badge badge-' + color + '" style="font-size:9px;padding:0 4px;">' + esc(t.agent_type) + '</span>';
          html += '<span class="task-card-uuid">' + esc(shortUuid) + '</span>';
          html += '<span class="task-card-title">' + esc(t.title || 'Untitled') + '</span>';
          html += '<span class="task-card-date">' + (t.created_at ? esc(fmtTime(t.created_at)) : '') + '</span>';
          html += '</div>';
          html += '<div class="task-expand" style="display:none"></div>';
          html += '</div>';
        });
        html += '</div></details>';
      }

      if (memItems.length === 0 && agentTypes.length === 0 && archived.length === 0) {
        html += '<div class="empty-state">No memories or tasks for this project</div>';
      }

      el.innerHTML = html;
    }

    async function toggleTaskCard(card) {
      var expandEl = card.querySelector('.task-expand');
      if (card.classList.contains('expanded')) {
        card.classList.remove('expanded');
        expandEl.style.display = 'none';
        return;
      }

      card.classList.add('expanded');
      expandEl.style.display = 'block';

      if (expandEl.dataset.loaded) return;

      expandEl.innerHTML = '<div class="empty-state" style="padding:10px">Loading...</div>';
      try {
        var uuid = card.dataset.uuid;
        var resp = await fetch('/api/tasks/' + encodeURIComponent(uuid) + '/content');
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        var data = await resp.json();
        var html = '';

        if (data.task_md && data.task_md.trim() !== '(empty)') {
          html += '<div class="task-expand-section"><div class="task-expand-label">task.md</div>';
          var rendered;
          if (typeof marked !== 'undefined') {
            try { rendered = marked.parse(data.task_md); } catch(e) { rendered = '<pre style="white-space:pre-wrap">' + esc(data.task_md) + '</pre>'; }
          } else {
            rendered = '<pre style="white-space:pre-wrap">' + esc(data.task_md) + '</pre>';
          }
          html += '<div class="task-overlay-content" style="max-height:400px">' + rendered + '</div></div>';
        }

        if (data.result_md && data.result_md.trim() !== '(empty)') {
          html += '<div class="task-expand-section"><div class="task-expand-label">result.md</div>';
          var rendered2;
          if (typeof marked !== 'undefined') {
            try { rendered2 = marked.parse(data.result_md); } catch(e) { rendered2 = '<pre style="white-space:pre-wrap">' + esc(data.result_md) + '</pre>'; }
          } else {
            rendered2 = '<pre style="white-space:pre-wrap">' + esc(data.result_md) + '</pre>';
          }
          html += '<div class="task-overlay-content" style="max-height:400px">' + rendered2 + '</div></div>';
        }

        if (!html) html = '<div class="empty-state" style="padding:10px">No content available</div>';
        expandEl.innerHTML = html;
        expandEl.dataset.loaded = '1';
      } catch(e) {
        expandEl.innerHTML = '<div class="empty-state" style="padding:10px">Failed to load task content</div>';
      }
    }

    // Legacy browse functions kept for backward compat
    function renderBrowse(data, el) {
      if (!data.tree) {
        el.innerHTML = '<div class="empty-state">No SuperchargeAI directory found</div>';
        return;
      }
      var taskMeta = {};
      if (data.tasks) {
        Object.entries(data.tasks).forEach(function(entry) {
          entry[1].forEach(function(t) { taskMeta[t.folder] = t; });
        });
      }
      var html = '<div class="browse-tree">';
      html += renderBrowseNode(data.tree, taskMeta, true);
      html += '</div>';
      el.innerHTML = html;
    }

    function renderBrowseNode(node, taskMeta, isRoot) {
      if (node.type === 'file') {
        return '<div class="file-entry"><span class="file-icon">&#128196;</span><span class="file-name">' + esc(node.name) + '</span><span class="file-meta">' + fmtSize(node.size || 0) + '</span></div>';
      }
      var meta = taskMeta[node.name];
      var annotation = '';
      if (meta) {
        var color = agentColor(meta.agent_type);
        annotation = ' <span class="task-badge badge-' + color + '">' + esc(meta.agent_type) + '</span>';
        if (meta.created_at) annotation += ' <span class="file-meta">' + esc(fmtTime(meta.created_at)) + '</span>';
      }
      var children = (node.children || []).map(function(c) { return renderBrowseNode(c, taskMeta, false); }).join('');
      var openAttr = isRoot ? ' open' : '';
      return '<details' + openAttr + '><summary><span class="dir-icon">&#128193;</span> <span class="file-name">' + esc(node.name) + '</span>' + annotation + '</summary>' + children + '</details>';
    }

    // ===== Global Unit Selector & Decomposition Bars =====
    var globalUnit = 'time'; // 'time' | 'tokens' | 'tools'
    var decompSort = 'amount'; // 'amount' | 'time'
    var decompStack = []; // breadcrumb stack: [{level, label, data}]
    var decompTokenCache = {}; // session_id -> token data
    var decompSpansCache = {}; // session_id -> spans data
    var projectsCache = []; // cached /api/projects response
    var currentProject = null; // {slug, name} when zoomed into a project, null at project level
    var projectSessionsCache = {}; // slug -> sessions array
    var expandedProjectSlugs = new Set(); // track expanded projects across all tabs
    var expandedSessionIds = new Set(); // track expanded sessions across all tabs

    function setGlobalUnit(unit) {
      globalUnit = unit;
      document.querySelectorAll('.unit-btn').forEach(function(b) {
        b.classList.toggle('active', b.dataset.unit === unit);
      });

      var sessionList = document.getElementById('session-list');
      var decompView = document.getElementById('decomp-view');
      var expandBtn = document.getElementById('ctrl-expand');
      var collapseBtn = document.getElementById('ctrl-collapse');

      var sortSelector = document.getElementById('sort-selector');
      if (unit === 'time') {
        sessionList.style.display = '';
        decompView.style.display = 'none';
        expandBtn.style.display = '';
        collapseBtn.style.display = '';
        sortSelector.style.display = 'none';
        if (currentProject) {
          zoomIntoProject(currentProject.slug).then(function() {
            expandedSessionIds.forEach(function(sid) {
              var card = document.querySelector('.session-card[data-sid="' + sid + '"]');
              if (card && !card.classList.contains('expanded')) {
                var head = card.querySelector('.session-head');
                if (head) toggleSession(head);
              }
            });
          });
        } else {
          renderProjectTimeView();
          reExpandTimeProjects();
        }
      } else {
        sessionList.style.display = 'none';
        decompView.style.display = '';
        expandBtn.style.display = '';
        collapseBtn.style.display = '';
        sortSelector.style.display = 'flex';
        decompStack = [];
        if (currentProject) {
          decompZoomProject(currentProject.slug);
        } else {
          renderDecompProjectLevel();
          reExpandDecompProjects();
        }
      }
    }

    async function reExpandTimeProjects() {
      var slugs = Array.from(expandedProjectSlugs);
      expandedProjectSlugs.clear();
      for (var i = 0; i < slugs.length; i++) {
        var header = document.querySelector('.project-header[data-project-slug="' + slugs[i] + '"]');
        if (header) {
          await toggleProjectTimeExpand(header, slugs[i]);
          expandedSessionIds.forEach(function(sid) {
            var card = document.querySelector('.session-card[data-sid="' + sid + '"]');
            if (card && !card.classList.contains('expanded')) {
              var head = card.querySelector('.session-head');
              if (head) toggleSession(head);
            }
          });
        }
      }
    }

    function reExpandDecompProjects() {
      var slugs = Array.from(expandedProjectSlugs);
      expandedProjectSlugs.clear();
      slugs.forEach(function(slug) {
        var row = document.querySelector('.decomp-bar-row[data-project-slug="' + slug + '"]');
        if (row) decompToggleProject(row, slug);
      });
    }

    function setDecompSort(sort) {
      decompSort = sort;
      document.querySelectorAll('#sort-selector .unit-btn').forEach(function(b) {
        b.classList.toggle('active', b.dataset.sort === sort);
      });
      if (decompStack[0] && decompStack[0].level === 'projects' && decompStack.length === 1) {
        renderDecompProjectLevel();
      } else if (decompStack.length <= 1) {
        renderDecompSessionLevel();
      }
    }

    function decompSessionValue(s) {
      if (globalUnit === 'tokens') {
        return (s.input_tokens || 0) + (s.output_tokens || 0) +
               (s.cache_creation_tokens || 0) + (s.cache_read_tokens || 0);
      }
      return s.tool_call_count || 0;
    }

    function decompFormatValue(val) {
      if (globalUnit === 'tokens') return fmtTokens(val) + ' tokens';
      return val + ' tools';
    }

    function decompUnitLabel() {
      return globalUnit === 'tokens' ? 'Total Tokens' : 'Total Tool Calls';
    }

    function decompBarTrackHtml(pct, val, color) {
      var formattedVal = decompFormatValue(val);
      var isZero = val === 0;
      var isNarrow = pct <= 15 && !isZero;
      var fillClass = 'decomp-bar-fill' + (isZero ? ' decomp-bar-zero' : '');
      var fillWidth = isZero ? '0%' : (pct + '%');
      var insideText = (!isZero && !isNarrow) ? formattedVal : '';
      var outsideText = (isZero || isNarrow) ? '<span class="decomp-bar-text-outside">' + formattedVal + '</span>' : '';
      return '<div class="decomp-bar-track"><div class="' + fillClass + '" style="width:' + fillWidth + ';background:' + color + ';">' + insideText + '</div>' + outsideText + '</div>';
    }

    // Level 0: All sessions as bars (or project's sessions when zoomed)
    function renderDecompSessionLevel() {
      var el = document.getElementById('decomp-view');
      var sessions = currentProject ? (projectSessionsCache[currentProject.slug] || []) : sessionsCache;
      if (!sessions || sessions.length === 0) {
        el.innerHTML = '<div class="empty-state">No sessions recorded yet</div>';
        return;
      }

      var sorted = sessions.slice().sort(function(a, b) {
        if (decompSort === 'time') {
          return (a.first_timestamp || '').localeCompare(b.first_timestamp || '');
        }
        return decompSessionValue(b) - decompSessionValue(a);
      });

      var maxVal = sorted.reduce(function(m, s) { var v = decompSessionValue(s); return v > m ? v : m; }, 1);

      var totalVal = sorted.reduce(function(s, sess) { return s + decompSessionValue(sess); }, 0);

      if (currentProject) {
        decompStack = [
          { level: 'projects', label: 'All Projects' },
          { level: 'project', label: currentProject.name, slug: currentProject.slug }
        ];
      } else {
        decompStack = [{ level: 'sessions', label: 'All Sessions' }];
      }

      var html = renderDecompBreadcrumb();
      html += '<div class="decomp-total-label">' + decompUnitLabel() + ': <b>' + decompFormatValue(totalVal) + '</b></div>';
      html += '<div class="decomp-bars">';

      sorted.forEach(function(s) {
        var val = decompSessionValue(s);
        var pct = maxVal > 0 ? (val / maxVal * 100) : 0;
        var name = s.name || truncId(s.session_id, 30);
        html += '<div class="decomp-bar-row" data-sid="' + esc(s.session_id) + '" onclick="decompToggleSession(this, \'' + esc(s.session_id) + '\')">';
        html += '<div class="decomp-bar-label" title="' + esc(s.session_id) + '">' + esc(name) + '</div>';
        html += decompBarTrackHtml(pct, val, '#7950f2');
        html += '<div class="decomp-bar-value">' + decompFormatValue(val) + '</div>';
        html += '</div>';
        // Placeholder for inline expansion
        html += '<div class="decomp-children" id="decomp-children-' + esc(s.session_id) + '" style="display:none;margin-left:20px;"></div>';
      });

      html += '</div>';
      morphdomUpdate(el, html);
    }

    // Inline expand/collapse a session's children
    async function decompToggleSession(rowEl, sessionId) {
      var childDiv = document.getElementById('decomp-children-' + sessionId);
      if (!childDiv) return;
      // Ensure rowEl is the session bar row, not a child
      var sessionRow = document.querySelector('.decomp-bar-row[data-sid="' + sessionId + '"]');
      if (sessionRow) rowEl = sessionRow;

      // Toggle - collapse
      if (childDiv.style.display !== 'none') {
        childDiv.style.display = 'none';
        childDiv.innerHTML = '';
        // Restore parent bar to original value
        var ghost = rowEl.querySelector('.decomp-bar-ghost');
        if (ghost) ghost.remove();
        var parentFill = rowEl.querySelector('.decomp-bar-fill');
        var parentValEl = rowEl.querySelector('.decomp-bar-value');
        if (parentFill && parentFill.dataset.origWidth) {
          parentFill.style.width = parentFill.dataset.origWidth;
          parentFill.textContent = parentFill.dataset.origText || '';
          if (parentValEl) parentValEl.textContent = parentValEl.dataset.origText || '';
        }
        return;
      }

      childDiv.style.display = 'block';
      childDiv.innerHTML = '<div class="empty-state" style="font-size:11px">Loading...</div>';

      try {
        // Fetch data
        if (!decompTokenCache[sessionId]) {
          var tokResp = await fetch('/api/sessions/' + encodeURIComponent(sessionId) + '/tokens');
          decompTokenCache[sessionId] = await tokResp.json();
        }
        if (!decompSpansCache[sessionId]) {
          var spResp = await fetch('/api/sessions/' + encodeURIComponent(sessionId) + '/spans');
          decompSpansCache[sessionId] = await spResp.json();
        }

        var tokenData = decompTokenCache[sessionId] || {};
        var spans = decompSpansCache[sessionId] || [];

        // Group by agent_type
        var typeGroups = {};
        if (globalUnit === 'tokens') {
          Object.entries(tokenData).forEach(function(entry) {
            var agentId = entry[0], info = entry[1];
            var aType = info.agent_type || 'orchestrator';
            if (!typeGroups[aType]) typeGroups[aType] = { value: 0, agents: [] };
            typeGroups[aType].value += info.total || 0;
            typeGroups[aType].agents.push({ id: agentId, value: info.total || 0, info: info });
          });
        } else {
          spans.forEach(function(sp) {
            if (sp.type !== 'agent') return;
            var aType = sp.agent_type || 'orchestrator';
            if (!typeGroups[aType]) typeGroups[aType] = { value: 0, agents: [] };
            typeGroups[aType].value += sp.tool_calls || 0;
            typeGroups[aType].agents.push({ id: sp.id, value: sp.tool_calls || 0, info: sp });
          });
        }

        // Sort groups by value
        var groups = Object.entries(typeGroups).sort(function(a, b) { return b[1].value - a[1].value; });
        // Scale relative to SAME max as parent bars (max across sessions in current view)
        var _activeSessions = currentProject ? (projectSessionsCache[currentProject.slug] || sessionsCache) : sessionsCache;
        var maxSessVal = _activeSessions.reduce(function(m, s) { var v = decompSessionValue(s); return v > m ? v : m; }, 1);
        if (maxSessVal === 0) maxSessVal = 1;
        var sessionObj = _activeSessions.find(function(s) { return s.session_id === sessionId; });
        var sessionVal = sessionObj ? decompSessionValue(sessionObj) : 1;

        var html = '';
        groups.forEach(function(entry) {
          var aType = entry[0], data = entry[1];
          var pct = (data.value / maxSessVal * 100);
          var color = agentHex(aType);
          html += '<div class="decomp-bar-row" onclick="event.stopPropagation(); decompToggleAgentType(this, \'' + esc(sessionId) + '\', \'' + esc(aType) + '\')">';
          html += '<div class="decomp-bar-label">' + esc(aType) + '</div>';
          html += decompBarTrackHtml(pct, data.value, color);
          html += '<div class="decomp-bar-value">' + decompFormatValue(data.value) + '</div>';
          html += '</div>';
          html += '<div class="decomp-children" id="decomp-type-' + esc(sessionId) + '-' + esc(aType) + '" style="display:none;margin-left:20px;"></div>';
        });

        if (groups.length === 0) {
          // No subagent data — session bar already shows the total
          html = '<div style="font-size:10px;padding:2px 8px;opacity:0.5;color:var(--text-secondary)">No subagents</div>';
        }

        // Update parent bar: ghost background at original width, fill shrinks to unattributed
        var childrenTotal = groups.reduce(function(s, entry) { return s + entry[1].value; }, 0);
        var unattributed = Math.max(0, sessionVal - childrenTotal);
        var parentFill = rowEl.querySelector('.decomp-bar-fill');
        var parentTrack = rowEl.querySelector('.decomp-bar-track');
        var parentValEl = rowEl.querySelector('.decomp-bar-value');
        if (parentFill && parentTrack) {
          // Save originals for restore on collapse
          var origWidth = parentFill.style.width;
          parentFill.dataset.origWidth = origWidth;
          parentFill.dataset.origText = parentFill.textContent;
          if (parentValEl) parentValEl.dataset.origText = parentValEl.textContent;
          parentTrack.style.position = 'relative';
          var ghost = document.createElement('div');
          ghost.className = 'decomp-bar-ghost';
          ghost.style.cssText = 'position:absolute;top:0;left:0;height:100%;width:' + origWidth + ';background:#7950f2;opacity:0.15;border-radius:4px;pointer-events:none;';
          parentTrack.insertBefore(ghost, parentFill);
          // Shrink fill to unattributed portion
          var _activeSessions2 = currentProject ? (projectSessionsCache[currentProject.slug] || sessionsCache) : sessionsCache;
          var maxSessVal = _activeSessions2.reduce(function(m, s) { var v = decompSessionValue(s); return v > m ? v : m; }, 1);
          var unPct = maxSessVal > 0 ? (unattributed / maxSessVal * 100) : 0;
          parentFill.style.width = unPct + '%';
          parentFill.textContent = unattributed > 0 ? decompFormatValue(unattributed) : '';
          if (parentValEl) parentValEl.textContent = unattributed > 0 ? decompFormatValue(unattributed) : '0';
        }

        // Unattributed remainder is already shown in the shrunken parent bar.
        // No separate row needed — the parent bar IS the orchestrator.

        childDiv.innerHTML = html;
      } catch(e) {
        childDiv.innerHTML = '<div class="empty-state" style="font-size:11px">Failed to load</div>';
      }
    }

    // Inline expand agent type -> individual invocations
    function decompToggleAgentType(rowEl, sessionId, agentType) {
      var childDiv = document.getElementById('decomp-type-' + sessionId + '-' + agentType);
      if (!childDiv) return;

      if (childDiv.style.display !== 'none') {
        childDiv.style.display = 'none';
        childDiv.innerHTML = '';
        // Restore parent bar
        var ghost = rowEl.querySelector('.decomp-bar-ghost');
        if (ghost) ghost.remove();
        var pf = rowEl.querySelector('.decomp-bar-fill');
        var pv = rowEl.querySelector('.decomp-bar-value');
        if (pf && pf.dataset.origWidth) {
          pf.style.width = pf.dataset.origWidth;
          pf.textContent = pf.dataset.origText || '';
          if (pv) pv.textContent = pv.dataset.origText || '';
        }
        return;
      }

      childDiv.style.display = 'block';
      var tokenData = decompTokenCache[sessionId] || {};
      var spans = decompSpansCache[sessionId] || [];

      var invocations = [];
      if (globalUnit === 'tokens') {
        Object.entries(tokenData).forEach(function(entry) {
          var agentId = entry[0], info = entry[1];
          if ((info.agent_type || 'orchestrator') === agentType) {
            // Find task_uuid from spans if available
            var matchSpan = spans.find(function(sp) { return sp.id === agentId && sp.type === 'agent'; });
            var taskUuid = matchSpan ? (matchSpan.task_uuid || '') : '';
            invocations.push({ id: agentId, value: info.total || 0, taskUuid: taskUuid, startTs: matchSpan ? (matchSpan.start || '') : '' });
          }
        });
      } else {
        spans.forEach(function(sp) {
          if (sp.type !== 'agent' || (sp.agent_type || 'orchestrator') !== agentType) return;
          invocations.push({ id: sp.id, value: sp.tool_calls || 0, taskUuid: sp.task_uuid || '', isResume: sp.is_resume, startTs: sp.start || '' });
        });
      }

      // Sort by start time (preserve chronological order for numbering)
      invocations.sort(function(a, b) { return (a.startTs || '').localeCompare(b.startTs || ''); });
      // Use same global scale as parent bars (max across sessions in current view)
      var _activeSessions3 = currentProject ? (projectSessionsCache[currentProject.slug] || sessionsCache) : sessionsCache;
      var maxSessVal = _activeSessions3.reduce(function(m, s) { var v = decompSessionValue(s); return v > m ? v : m; }, 1);
      if (maxSessVal === 0) maxSessVal = 1;
      var color = agentHex(agentType);

      // Track seen agent IDs for numbering (same agent resumed = same number)
      var agentIdToNum = {};
      var nextNum = 1;

      var html = '';
      invocations.forEach(function(inv, idx) {
        var pct = (inv.value / maxSessVal * 100);
        // Number agents: same agent_id = same #, different = new #
        var num;
        if (agentIdToNum[inv.id] !== undefined) {
          num = agentIdToNum[inv.id];
        } else {
          num = nextNum++;
          agentIdToNum[inv.id] = num;
        }
        var label = '#' + num + (inv.isResume ? ' (cont.)' : '');
        // View task icon (📄) separate from expand
        var viewBtn = '';
        if (inv.taskUuid) {
          viewBtn = '<span class="decomp-view-btn" onclick="event.stopPropagation(); showTaskOverlay(\'' + esc(inv.taskUuid) + '\')" title="View task">&#128196;</span>';
        } else {
          viewBtn = '<span class="decomp-view-btn" onclick="event.stopPropagation(); searchAndShowTask(\'\', \'' + esc(agentType) + '\', 0)" title="View task">&#128196;</span>';
        }
        html += '<div class="decomp-bar-row">';
        html += '<div class="decomp-bar-label">' + esc(label) + ' ' + viewBtn + '</div>';
        html += decompBarTrackHtml(pct, inv.value, shiftColor(color, idx));
        html += '<div class="decomp-bar-value">' + decompFormatValue(inv.value) + '</div>';
        html += '</div>';
      });

      // Ghost bar on parent agent type row
      var parentFill = rowEl.querySelector('.decomp-bar-fill');
      var parentTrack = rowEl.querySelector('.decomp-bar-track');
      var parentValEl = rowEl.querySelector('.decomp-bar-value');
      if (parentFill && parentTrack) {
        parentFill.dataset.origWidth = parentFill.style.width;
        parentFill.dataset.origText = parentFill.textContent;
        if (parentValEl) parentValEl.dataset.origText = parentValEl.textContent;
        parentTrack.style.position = 'relative';
        var ghost = document.createElement('div');
        ghost.className = 'decomp-bar-ghost';
        ghost.style.cssText = 'position:absolute;top:0;left:0;height:100%;width:' + parentFill.style.width + ';background:' + color + ';opacity:0.15;border-radius:4px;pointer-events:none;';
        parentTrack.insertBefore(ghost, parentFill);
        // Show just the label, no filled bar (children explain the breakdown)
        parentFill.style.width = '0%';
        parentFill.textContent = '';
        if (parentValEl) parentValEl.textContent = '';
      }

      childDiv.innerHTML = html || '<div class="empty-state" style="font-size:11px">No invocations</div>';
    }

    // Level 1: Drill into a session -> agent type groups (legacy, kept for breadcrumb nav)
    async function decompDrillSession(sessionId) {
      var el = document.getElementById('decomp-view');
      el.innerHTML = '<div class="empty-state">Loading...</div>';

      var session = sessionsCache.find(function(s) { return s.session_id === sessionId; });
      var sessionName = session ? (session.name || truncId(sessionId, 30)) : truncId(sessionId, 30);

      try {
        // Fetch token data and spans in parallel
        var promises = [];
        if (!decompTokenCache[sessionId]) {
          promises.push(
            fetch('/api/sessions/' + encodeURIComponent(sessionId) + '/tokens')
              .then(function(r) { return r.json(); })
              .then(function(d) { decompTokenCache[sessionId] = d; })
          );
        }
        if (!decompSpansCache[sessionId]) {
          promises.push(
            fetch('/api/sessions/' + encodeURIComponent(sessionId) + '/spans')
              .then(function(r) { return r.json(); })
              .then(function(d) { decompSpansCache[sessionId] = d; })
          );
        }
        if (promises.length) await Promise.all(promises);

        var tokenData = decompTokenCache[sessionId] || {};
        var spans = decompSpansCache[sessionId] || [];

        // Group by agent_type
        var typeGroups = {};
        if (globalUnit === 'tokens') {
          Object.entries(tokenData).forEach(function(entry) {
            var agentId = entry[0], info = entry[1];
            var aType = info.agent_type || 'orchestrator';
            if (!typeGroups[aType]) typeGroups[aType] = { value: 0, agents: {} };
            typeGroups[aType].value += info.total || 0;
            typeGroups[aType].agents[agentId] = info;
          });
        } else {
          // Tools: group spans by agent_type
          spans.forEach(function(sp) {
            if (sp.type !== 'agent') return;
            var aType = sp.agent_type || 'orchestrator';
            if (!typeGroups[aType]) typeGroups[aType] = { value: 0, agents: {} };
            var tc = sp.tool_calls || 0;
            typeGroups[aType].value += tc;
            if (!typeGroups[aType].agents[sp.id]) {
              typeGroups[aType].agents[sp.id] = { tool_calls: 0, agent_type: aType };
            }
            typeGroups[aType].agents[sp.id].tool_calls += tc;
          });
        }

        var sorted = Object.entries(typeGroups).sort(function(a, b) { return b[1].value - a[1].value; });
        var totalVal = sorted.reduce(function(s, e) { return s + e[1].value; }, 0);

        // If no subagent data, nothing to decompose — session bar already shows the total

        var maxVal = sorted.length > 0 ? sorted[0][1].value : 1;
        if (maxVal === 0) maxVal = 1;

        if (currentProject) {
          decompStack = [
            { level: 'projects', label: 'All Projects' },
            { level: 'project', label: currentProject.name, slug: currentProject.slug },
            { level: 'session', label: sessionName, sessionId: sessionId }
          ];
        } else {
          decompStack = [
            { level: 'sessions', label: 'All Sessions' },
            { level: 'session', label: sessionName, sessionId: sessionId }
          ];
        }

        var html = renderDecompBreadcrumb();
        html += '<div class="decomp-total-label">' + esc(sessionName) + ' - ' + decompUnitLabel() + ': <b>' + decompFormatValue(totalVal) + '</b></div>';
        html += '<div class="decomp-bars">';

        sorted.forEach(function(entry) {
          var aType = entry[0], info = entry[1];
          var pct = maxVal > 0 ? (info.value / maxVal * 100) : 0;
          var color = agentHex(aType);
          html += '<div class="decomp-bar-row" onclick="decompDrillAgentType(\'' + esc(sessionId) + '\', \'' + esc(aType) + '\')">';
          html += '<div class="decomp-bar-label">' + esc(aType) + '</div>';
          html += decompBarTrackHtml(pct, info.value, color);
          html += '<div class="decomp-bar-value">' + decompFormatValue(info.value) + '</div>';
          html += '</div>';
        });

        html += '</div>';
        el.innerHTML = html;
      } catch(e) {
        el.innerHTML = '<div class="empty-state">Failed to load data</div>';
      }
    }

    // Level 2: Drill into agent type -> individual invocations
    function decompDrillAgentType(sessionId, agentType) {
      var el = document.getElementById('decomp-view');
      var tokenData = decompTokenCache[sessionId] || {};
      var spans = decompSpansCache[sessionId] || [];
      var session = sessionsCache.find(function(s) { return s.session_id === sessionId; });
      var sessionName = session ? (session.name || truncId(sessionId, 30)) : truncId(sessionId, 30);

      // Collect individual invocations for this agent type
      var invocations = [];
      if (globalUnit === 'tokens') {
        Object.entries(tokenData).forEach(function(entry) {
          var agentId = entry[0], info = entry[1];
          if ((info.agent_type || 'orchestrator') !== agentType) return;
          var matchSpan = spans.find(function(sp) { return sp.id === agentId && sp.type === 'agent'; });
          var taskUuid = matchSpan ? (matchSpan.task_uuid || '') : '';
          invocations.push({
            id: agentId,
            label: agentType + ' ' + truncId(agentId, 7),
            value: info.total || 0,
            agentType: agentType,
            taskUuid: taskUuid
          });
        });
      } else {
        // Group spans by agent id
        var byId = {};
        spans.forEach(function(sp) {
          if (sp.type !== 'agent') return;
          if ((sp.agent_type || 'orchestrator') !== agentType) return;
          if (!byId[sp.id]) byId[sp.id] = { value: 0, taskUuid: sp.task_uuid || '' };
          byId[sp.id].value += sp.tool_calls || 0;
          if (sp.task_uuid) byId[sp.id].taskUuid = sp.task_uuid;
        });
        Object.entries(byId).forEach(function(entry) {
          invocations.push({
            id: entry[0],
            label: agentType + ' ' + truncId(entry[0], 7),
            value: entry[1].value,
            agentType: agentType,
            taskUuid: entry[1].taskUuid || ''
          });
        });
      }

      invocations.sort(function(a, b) { return b.value - a.value; });
      var maxVal = invocations.length > 0 ? invocations[0].value : 1;
      if (maxVal === 0) maxVal = 1;
      var totalVal = invocations.reduce(function(s, e) { return s + e.value; }, 0);

      if (currentProject) {
        decompStack = [
          { level: 'projects', label: 'All Projects' },
          { level: 'project', label: currentProject.name, slug: currentProject.slug },
          { level: 'session', label: sessionName, sessionId: sessionId },
          { level: 'agentType', label: agentType, sessionId: sessionId, agentType: agentType }
        ];
      } else {
        decompStack = [
          { level: 'sessions', label: 'All Sessions' },
          { level: 'session', label: sessionName, sessionId: sessionId },
          { level: 'agentType', label: agentType, sessionId: sessionId, agentType: agentType }
        ];
      }

      var html = renderDecompBreadcrumb();
      html += '<div class="decomp-total-label">' + esc(agentType) + ' - ' + decompUnitLabel() + ': <b>' + decompFormatValue(totalVal) + '</b></div>';
      html += '<div class="decomp-bars">';

      var color = agentHex(agentType);
      invocations.forEach(function(inv, idx) {
        var pct = maxVal > 0 ? (inv.value / maxVal * 100) : 0;
        var barColor = idx === 0 ? color : shiftColor(color, idx);
        var viewBtn = '';
        if (inv.taskUuid) {
          viewBtn = ' <span class="decomp-view-btn" onclick="event.stopPropagation(); showTaskOverlay(\'' + esc(inv.taskUuid) + '\')" title="View task">&#128196;</span>';
        } else {
          viewBtn = ' <span class="decomp-view-btn" onclick="event.stopPropagation(); searchAndShowTask(\'\', \'' + esc(agentType) + '\', 0)" title="View task">&#128196;</span>';
        }
        html += '<div class="decomp-bar-row" onclick="decompDrillInvocation(\'' + esc(sessionId) + '\', \'' + esc(agentType) + '\', \'' + esc(inv.id) + '\')">';
        html += '<div class="decomp-bar-label" title="' + esc(inv.id) + '">' + esc(inv.label) + viewBtn + '</div>';
        html += decompBarTrackHtml(pct, inv.value, barColor);
        html += '<div class="decomp-bar-value">' + decompFormatValue(inv.value) + '</div>';
        html += '</div>';
      });

      html += '</div>';
      el.innerHTML = html;
    }

    // Level 3: Drill into invocation -> agent + workers
    function decompDrillInvocation(sessionId, agentType, agentId) {
      var el = document.getElementById('decomp-view');
      var tokenData = decompTokenCache[sessionId] || {};
      var spans = decompSpansCache[sessionId] || [];
      var session = sessionsCache.find(function(s) { return s.session_id === sessionId; });
      var sessionName = session ? (session.name || truncId(sessionId, 30)) : truncId(sessionId, 30);

      // Find the agent span and its workers
      var items = [];
      if (globalUnit === 'tokens') {
        var agentInfo = tokenData[agentId];
        if (agentInfo) {
          items.push({
            label: agentType + ' (agent)',
            value: agentInfo.total || 0,
            color: agentHex(agentType),
            isAgent: true
          });
        }
        // Workers: find spans whose parent_id references this agent's task_uuid
        var agentSpan = spans.find(function(sp) { return sp.id === agentId && sp.type === 'agent'; });
        var taskUuid = agentSpan ? agentSpan.task_uuid : null;
        spans.forEach(function(sp) {
          if (sp.type !== 'worker') return;
          var isChild = false;
          if (sp.parent_id === 'task:' + taskUuid && taskUuid) isChild = true;
          if (sp.parent_id === 'worker:' + agentId) isChild = true;
          if (!isChild) return;
          // Worker token data from spans.tokens or estimate from token cache
          var wTokens = 0;
          if (sp.tokens) {
            wTokens = (sp.tokens.input_tokens || 0) + (sp.tokens.output_tokens || 0) +
                      (sp.tokens.cache_creation || 0) + (sp.tokens.cache_read || 0);
          }
          items.push({
            label: (sp.agent_type || 'worker') + ' / ' + truncId(sp.id, 8),
            value: wTokens,
            color: agentHex(sp.agent_type || 'worker'),
            isAgent: false
          });
        });
      } else {
        // Tools mode
        var agentSpans = spans.filter(function(sp) { return sp.id === agentId && sp.type === 'agent'; });
        var agentTools = agentSpans.reduce(function(s, sp) { return s + (sp.tool_calls || 0); }, 0);
        items.push({
          label: agentType + ' (agent)',
          value: agentTools,
          color: agentHex(agentType),
          isAgent: true
        });
        // Workers
        var agentSpan = agentSpans[0];
        var taskUuid = agentSpan ? agentSpan.task_uuid : null;
        spans.forEach(function(sp) {
          if (sp.type !== 'worker') return;
          var isChild = false;
          if (sp.parent_id === 'task:' + taskUuid && taskUuid) isChild = true;
          if (sp.parent_id === 'worker:' + agentId) isChild = true;
          if (!isChild) return;
          items.push({
            label: (sp.agent_type || 'worker') + ' / ' + truncId(sp.id, 8),
            value: sp.tool_calls || 0,
            color: agentHex(sp.agent_type || 'worker'),
            isAgent: false
          });
        });
      }

      items.sort(function(a, b) { return b.value - a.value; });
      var maxVal = items.length > 0 ? items[0].value : 1;
      if (maxVal === 0) maxVal = 1;
      var totalVal = items.reduce(function(s, e) { return s + e.value; }, 0);

      if (currentProject) {
        decompStack = [
          { level: 'projects', label: 'All Projects' },
          { level: 'project', label: currentProject.name, slug: currentProject.slug },
          { level: 'session', label: sessionName, sessionId: sessionId },
          { level: 'agentType', label: agentType, sessionId: sessionId, agentType: agentType },
          { level: 'invocation', label: truncId(agentId, 10), sessionId: sessionId, agentType: agentType, agentId: agentId }
        ];
      } else {
        decompStack = [
          { level: 'sessions', label: 'All Sessions' },
          { level: 'session', label: sessionName, sessionId: sessionId },
          { level: 'agentType', label: agentType, sessionId: sessionId, agentType: agentType },
          { level: 'invocation', label: truncId(agentId, 10), sessionId: sessionId, agentType: agentType, agentId: agentId }
        ];
      }

      var html = renderDecompBreadcrumb();
      html += '<div class="decomp-total-label">' + esc(agentType) + ' / ' + esc(truncId(agentId, 10)) + ' - ' + decompUnitLabel() + ': <b>' + decompFormatValue(totalVal) + '</b></div>';
      html += '<div class="decomp-bars">';

      items.forEach(function(item) {
        var pct = maxVal > 0 ? (item.value / maxVal * 100) : 0;
        html += '<div class="decomp-bar-row" style="cursor:default;">';
        html += '<div class="decomp-bar-label">' + esc(item.label) + '</div>';
        html += decompBarTrackHtml(pct, item.value, item.color);
        html += '<div class="decomp-bar-value">' + decompFormatValue(item.value) + '</div>';
        html += '</div>';
      });

      html += '</div>';
      el.innerHTML = html;
    }

    // Breadcrumb navigation
    function renderDecompBreadcrumb() {
      if (decompStack.length <= 1) return '';
      var html = '<div class="decomp-breadcrumb">';
      decompStack.forEach(function(crumb, i) {
        if (i < decompStack.length - 1) {
          html += '<span class="decomp-breadcrumb-item" onclick="decompNavigateTo(' + i + ')">' + esc(crumb.label) + '</span>';
          html += '<span class="decomp-breadcrumb-sep">&rsaquo;</span>';
        } else {
          html += '<span class="decomp-breadcrumb-current">' + esc(crumb.label) + '</span>';
        }
      });
      html += '</div>';
      return html;
    }

    function decompNavigateTo(index) {
      var crumb = decompStack[index];
      if (!crumb) return;
      if (crumb.level === 'projects') {
        currentProject = null;
        renderDecompProjectLevel();
      } else if (crumb.level === 'project') {
        decompZoomProject(crumb.slug);
      } else if (crumb.level === 'sessions') {
        renderDecompSessionLevel();
      } else if (crumb.level === 'session') {
        decompDrillSession(crumb.sessionId);
      } else if (crumb.level === 'agentType') {
        decompDrillAgentType(crumb.sessionId, crumb.agentType);
      }
    }

    // ===== Project support =====
    async function loadProjects() {
      try {
        var resp = await fetch('/api/projects');
        projectsCache = await resp.json();
      } catch(e) { projectsCache = []; }
    }

    // Helper: compute project token/tool value
    function projectValue(p) {
      if (globalUnit === 'tokens') {
        return (p.total_input_tokens || 0) + (p.total_output_tokens || 0) +
               (p.total_cache_creation_tokens || 0) + (p.total_cache_read_tokens || 0);
      }
      return p.total_tool_calls || 0;
    }

    // Helper: compute max project value across projectsCache
    function maxProjectValue() {
      return projectsCache.reduce(function(m, p) { var v = projectValue(p); return v > m ? v : m; }, 1);
    }

    // Render project-level bars in decomp view
    function renderDecompProjectLevel() {
      var el = document.getElementById('decomp-view');
      if (!projectsCache || projectsCache.length === 0) {
        el.innerHTML = '<div class="empty-state">No projects found</div>';
        return;
      }

      var sorted = projectsCache.slice().sort(function(a, b) {
        if (decompSort === 'time') {
          return (b.last_timestamp || '').localeCompare(a.last_timestamp || '');
        }
        return projectValue(b) - projectValue(a);
      });

      var maxVal = sorted.reduce(function(m, p) { var v = projectValue(p); return v > m ? v : m; }, 1);
      var totalVal = sorted.reduce(function(s, p) { return s + projectValue(p); }, 0);

      decompStack = [{ level: 'projects', label: 'All Projects' }];

      var html = renderDecompBreadcrumb();
      html += '<div class="decomp-total-label">' + decompUnitLabel() + ': <b>' + decompFormatValue(totalVal) + '</b></div>';
      html += '<div class="decomp-bars">';

      sorted.forEach(function(p) {
        var slug = p.project_slug;
        var val = projectValue(p);
        var pct = maxVal > 0 ? (val / maxVal * 100) : 0;
        var color = projectColor(slug);
        html += '<div class="decomp-bar-row" data-project-slug="' + esc(slug) + '" onclick="decompToggleProject(this, \'' + esc(slug) + '\')">';
        html += '<div class="decomp-bar-label" title="' + esc(p.project_path || '') + '">' +
                  esc(p.display_name) +
                  ' <span class="project-badge" onclick="event.stopPropagation()">' + (p.session_count || 0) + ' sessions</span>' +
                '</div>';
        html += decompBarTrackHtml(pct, val, color);
        html += '<div class="decomp-bar-value">' + decompFormatValue(val) + '</div>';
        html += '<span class="decomp-zoom-btn" onclick="event.stopPropagation(); decompZoomProject(\'' + esc(slug) + '\')" title="Zoom into project">&#8594;</span>';
        html += '</div>';
        html += '<div class="decomp-children" id="decomp-project-children-' + esc(slug) + '" style="display:none;margin-left:20px;"></div>';
      });

      html += '</div>';
      morphdomUpdate(el, html);
    }

    // Inline expand a project to show SESSION bars (expandable to agent types)
    async function decompToggleProject(rowEl, slug) {
      var childDiv = document.getElementById('decomp-project-children-' + slug);
      if (!childDiv) return;
      var projectRow = document.querySelector('.decomp-bar-row[data-project-slug="' + slug + '"]');
      if (projectRow) rowEl = projectRow;

      // Toggle - collapse
      if (childDiv.style.display !== 'none') {
        childDiv.style.display = 'none';
        childDiv.innerHTML = '';
        rowEl.classList.remove('expanded');
        expandedProjectSlugs.delete(slug);
        var ghost = rowEl.querySelector('.decomp-bar-ghost');
        if (ghost) ghost.remove();
        var parentFill = rowEl.querySelector('.decomp-bar-fill');
        var parentValEl = rowEl.querySelector('.decomp-bar-value');
        if (parentFill && parentFill.dataset.origWidth) {
          parentFill.style.width = parentFill.dataset.origWidth;
          parentFill.textContent = parentFill.dataset.origText || '';
          if (parentValEl) parentValEl.textContent = parentValEl.dataset.origText || '';
        }
        return;
      }

      expandedProjectSlugs.add(slug);
      rowEl.classList.add('expanded');
      childDiv.style.display = 'block';
      childDiv.innerHTML = '<div class="empty-state" style="font-size:11px">Loading...</div>';

      try {
        // Fetch project sessions
        if (!projectSessionsCache[slug]) {
          var resp = await fetch('/api/projects/' + encodeURIComponent(slug) + '/sessions');
          projectSessionsCache[slug] = await resp.json();
        }

        var sessions = projectSessionsCache[slug] || [];
        var sorted = sessions.slice().sort(function(a, b) {
          if (decompSort === 'time') {
            return (a.first_timestamp || '').localeCompare(b.first_timestamp || '');
          }
          return decompSessionValue(b) - decompSessionValue(a);
        });

        var maxProjVal = maxProjectValue();

        var html = '';
        sorted.forEach(function(s) {
          var val = decompSessionValue(s);
          var pct = maxProjVal > 0 ? (val / maxProjVal * 100) : 0;
          var name = s.name || truncId(s.session_id, 30);
          html += '<div class="decomp-bar-row" data-sid="' + esc(s.session_id) + '" onclick="event.stopPropagation(); decompToggleSession(this, \'' + esc(s.session_id) + '\')">';
          html += '<div class="decomp-bar-label" title="' + esc(s.session_id) + '">' + esc(name) + '</div>';
          html += decompBarTrackHtml(pct, val, '#7950f2');
          html += '<div class="decomp-bar-value">' + decompFormatValue(val) + '</div>';
          html += '</div>';
          // Placeholder for inline session expansion (agent type breakdown)
          html += '<div class="decomp-children" id="decomp-children-' + esc(s.session_id) + '" style="display:none;margin-left:20px;"></div>';
        });

        if (sorted.length === 0) {
          html = '<div class="empty-state" style="font-size:11px">No sessions in this project</div>';
        }

        // Ghost on parent project bar
        var proj = projectsCache.find(function(p) { return p.project_slug === slug; });
        var projVal = proj ? projectValue(proj) : 0;
        var childrenTotal = sorted.reduce(function(s, sess) { return s + decompSessionValue(sess); }, 0);
        var unattributed = Math.max(0, projVal - childrenTotal);
        var parentFill = rowEl.querySelector('.decomp-bar-fill');
        var parentTrack = rowEl.querySelector('.decomp-bar-track');
        var parentValEl = rowEl.querySelector('.decomp-bar-value');
        if (parentFill && parentTrack) {
          var origWidth = parentFill.style.width;
          parentFill.dataset.origWidth = origWidth;
          parentFill.dataset.origText = parentFill.textContent;
          if (parentValEl) parentValEl.dataset.origText = parentValEl.textContent;
          parentTrack.style.position = 'relative';
          var pColor = projectColor(slug);
          var ghost = document.createElement('div');
          ghost.className = 'decomp-bar-ghost';
          ghost.style.cssText = 'position:absolute;top:0;left:0;height:100%;width:' + origWidth + ';background:' + pColor + ';opacity:0.15;border-radius:4px;pointer-events:none;';
          parentTrack.insertBefore(ghost, parentFill);
          var unPct = maxProjVal > 0 ? (unattributed / maxProjVal * 100) : 0;
          if (unattributed === 0) {
            parentFill.style.width = '3px';
            parentFill.classList.add('decomp-bar-zero');
          } else {
            parentFill.style.width = unPct + '%';
            parentFill.classList.remove('decomp-bar-zero');
          }
          parentFill.textContent = unattributed > 0 && unPct > 15 ? decompFormatValue(unattributed) : '';
          if (parentValEl) parentValEl.textContent = decompFormatValue(unattributed);
        }

        childDiv.innerHTML = html;
      } catch(e) {
        childDiv.innerHTML = '<div class="empty-state" style="font-size:11px">Failed to load</div>';
      }
    }

    // Zoom into a project, showing its sessions in decomp view
    async function decompZoomProject(slug) {
      var proj = projectsCache.find(function(p) { return p.project_slug === slug; });
      var projectName = proj ? proj.display_name : slug;
      currentProject = { slug: slug, name: projectName };

      var el = document.getElementById('decomp-view');
      el.innerHTML = '<div class="empty-state">Loading...</div>';

      try {
        if (!projectSessionsCache[slug]) {
          var resp = await fetch('/api/projects/' + encodeURIComponent(slug) + '/sessions');
          projectSessionsCache[slug] = await resp.json();
        }
        renderDecompSessionLevel();
      } catch(e) {
        currentProject = null;
        el.innerHTML = '<div class="empty-state">Failed to load project sessions</div>';
      }
    }

    // Render project summary cards in time view (project level)
    function renderProjectTimeView() {
      var el = document.getElementById('session-list');
      if (!projectsCache || projectsCache.length === 0) {
        el.innerHTML = '<div class="empty-state">No projects found yet</div>';
        return;
      }

      var html = projectsCache.map(function(p) {
        var slug = p.project_slug;
        var color = projectColor(slug);
        var totalTokens = (p.total_input_tokens || 0) + (p.total_output_tokens || 0) +
                          (p.total_cache_creation_tokens || 0) + (p.total_cache_read_tokens || 0);
        var lastActive = p.last_timestamp ? fmtTime(p.last_timestamp) : '';
        return '<div class="project-header" data-project-slug="' + esc(slug) + '" onclick="toggleProjectTimeExpand(this, \'' + esc(slug) + '\')">' +
          '<div class="project-color-dot" style="background:' + color + '"></div>' +
          '<div class="project-name">' + esc(p.display_name) + '</div>' +
          '<div class="project-meta">' + esc(p.project_path || '') + '</div>' +
          '<div class="project-badge">' + (p.session_count || 0) + ' sessions</div>' +
          (totalTokens ? '<div class="project-meta">' + fmtTokens(totalTokens) + ' tokens</div>' : '') +
          (lastActive ? '<div class="project-meta" style="margin-left:auto">' + esc(lastActive) + '</div>' : '') +
          '<span class="decomp-zoom-btn" style="' + (lastActive ? '' : 'margin-left:auto') + '" onclick="event.stopPropagation(); zoomIntoProject(\'' + esc(slug) + '\')" title="Zoom into project sessions">&#8594;</span>' +
        '</div>' +
        '<div class="project-time-children" id="project-time-children-' + esc(slug) + '" style="display:none;margin-left:20px;margin-bottom:4px;"></div>';
      }).join('');

      morphdomUpdate(el, html);
    }

    // Toggle inline expand for a project in Time view (show session cards)
    async function toggleProjectTimeExpand(headerEl, slug) {
      var childDiv = document.getElementById('project-time-children-' + slug);
      if (!childDiv) return;

      // Toggle collapse
      if (childDiv.style.display !== 'none') {
        childDiv.style.display = 'none';
        childDiv.innerHTML = '';
        headerEl.classList.remove('expanded');
        headerEl.style.borderColor = '';
        expandedProjectSlugs.delete(slug);
        return;
      }

      expandedProjectSlugs.add(slug);
      headerEl.classList.add('expanded');
      childDiv.style.display = 'block';
      childDiv.innerHTML = '<div class="empty-state" style="font-size:11px;padding:8px 14px;">Loading...</div>';
      headerEl.style.borderColor = 'var(--accent-dim)';

      try {
        // Fetch sessions for the project
        if (!projectSessionsCache[slug]) {
          var resp = await fetch('/api/projects/' + encodeURIComponent(slug) + '/sessions');
          projectSessionsCache[slug] = await resp.json();
        }

        var sessions = projectSessionsCache[slug] || [];

        if (sessions.length === 0) {
          childDiv.innerHTML = '<div class="empty-state" style="font-size:11px;padding:8px 14px;">No sessions in this project</div>';
          return;
        }

        var html = sessions.map(buildSessionCardHtml).join('');
        childDiv.innerHTML = html;
      } catch(e) {
        childDiv.innerHTML = '<div class="empty-state" style="font-size:11px;padding:8px 14px;">Failed to load</div>';
      }
    }

    // Helper: build session card HTML (reused in time view project zoom)
    function buildSessionCardHtml(s) {
      var flowPills = (s.agent_types || []).map(function(t) {
        return '<span class="flow-pill" style="background:' + agentHex(t) + '">' + esc(t) + '</span>';
      }).join('<span class="flow-arrow">&rsaquo;</span>');
      var displayName = s.name || truncId(s.session_id, 50);
      var tokenHtml = '';
      if (s.input_tokens || s.output_tokens || s.cache_creation_tokens || s.cache_read_tokens) {
        tokenHtml = '<div class="token-badges">';
        if (s.input_tokens) tokenHtml += '<span class="token-badge">In: <b>' + fmtTokens(s.input_tokens) + '</b></span>';
        if (s.output_tokens) tokenHtml += '<span class="token-badge">Out: <b>' + fmtTokens(s.output_tokens) + '</b></span>';
        var cacheTotal = (s.cache_creation_tokens || 0) + (s.cache_read_tokens || 0);
        if (cacheTotal) tokenHtml += '<span class="token-badge">Cache: <b>' + fmtTokens(cacheTotal) + '</b></span>';
        if (s.message_count) tokenHtml += '<span class="token-badge">Msgs: <b>' + s.message_count + '</b></span>';
        tokenHtml += '</div>';
      }
      return '<div class="session-card" data-sid="' + esc(s.session_id) + '">' +
        '<div class="session-head" onclick="toggleSession(this)">' +
          '<div>' +
            '<span class="session-name" onclick="startRenameSession(event, \'' + esc(s.session_id) + '\')" title="Click to rename">' + esc(displayName) + '</span>' +
            '<div class="session-time">' + esc(fmtTime(s.first_timestamp)) +
              ' &mdash; ' + esc(fmtDuration(s.duration_seconds)) + '</div>' +
            '<div class="session-flow">' + flowPills + '</div>' +
            tokenHtml +
          '</div>' +
          '<div class="session-stats">' +
            '<span class="stat">agents <b>' + s.agent_count + '</b></span>' +
            '<span class="stat">workers <b>' + s.worker_count + '</b></span>' +
            '<span class="stat">events <b>' + s.event_count + '</b></span>' +
            '<span class="stat">tools <b>' + s.tool_call_count + '</b></span>' +
          '</div>' +
        '</div>' +
        '<div class="session-body">' +
          '<div class="tree-loading">Loading tree...</div>' +
        '</div>' +
      '</div>';
    }

    // Zoom into a project in time view (show its session cards with back nav)
    async function zoomIntoProject(slug) {
      var proj = projectsCache.find(function(p) { return p.project_slug === slug; });
      if (!proj) return;
      var projectName = proj.display_name;
      currentProject = { slug: slug, name: projectName };

      // Show expand/collapse buttons now that we're showing session cards
      document.getElementById('ctrl-expand').style.display = '';
      document.getElementById('ctrl-collapse').style.display = '';

      if (!projectSessionsCache[slug]) {
        document.getElementById('session-list').innerHTML = '<div class="empty-state">Loading...</div>';
        try {
          var resp = await fetch('/api/projects/' + encodeURIComponent(slug) + '/sessions');
          projectSessionsCache[slug] = await resp.json();
        } catch(e) {
          projectSessionsCache[slug] = [];
        }
      }

      var sessions = projectSessionsCache[slug] || [];
      var el = document.getElementById('session-list');
      var color = projectColor(slug);

      var html = '<div class="project-header" style="margin-bottom:8px;" onclick="currentProject=null; document.getElementById(\'ctrl-expand\').style.display=\'none\'; document.getElementById(\'ctrl-collapse\').style.display=\'none\'; renderProjectTimeView()">' +
        '<div class="project-color-dot" style="background:' + color + '"></div>' +
        '<span style="font-size:11px;color:var(--text-dim)">&#8592; All Projects</span>' +
        '<span style="margin-left:8px;" class="project-name">' + esc(projectName) + '</span>' +
      '</div>';

      if (!sessions.length) {
        html += '<div class="empty-state">No sessions in this project</div>';
      } else {
        html += sessions.map(buildSessionCardHtml).join('');
      }

      morphdomUpdate(el, html);
    }

    // ===== Auto-refresh =====
    function startAutoRefresh() {
      loadSessions();
      refreshTimer = setInterval(loadSessions, 10000);
    }

    // ===== Init =====
    startAutoRefresh();
  </script>
</body>
</html>
