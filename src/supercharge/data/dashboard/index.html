<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SuperchargeAI Dashboard</title>
  <script src="/static/cytoscape.min.js"></script>
  <script src="/static/dagre.min.js"></script>
  <script src="/static/cytoscape-dagre.js"></script>
  <script src="/static/d3.min.js"></script>
  <script src="/static/marked.min.js"></script>
  <script src="/static/morphdom.min.js"></script>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="header">
    <h1><span>Supercharge</span>AI</h1>
    <div class="tabs">
      <button class="tab-btn active" data-tab="sessions">Sessions</button>
      <button class="tab-btn" data-tab="stats">Statistics</button>
      <button class="tab-btn" data-tab="browse">Browse</button>
    </div>
  </div>

  <div class="main">
    <!-- Sessions Tab -->
    <div id="tab-sessions" class="tab-panel active">
      <div class="controls">
        <div class="unit-selector">
          <button class="unit-btn active" data-unit="time" onclick="setGlobalUnit('time')">Time</button>
          <button class="unit-btn" data-unit="tokens" onclick="setGlobalUnit('tokens')">Tokens</button>
          <button class="unit-btn" data-unit="tools" onclick="setGlobalUnit('tools')">Tools</button>
        </div>
        <span style="margin-left:16px;border-left:2px solid var(--border);height:24px;display:inline-block;vertical-align:middle;margin-right:16px"></span>
        <button class="ctrl-btn" id="ctrl-expand" onclick="expandAllSessions()">Expand All</button>
        <button class="ctrl-btn" id="ctrl-collapse" onclick="collapseAllSessions()">Collapse All</button>
        <div class="sort-selector" id="sort-selector" style="display:none;align-items:center;">
          <span style="margin-left:16px;border-left:2px solid var(--border);height:24px;display:inline-block;vertical-align:middle;margin-right:16px"></span>
          <span style="font-size:11px;color:var(--text-dim);margin-right:6px;">Sort:</span>
          <div class="unit-selector">
            <button class="unit-btn active" data-sort="amount" onclick="setDecompSort('amount')">Amount</button>
            <button class="unit-btn" data-sort="time" onclick="setDecompSort('time')">Time</button>
          </div>
        </div>
        <span class="status"><span class="dot"></span>Auto-refresh 10s</span>
      </div>
      <div id="session-list" class="session-list">
        <div class="empty-state">Loading sessions...</div>
      </div>
      <div id="decomp-view" class="decomp-container" style="display:none;">
        <div class="empty-state">Loading...</div>
      </div>
    </div>

    <!-- Stats Tab -->
    <div id="tab-stats" class="tab-panel">
      <div id="stats-content">
        <div class="empty-state">Loading statistics...</div>
      </div>
    </div>

    <!-- Browse Tab -->
    <div id="tab-browse" class="tab-panel">
      <div class="browse-subtabs">
        <button class="browse-subtab-btn active" data-subtab="framework" onclick="switchBrowseSubtab('framework', this)">Framework</button>
        <button class="browse-subtab-btn" data-subtab="projects" onclick="switchBrowseSubtab('projects', this)">Projects</button>
      </div>
      <div id="browse-framework" class="browse-subpanel active">
        <div class="empty-state">Loading memories...</div>
      </div>
      <div id="browse-projects" class="browse-subpanel" style="display:none">
        <div class="empty-state">Loading tasks...</div>
      </div>
    </div>
  </div>

  <script>
    // ===== Globals =====
    const AGENT_COLORS = {
      plan: 'plan', code: 'code', review: 'review',
      memory: 'memory', research: 'research',
      document: 'document', consistency: 'consistency'
    };

    // Hex colors for Cytoscape nodes (from task spec)
    const AGENT_HEX = {
      plan: '#6366f1',
      code: '#22c55e',
      review: '#f97316',
      memory: '#a855f7',
      research: '#14b8a6',
      document: '#6b7280',
      consistency: '#ec4899'
    };

    // Tool colors for breakdown charts
    const TOOL_COLORS = {
      Bash: '#14b8a6',
      Read: '#4dabf7',
      Write: '#ff922b',
      Edit: '#51cf66',
      Glob: '#cc5de8',
      Grep: '#f06595',
      WebSearch: '#22d3ee',
      WebFetch: '#fbbf24',
      Task: '#ef4444',
      TodoRead: '#6366f1',
      TodoWrite: '#818cf8',
      Agent: '#a78bfa'
    };

    function getToolColor(name) {
      return TOOL_COLORS[name] || '#6b7280';
    }

    let sessionsCache = [];
    let treeCacheMap = {};
    let cytoscapeInstances = {};
    let activeViews = {};
    let refreshTimer = null;
    var prevSessionsJSON = '';
    var prevProjectsJSON = '';

    // ===== DOM diffing helper =====
    function morphdomUpdate(el, html) {
      if (typeof morphdom === 'undefined') {
        el.innerHTML = html;
        return;
      }
      var wrapper = document.createElement('div');
      wrapper.innerHTML = html;
      morphdom(el, wrapper, {
        childrenOnly: true,
        onBeforeElUpdated: function(fromEl, toEl) {
          // Preserve expanded/collapsed states
          if (fromEl.classList && fromEl.classList.contains('expanded') && !toEl.classList.contains('expanded')) {
            return false;
          }
          // Preserve display:none/block on child containers toggled by user
          if (fromEl.classList && fromEl.classList.contains('decomp-children')) {
            toEl.style.display = fromEl.style.display;
            if (fromEl.innerHTML && fromEl.style.display !== 'none') {
              toEl.innerHTML = fromEl.innerHTML;
            }
          }
          if (fromEl.classList && fromEl.classList.contains('project-time-children')) {
            toEl.style.display = fromEl.style.display;
            if (fromEl.innerHTML && fromEl.style.display !== 'none') {
              toEl.innerHTML = fromEl.innerHTML;
            }
          }
          return true;
        }
      });
    }

    // ===== Tab switching =====
    document.querySelectorAll('.tab-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
        document.querySelectorAll('.tab-panel').forEach(function(p) { p.classList.remove('active'); });
        btn.classList.add('active');
        var panel = document.getElementById('tab-' + btn.dataset.tab);
        panel.classList.add('active');

        if (btn.dataset.tab === 'sessions') {
          // Re-render sessions view if currentProject changed while on another tab
          setGlobalUnit(globalUnit);
        }
        if (btn.dataset.tab === 'stats') loadStats();
        if (btn.dataset.tab === 'browse') loadBrowse();
      });
    });

    // ===== Utility =====
    function esc(s) {
      var d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function truncId(id, len) {
      len = len || 12;
      if (!id) return '---';
      return id.length > len ? id.slice(0, len) + '...' : id;
    }

    function fmtDuration(sec) {
      if (sec == null) return '--';
      if (sec < 60) return sec.toFixed(1) + 's';
      if (sec < 3600) return (sec / 60).toFixed(1) + 'm';
      return (sec / 3600).toFixed(1) + 'h';
    }

    function fmtTime(iso) {
      if (!iso) return '--';
      try {
        var d = new Date(iso);
        return d.toLocaleString(undefined, {
          month: 'short', day: 'numeric',
          hour: '2-digit', minute: '2-digit', second: '2-digit'
        });
      } catch(e) { return iso; }
    }

    function fmtTimelineLabel(key, granularity, index, allKeys) {
      // Format label based on granularity
      if (!key) return '';
      try {
        if (granularity === 'hour') {
          var d = new Date(key + ':00:00');
          if (isNaN(d.getTime())) return key;
          var hourLabel = d.toLocaleString('en-US', { hour: 'numeric' });
          // Show date on first bar or when date changes
          if (index === 0 || (allKeys && index > 0 && key.slice(0, 10) !== allKeys[index - 1].slice(0, 10))) {
            return d.toLocaleString('en-US', { month: 'short', day: 'numeric' }) + '\n' + hourLabel;
          }
          return hourLabel;
        } else if (granularity === 'day') {
          var d = new Date(key + 'T00:00:00');
          if (isNaN(d.getTime())) return key;
          var days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
          return days[d.getDay()] + ' ' + d.getDate();
        } else if (granularity === 'week') {
          // key is start date of week like "2026-03-10"
          var d = new Date(key + 'T00:00:00');
          if (isNaN(d.getTime())) return key;
          var end = new Date(d);
          end.setDate(end.getDate() + 6);
          var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
          return months[d.getMonth()] + ' ' + d.getDate() + '-' + end.getDate();
        } else if (granularity === 'month') {
          // key like "2026-03"
          var parts = key.split('-');
          var d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, 1);
          if (isNaN(d.getTime())) return key;
          return d.toLocaleString('en-US', { month: 'short' }) + ' ' + d.getFullYear();
        }
        return key;
      } catch(e) { return key; }
    }

    function aggregateTimeline(rawTimeline, granularity) {
      // rawTimeline: [{hour: "2026-03-15T09", count: N}, ...]
      // Returns [{key: "...", count: N}, ...] aggregated by granularity
      if (!rawTimeline || !rawTimeline.length) return [];
      if (granularity === 'hour') {
        return rawTimeline.map(function(t) { return {key: t.hour, count: t.count}; });
      }
      var buckets = {};
      var order = [];
      rawTimeline.forEach(function(t) {
        var bucketKey;
        if (granularity === 'day') {
          bucketKey = t.hour.slice(0, 10); // "2026-03-15"
        } else if (granularity === 'week') {
          var d = new Date(t.hour + ':00:00');
          var day = d.getDay(); // 0=Sun
          var mon = new Date(d);
          mon.setDate(mon.getDate() - ((day + 6) % 7)); // Monday
          bucketKey = mon.toISOString().slice(0, 10);
        } else if (granularity === 'month') {
          bucketKey = t.hour.slice(0, 7); // "2026-03"
        }
        if (!buckets[bucketKey]) {
          buckets[bucketKey] = 0;
          order.push(bucketKey);
        }
        buckets[bucketKey] += t.count;
      });
      return order.map(function(k) { return {key: k, count: buckets[k]}; });
    }

    function autoGranularity(rawTimeline) {
      if (!rawTimeline || rawTimeline.length < 2) return 'hour';
      var first = rawTimeline[0].hour.slice(0, 10);
      var last = rawTimeline[rawTimeline.length - 1].hour.slice(0, 10);
      var d0 = new Date(first + 'T00:00:00');
      var d1 = new Date(last + 'T00:00:00');
      var days = (d1 - d0) / (1000 * 60 * 60 * 24);
      if (days > 3) return 'day';
      return 'hour';
    }

    function filterTimelineByPeriod(rawTimeline, period) {
      if (!rawTimeline || !rawTimeline.length || period === 'all') return rawTimeline;
      var now = new Date();
      var cutoff;
      if (period === '24h') {
        cutoff = new Date(now - 24 * 60 * 60 * 1000);
      } else if (period === '7d') {
        cutoff = new Date(now - 7 * 24 * 60 * 60 * 1000);
      } else if (period === '30d') {
        cutoff = new Date(now - 30 * 24 * 60 * 60 * 1000);
      } else {
        return rawTimeline;
      }
      return rawTimeline.filter(function(t) {
        var d = new Date(t.hour + ':00:00');
        return d >= cutoff;
      });
    }

    function fmtTimelineTooltip(item, granularity) {
      var count = item.count + ' event' + (item.count !== 1 ? 's' : '');
      if (granularity === 'hour') {
        var d = new Date(item.key + ':00:00');
        if (isNaN(d.getTime())) return count;
        var label = d.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric' });
        return label + '\n' + count;
      } else if (granularity === 'day') {
        var d = new Date(item.key + 'T00:00:00');
        return d.toLocaleString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) + '\n' + count;
      } else if (granularity === 'week') {
        var d = new Date(item.key + 'T00:00:00');
        var end = new Date(d);
        end.setDate(end.getDate() + 6);
        var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        return months[d.getMonth()] + ' ' + d.getDate() + ' - ' + months[end.getMonth()] + ' ' + end.getDate() + '\n' + count;
      } else if (granularity === 'month') {
        var d = new Date(item.key + '-01T00:00:00');
        return d.toLocaleString('en-US', { month: 'long', year: 'numeric' }) + '\n' + count;
      }
      return count;
    }

    function fmtSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function agentColor(type) {
      return AGENT_COLORS[type] || 'document';
    }

    function agentHex(type) {
      return AGENT_HEX[type] || '#6b7280';
    }

    // Project colors - derive consistent color from slug hash
    var PROJECT_COLORS = ['#7950f2','#4dabf7','#51cf66','#ff922b','#cc5de8','#20c997','#f06595','#fab005','#e64980','#15aabf'];
    function projectColor(slug) {
      var hash = 0;
      for (var i = 0; i < slug.length; i++) hash = ((hash << 5) - hash) + slug.charCodeAt(i);
      return PROJECT_COLORS[Math.abs(hash) % PROJECT_COLORS.length];
    }

    function fmtTokens(n) {
      if (n == null || n === 0) return '0';
      if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
      if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
      return '' + n;
    }

    // ===== Flatten tree for waterfall =====
    function flattenTree(node, depth, sessionStart, sessionDuration, result) {
      depth = depth || 0;
      result = result || [];
      if (node.type !== 'event') {
        result.push({
          type: node.type,
          agent_type: node.agent_type,
          id: node.id,
          started_at: node.started_at,
          duration_seconds: node.duration_seconds,
          tool_calls: node.tool_calls,
          tools: node.tools || {},
          depth: depth
        });
      }
      if (node.children) {
        node.children.forEach(function(c) {
          flattenTree(c, depth + 1, sessionStart, sessionDuration, result);
        });
      }
      return result;
    }

    // ===== Tool summary string =====
    function toolSummaryInline(tools) {
      if (!tools || !Object.keys(tools).length) return '';
      return Object.entries(tools)
        .sort(function(a, b) { return b[1] - a[1]; })
        .map(function(e) { return e[0] + ':' + e[1]; })
        .join(' ');
    }

    // ===== Sessions =====
    async function loadSessions() {
      try {
        var fetches = [
          fetch('/api/sessions').then(function(r) { return r.json(); }),
          fetch('/api/projects').then(function(r) { return r.json(); })
        ];
        if (currentProject) {
          fetches.push(
            fetch('/api/projects/' + encodeURIComponent(currentProject.slug) + '/sessions')
              .then(function(r) { return r.json(); })
          );
        }
        var results = await Promise.all(fetches);
        sessionsCache = results[0];
        projectsCache = results[1];
        if (currentProject && results[2]) {
          projectSessionsCache[currentProject.slug] = results[2];
        }

        // Hash-based skip: if data hasn't changed, skip re-render entirely
        var newSessionsJSON = JSON.stringify(sessionsCache);
        var newProjectsJSON = JSON.stringify(projectsCache);
        if (newSessionsJSON === prevSessionsJSON && newProjectsJSON === prevProjectsJSON) {
          return; // No changes, skip re-render
        }
        prevSessionsJSON = newSessionsJSON;
        prevProjectsJSON = newProjectsJSON;

        // Re-render based on current view state
        // morphdomUpdate preserves expanded states via onBeforeElUpdated callback
        if (globalUnit === 'time') {
          if (currentProject) {
            await zoomIntoProject(currentProject.slug);
          } else {
            renderProjectTimeView();
          }
        } else {
          // Decomp view
          if (currentProject) {
            renderDecompSessionLevel();
          } else if (decompStack.length === 0 || (decompStack[0] && decompStack[0].level === 'projects')) {
            renderDecompProjectLevel();
          }
          // else: user drilled deeper — don't disturb the current drill view
        }
      } catch(e) {
        document.getElementById('session-list').innerHTML =
          '<div class="empty-state">Failed to load sessions</div>';
      }
    }

    function renderSessions(sessions) {
      var el = document.getElementById('session-list');
      if (!sessions.length) {
        el.innerHTML = '<div class="empty-state">No sessions recorded yet</div>';
        return;
      }

      // Preserve expanded sessions: only do a full re-render on first load
      // or when session count changes. Otherwise, update headers in-place.
      var existingCards = el.querySelectorAll('.session-card');
      var expandedSids = {};
      existingCards.forEach(function(c) {
        if (c.classList.contains('expanded')) {
          expandedSids[c.dataset.sid] = true;
        }
      });

      // If we have existing cards and count matches, do incremental update
      if (existingCards.length > 0 && existingCards.length === sessions.length) {
        sessions.forEach(function(s) {
          var card = el.querySelector('.session-card[data-sid="' + s.session_id + '"]');
          if (!card) return;
          // Update stats in header without destroying the body
          var statsEl = card.querySelector('.session-stats');
          if (statsEl) {
            statsEl.innerHTML =
              '<span class="stat">agents <b>' + s.agent_count + '</b></span>' +
              '<span class="stat">workers <b>' + s.worker_count + '</b></span>' +
              '<span class="stat">events <b>' + s.event_count + '</b></span>' +
              '<span class="stat">tools <b>' + s.tool_call_count + '</b></span>';
          }
        });
        return;
      }

      var newHtml = sessions.map(function(s) {
        var flowPills = (s.agent_types || []).map(function(t) {
          return '<span class="flow-pill" style="background:' + agentHex(t) + '">' + esc(t) + '</span>';
        }).join('<span class="flow-arrow">&rsaquo;</span>');

        var displayName = s.name || truncId(s.session_id, 50);

        // Token badges
        var tokenHtml = '';
        if (s.input_tokens || s.output_tokens || s.cache_creation_tokens || s.cache_read_tokens) {
          tokenHtml = '<div class="token-badges">';
          if (s.input_tokens) tokenHtml += '<span class="token-badge">In: <b>' + fmtTokens(s.input_tokens) + '</b></span>';
          if (s.output_tokens) tokenHtml += '<span class="token-badge">Out: <b>' + fmtTokens(s.output_tokens) + '</b></span>';
          var cacheTotal = (s.cache_creation_tokens || 0) + (s.cache_read_tokens || 0);
          if (cacheTotal) tokenHtml += '<span class="token-badge">Cache: <b>' + fmtTokens(cacheTotal) + '</b></span>';
          if (s.message_count) tokenHtml += '<span class="token-badge">Msgs: <b>' + s.message_count + '</b></span>';
          tokenHtml += '</div>';
        }

        return '<div class="session-card" data-sid="' + esc(s.session_id) + '">' +
          '<div class="session-head" onclick="toggleSession(this)">' +
            '<div>' +
              '<span class="session-name" onclick="startRenameSession(event, \'' + esc(s.session_id) + '\')" title="Click to rename">' + esc(displayName) + '</span>' +
              '<div class="session-time">' + esc(fmtTime(s.first_timestamp)) +
                ' &mdash; ' + esc(fmtDuration(s.duration_seconds)) + '</div>' +
              '<div class="session-flow">' + flowPills + '</div>' +
              tokenHtml +
            '</div>' +
            '<div class="session-stats">' +
              '<span class="stat">agents <b>' + s.agent_count + '</b></span>' +
              '<span class="stat">workers <b>' + s.worker_count + '</b></span>' +
              '<span class="stat">events <b>' + s.event_count + '</b></span>' +
              '<span class="stat">tools <b>' + s.tool_call_count + '</b></span>' +
            '</div>' +
          '</div>' +
          '<div class="session-body">' +
            '<div class="tree-loading">Loading tree...</div>' +
          '</div>' +
        '</div>';
      }).join('');

      morphdomUpdate(el, newHtml);
    }

    function startRenameSession(event, sid) {
      event.stopPropagation();
      var nameEl = event.target;
      if (nameEl.tagName === 'INPUT') return;
      var currentName = nameEl.textContent;
      var input = document.createElement('input');
      input.className = 'session-name-input';
      input.type = 'text';
      input.value = currentName;
      nameEl.replaceWith(input);
      input.focus();
      input.select();

      function finishRename() {
        var newName = input.value.trim();
        if (newName && newName !== currentName) {
          fetch('/api/sessions/' + encodeURIComponent(sid) + '/name', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: newName })
          }).then(function() {
            // Update cache
            sessionsCache.forEach(function(s) {
              if (s.session_id === sid) s.name = newName;
            });
          }).catch(function() {});
        }
        var span = document.createElement('span');
        span.className = 'session-name';
        span.textContent = newName || currentName;
        span.title = 'Click to rename';
        span.onclick = function(e) { startRenameSession(e, sid); };
        input.replaceWith(span);
      }

      input.addEventListener('blur', finishRename);
      input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') { input.blur(); }
        if (e.key === 'Escape') { input.value = currentName; input.blur(); }
      });
    }

    async function toggleSession(headEl) {
      var card = headEl.closest('.session-card');
      var wasExpanded = card.classList.contains('expanded');
      card.classList.toggle('expanded');
      var sid = card.dataset.sid;
      if (wasExpanded) {
        expandedSessionIds.delete(sid);
        if (cytoscapeInstances[sid]) {
          cytoscapeInstances[sid].destroy();
          delete cytoscapeInstances[sid];
        }
        return;
      }
      expandedSessionIds.add(sid);

      var sid = card.dataset.sid;
      var body = card.querySelector('.session-body');

      if (treeCacheMap[sid]) {
        renderSessionBody(body, sid, treeCacheMap[sid]);
        return;
      }

      body.innerHTML = '<div class="tree-loading">Loading tree...</div>';

      try {
        var resp = await fetch('/api/sessions/' + encodeURIComponent(sid) + '/tree');
        var data = await resp.json();
        treeCacheMap[sid] = data;
        renderSessionBody(body, sid, data);
      } catch(e) {
        body.innerHTML = '<div class="tree-loading">Failed to load tree</div>';
      }
    }

    function renderSessionBody(body, sid, treeData) {
      var html = '<div class="session-body-inner">';
      html += '<div class="trace-container" id="trace-' + esc(sid) + '"></div>';
      html += '</div>';

      body.innerHTML = html;

      requestAnimationFrame(function() {
        initTrace(sid);
      });
    }

    function switchView(sid, view) {
      // Only trace view remains; kept for compatibility
      var card = document.querySelector('.session-card[data-sid="' + sid + '"]');
      if (card && treeCacheMap[sid]) {
        var body = card.querySelector('.session-body');
        renderSessionBody(body, sid, treeCacheMap[sid]);
      }
    }

    // ===== Cytoscape Graph =====
    function treeToElements(node, parentId, isRoot) {
      var elements = [];

      // Skip event nodes
      if (node.type === 'event') return elements;

      // Root session node: render as small hub connecting all agents
      if (isRoot && node.type === 'session') {
        var rootId = 'session-root';
        elements.push({
          data: {
            id: rootId,
            label: 'Session',
            nodeType: 'session',
            agentType: null,
            duration: node.duration_seconds,
            toolCalls: node.tool_calls || 0,
            tools: node.tools || {},
            startedAt: node.started_at,
            rawId: node.id,
            color: '#7950f2',
            shape: 'diamond'
          }
        });
        if (node.children) {
          node.children.forEach(function(child) {
            if (child.type === 'event') return;
            var childEls = treeToElements(child, rootId, false);
            elements = elements.concat(childEls);
          });
        }
        return elements;
      }

      var nodeId = node.type + '-' + (node.id || Math.random().toString(36).slice(2));

      var label = node.agent_type || node.type;
      if (node.invocations && node.invocations > 1) {
        label += ' (' + node.invocations + 'x)';
      }
      if (node.duration_seconds != null) {
        var dur = node.duration_seconds;
        if (dur >= 60) label += '\n' + (dur / 60).toFixed(1) + 'm';
        else label += '\n' + dur.toFixed(0) + 's';
      }
      if (node.tool_calls) {
        label += '\n' + node.tool_calls + ' tools';
      }

      var shape = 'round-rectangle';
      if (node.type === 'worker') shape = 'ellipse';

      var color = agentHex(node.agent_type);

      elements.push({
        data: {
          id: nodeId,
          label: label,
          nodeType: node.type,
          agentType: node.agent_type,
          duration: node.duration_seconds,
          toolCalls: node.tool_calls || 0,
          tools: node.tools || {},
          startedAt: node.started_at,
          rawId: node.id,
          invocations: node.invocations || 1,
          color: color,
          shape: shape
        }
      });

      if (parentId) {
        elements.push({
          data: {
            source: parentId,
            target: nodeId
          }
        });
      }

      if (node.children) {
        node.children.forEach(function(child) {
          var childEls = treeToElements(child, nodeId, false);
          elements = elements.concat(childEls);
        });
      }

      return elements;
    }

    function initGraph(sid, treeData) {
      var container = document.getElementById('graph-' + sid);
      if (!container) return;
      if (typeof cytoscape === 'undefined') {
        container.innerHTML = '<div class="empty-state">Cytoscape.js not loaded (CDN unavailable)</div>';
        return;
      }

      var elements = treeToElements(treeData, null, true);

      // Track collapsed (hidden) nodes
      var hiddenChildren = {};

      var cy = cytoscape({
        container: container,
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'label': 'data(label)',
              'text-valign': 'center',
              'text-halign': 'center',
              'font-size': '10px',
              'font-family': "'SF Mono', 'Cascadia Code', 'Fira Code', Consolas, monospace",
              'color': '#fff',
              'text-wrap': 'wrap',
              'text-max-width': '80px',
              'background-color': 'data(color)',
              'shape': 'data(shape)',
              'width': 'label',
              'height': 'label',
              'padding': '12px',
              'border-width': 2,
              'border-color': '#373a40',
              'text-outline-width': 0
            }
          },
          {
            selector: 'node[nodeType="session"]',
            style: {
              'width': 60,
              'height': 60,
              'font-size': '11px',
              'font-weight': 'bold'
            }
          },
          {
            selector: 'edge',
            style: {
              'width': 2,
              'line-color': '#495057',
              'target-arrow-color': '#495057',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'arrow-scale': 0.8
            }
          }
        ],
        layout: {
          name: 'dagre',
          rankDir: 'LR',
          nodeSep: 50,
          rankSep: 80,
          animate: false,
          fit: true,
          padding: 30
        },
        minZoom: 0.3,
        maxZoom: 3,
        wheelSensitivity: 0.3
      });

      cytoscapeInstances[sid] = cy;

      // Click node -> show detail panel
      cy.on('tap', 'node', function(evt) {
        var nodeData = evt.target.data();
        showDetailPanel(sid, nodeData);
      });

      // Double-click node -> toggle children visibility
      cy.on('dbltap', 'node', function(evt) {
        var nodeId = evt.target.id();
        toggleNodeChildren(cy, nodeId, hiddenChildren);
      });

      // Click background -> hide detail panel
      cy.on('tap', function(evt) {
        if (evt.target === cy) {
          hideDetailPanel(sid);
        }
      });
    }

    function toggleNodeChildren(cy, nodeId, hiddenChildren) {
      var node = cy.getElementById(nodeId);
      if (!node || node.length === 0) return;

      if (hiddenChildren[nodeId]) {
        // Restore hidden children
        var toRestore = hiddenChildren[nodeId];
        toRestore.restore();
        delete hiddenChildren[nodeId];
        cy.layout({
          name: 'dagre', rankDir: 'LR', nodeSep: 50, rankSep: 80,
          animate: true, animationDuration: 300, fit: true, padding: 30
        }).run();
      } else {
        // Find all descendants and hide them
        var descendants = getDescendants(cy, nodeId);
        if (descendants.length === 0) return;
        hiddenChildren[nodeId] = descendants;
        descendants.remove();
        cy.layout({
          name: 'dagre', rankDir: 'LR', nodeSep: 50, rankSep: 80,
          animate: true, animationDuration: 300, fit: true, padding: 30
        }).run();
      }
    }

    function getDescendants(cy, nodeId) {
      var result = cy.collection();
      var directEdges = cy.edges('[source="' + nodeId + '"]');
      directEdges.forEach(function(edge) {
        var target = edge.target();
        result = result.union(edge);
        result = result.union(target);
        result = result.union(getDescendants(cy, target.id()));
      });
      return result;
    }

    // ===== Detail Panel =====
    function showDetailPanel(sid, nodeData) {
      var panel = document.getElementById('detail-' + sid);
      var content = document.getElementById('detail-content-' + sid);
      if (!panel || !content) return;

      var html = '<h4>' + esc(nodeData.agentType || nodeData.nodeType || 'Node') + '</h4>';
      html += '<div class="detail-row"><span class="dl">Type</span><span class="dv">' + esc(nodeData.nodeType) + '</span></div>';
      if (nodeData.agentType) {
        html += '<div class="detail-row"><span class="dl">Agent Type</span><span class="dv">' + esc(nodeData.agentType) + '</span></div>';
      }
      html += '<div class="detail-row"><span class="dl">ID</span><span class="dv">' + esc(truncId(nodeData.rawId, 16)) + '</span></div>';
      html += '<div class="detail-row"><span class="dl">Duration</span><span class="dv">' + esc(fmtDuration(nodeData.duration)) + '</span></div>';
      html += '<div class="detail-row"><span class="dl">Tool Calls</span><span class="dv">' + (nodeData.toolCalls || 0) + '</span></div>';

      // Tool breakdown
      var tools = nodeData.tools;
      if (tools && Object.keys(tools).length > 0) {
        var sorted = Object.entries(tools).sort(function(a, b) { return b[1] - a[1]; });
        var total = sorted.reduce(function(s, e) { return s + e[1]; }, 0);

        html += '<div class="tool-bar-container">';
        html += '<div class="tool-stacked-bar">';
        sorted.forEach(function(entry) {
          var pct = total > 0 ? (entry[1] / total * 100) : 0;
          html += '<div class="tool-stacked-segment" style="width:' + pct + '%;background:' + getToolColor(entry[0]) + '" title="' + esc(entry[0]) + ': ' + entry[1] + '"></div>';
        });
        html += '</div>';
        html += '</div>';

        html += '<table class="tool-table">';
        html += '<thead><tr><th>Tool</th><th>Count</th></tr></thead><tbody>';
        sorted.forEach(function(entry) {
          html += '<tr>';
          html += '<td><span class="tool-color-dot" style="background:' + getToolColor(entry[0]) + '"></span>' + esc(entry[0]) + '</td>';
          html += '<td>' + entry[1] + '</td>';
          html += '</tr>';
        });
        html += '</tbody></table>';
      }

      // "View Task" button if this node has an ID (task_uuid)
      if (nodeData.rawId && nodeData.nodeType !== 'session') {
        html += '<button class="view-task-btn" onclick="showTaskOverlay(\'' + esc(nodeData.rawId) + '\')">View Task</button>';
      }

      content.innerHTML = html;
      panel.classList.add('open');
    }

    function hideDetailPanel(sid) {
      var panel = document.getElementById('detail-' + sid);
      if (panel) panel.classList.remove('open');
    }

    // ===== Task Content Overlay =====
    async function showTaskOverlay(taskUuid) {
      try {
        var resp = await fetch('/api/tasks/' + encodeURIComponent(taskUuid) + '/content');
        if (!resp.ok) {
          alert('Task not found');
          return;
        }
        var data = await resp.json();
        renderTaskOverlay(data);
      } catch(e) {
        alert('Failed to fetch task content');
      }
    }

    function renderTaskOverlay(data) {
      // Remove existing overlay if any
      var existing = document.getElementById('task-overlay');
      if (existing) existing.remove();

      var overlay = document.createElement('div');
      overlay.id = 'task-overlay';
      overlay.className = 'task-overlay';

      var allTabs = [
        { key: 'task_md', label: 'task.md' },
        { key: 'result_md', label: 'result.md' },
        { key: 'notes_md', label: 'notes.md' }
      ];

      // Template patterns to treat as empty
      var emptyPatterns = [
        '(empty)', '',
        '# Open tasks\n\n# Notes',
        '# Open tasks\n# Notes',
        '# Open tasks\r\n\r\n# Notes',
        '# Open tasks\r\n# Notes'
      ];

      function isEmptyContent(content) {
        if (!content) return true;
        var trimmed = content.trim();
        return emptyPatterns.some(function(p) { return trimmed === p; });
      }

      // Filter out empty/template tabs
      var tabs = allTabs.filter(function(tab) {
        return !isEmptyContent(data[tab.key]);
      });

      if (tabs.length === 0) {
        // Nothing to show
        return;
      }

      var html = '<div class="task-overlay-inner">';
      html += '<button class="task-overlay-close" onclick="closeTaskOverlay()">&times;</button>';
      html += '<h4 style="font-size:13px;color:var(--text-bright);margin-bottom:12px;">Task: ' + esc(truncId(data.task_uuid, 16)) + '</h4>';
      html += '<div class="task-overlay-tabs">';
      tabs.forEach(function(tab, i) {
        html += '<button class="task-overlay-tab' + (i === 0 ? ' active' : '') + '" onclick="switchTaskTab(\'' + tab.key + '\', this)">' + tab.label + '</button>';
      });
      html += '</div>';
      tabs.forEach(function(tab, i) {
        var display = i === 0 ? 'block' : 'none';
        var content = data[tab.key];
        var rendered;
        if (typeof marked !== 'undefined') {
          try { rendered = marked.parse(content); } catch(e) { rendered = esc(content); }
        } else {
          rendered = '<pre style="white-space:pre-wrap">' + esc(content) + '</pre>';
        }
        html += '<div class="task-overlay-content" id="task-tab-' + tab.key + '" style="display:' + display + '">' + rendered + '</div>';
      });
      html += '</div>';

      overlay.innerHTML = html;
      overlay.addEventListener('click', function(e) {
        if (e.target === overlay) closeTaskOverlay();
      });
      document.body.appendChild(overlay);
    }

    function switchTaskTab(key, btn) {
      document.querySelectorAll('.task-overlay-tab').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      document.querySelectorAll('.task-overlay-content').forEach(function(c) { c.style.display = 'none'; });
      var el = document.getElementById('task-tab-' + key);
      if (el) el.style.display = 'block';
    }

    function closeTaskOverlay() {
      var overlay = document.getElementById('task-overlay');
      if (overlay) overlay.remove();
    }

    async function searchAndShowTask(sessionId, agentType, startTime) {
      try {
        var resp = await fetch('/api/tasks/find?agent_type=' + encodeURIComponent(agentType));
        if (!resp.ok) {
          // No tasks found for this agent type
          return;
        }
        var data = await resp.json();
        renderTaskOverlay(data);
      } catch(e) {
        // silently fail
      }
    }

    // ===== Waterfall/Gantt View =====
    function renderWaterfall(treeData) {
      var sessionStart = treeData.started_at ? new Date(treeData.started_at).getTime() : 0;
      var sessionDuration = treeData.duration_seconds || 1;
      var nodes = flattenTree(treeData);

      if (nodes.length <= 1) {
        return '<div class="empty-state">No timing data available</div>';
      }

      var html = '<div class="waterfall-container">';
      nodes.forEach(function(n) {
        if (!n.started_at) return;

        var nodeStart = new Date(n.started_at).getTime();
        var leftPct = sessionDuration > 0 ? ((nodeStart - sessionStart) / 1000 / sessionDuration * 100) : 0;
        var widthPct = sessionDuration > 0 && n.duration_seconds ? (n.duration_seconds / sessionDuration * 100) : 1;

        leftPct = Math.max(0, Math.min(leftPct, 100));
        widthPct = Math.max(0.5, Math.min(widthPct, 100 - leftPct));

        var indentClass = '';
        if (n.depth === 1) indentClass = ' indent-1';
        else if (n.depth === 2) indentClass = ' indent-2';
        else if (n.depth >= 3) indentClass = ' indent-3';

        var label = n.type === 'session' ? 'Session' : (n.agent_type || n.type);
        var color = n.type === 'session' ? '#7950f2' : agentHex(n.agent_type);

        html += '<div class="waterfall-row">';
        html += '<div class="waterfall-label' + indentClass + '" title="' + esc(n.id || '') + '">' + esc(label) + '</div>';
        html += '<div class="waterfall-track">';
        html += '<div class="waterfall-bar" style="left:' + leftPct + '%;width:' + widthPct + '%;background:' + color + '">';
        html += esc(fmtDuration(n.duration_seconds));
        html += '</div>';
        html += '</div>';
        html += '</div>';
      });
      html += '</div>';
      return html;
    }

    // ===== D3 Trace Timeline =====
    function initTrace(sid) {
      var container = document.getElementById('trace-' + sid);
      if (!container || typeof d3 === 'undefined') {
        if (container) container.innerHTML = '<div class="empty-state">D3.js not loaded (CDN unavailable)</div>';
        return;
      }

      // Find session data from cache for token info
      var sessionData = null;
      if (sessionsCache) {
        sessionData = sessionsCache.find(function(s) { return s.session_id === sid; });
      }

      fetch('/api/sessions/' + encodeURIComponent(sid) + '/spans')
        .then(function(r) { return r.json(); })
        .then(function(spans) { renderTrace(container, spans, sid, sessionData); })
        .catch(function() {
          container.innerHTML = '<div class="empty-state">Failed to load trace data</div>';
        });
    }

    function renderSessionOnlyTrace(container, sid, sessionData) {
      // Compact inline for orchestrator-only sessions
      container.classList.add('compact');
      var inner = container.closest('.session-body-inner');
      if (inner) inner.style.padding = '0';
      var parts = [];
      if (sessionData.input_tokens) parts.push('In: ' + fmtTokens(sessionData.input_tokens));
      if (sessionData.output_tokens) parts.push('Out: ' + fmtTokens(sessionData.output_tokens));
      var cacheTotal = (sessionData.cache_creation_tokens || 0) + (sessionData.cache_read_tokens || 0);
      if (cacheTotal) parts.push('Cache: ' + fmtTokens(cacheTotal));
      if (sessionData.tool_call_count) parts.push(sessionData.tool_call_count + ' tools');
      if (sessionData.duration_seconds) parts.push(fmtDuration(sessionData.duration_seconds));
      container.innerHTML = '<div style="padding:4px 10px;font-size:10px;color:var(--text-secondary);opacity:0.5">'
        + (parts.length > 0 ? 'No subagents · ' + esc(parts.join(' · ')) : 'No subagents')
        + '</div>';
    }

    function renderTrace(container, spans, sid, sessionData) {
      if ((!spans || spans.length === 0) && !sessionData) {
        container.classList.add('compact');
        var inner = container.closest('.session-body-inner');
        if (inner) inner.style.padding = '0';
        container.innerHTML = '<div style="padding:4px 10px;font-size:10px;color:var(--text-secondary);opacity:0.5">No trace data</div>';
        return;
      }

      // No agent/worker spans but we have session data — render session bar only
      if (!spans || spans.length === 0) {
        renderSessionOnlyTrace(container, sid, sessionData);
        return;
      }

      // Parse timestamps
      var parsed = spans.map(function(s) {
        return {
          type: s.type,
          id: s.id,
          taskUuid: s.task_uuid || '',
          agentType: s.agent_type || s.type,
          parentId: s.parent_id || '',
          start: s.start ? new Date(s.start).getTime() : 0,
          end: s.end ? new Date(s.end).getTime() : null,
          isResume: s.is_resume,
          toolCalls: s.tool_calls || 0
        };
      }).filter(function(s) { return s.start > 0; });

      if (parsed.length === 0) {
        container.innerHTML = '<div class="empty-state">No timing data in spans</div>';
        return;
      }

      // Time range
      var tMin = d3.min(parsed, function(d) { return d.start; });
      var tMax = d3.max(parsed, function(d) { return d.end || d.start; });
      var tRange = tMax - tMin || 1000;
      tMax = tMax + tRange * 0.05;
      tMin = tMin - tRange * 0.02;

      parsed.sort(function(a, b) { return a.start - b.start; });

      // Separate agents and workers
      var agents = parsed.filter(function(s) { return s.type === 'agent'; });
      var workers = parsed.filter(function(s) { return s.type === 'worker'; });

      // --- Group agents by type, ordered by first appearance ---
      var typeOrder = [];
      var typeMap = {}; // agentType -> [spans]
      agents.forEach(function(s) {
        if (!typeMap[s.agentType]) {
          typeMap[s.agentType] = [];
          typeOrder.push(s.agentType);
        }
        typeMap[s.agentType].push(s);
      });

      // Within each type group, assign rows. Resumes share row with their original (same agent_id).
      // Color variants: track unique agent_ids per type
      var nextRow = 1; // row 0 = session
      var rowByAgentId = {};
      var typeFirstRow = {}; // agentType -> first row index
      var typeIdCounters = {}; // agentType -> count of unique agent_ids (for color shift)
      var agentIdTypeIndex = {}; // agent_id -> typeIndex for color

      typeOrder.forEach(function(aType) {
        var group = typeMap[aType];
        typeFirstRow[aType] = nextRow;
        typeIdCounters[aType] = 0;

        // Sort group by start time
        group.sort(function(a, b) { return a.start - b.start; });

        group.forEach(function(s) {
          if (s.isResume && rowByAgentId[s.id] != null) {
            // Resume shares row with original
            s.row = rowByAgentId[s.id];
            s.typeIndex = agentIdTypeIndex[s.id] || 0;
          } else if (!s.isResume && rowByAgentId[s.id] != null) {
            // Same agent_id seen again (non-resume) — share row
            s.row = rowByAgentId[s.id];
            s.typeIndex = agentIdTypeIndex[s.id] || 0;
          } else {
            s.row = nextRow++;
            rowByAgentId[s.id] = s.row;
            s.typeIndex = typeIdCounters[aType];
            agentIdTypeIndex[s.id] = s.typeIndex;
            typeIdCounters[aType]++;
          }
        });
      });
      var agentRowCount = nextRow;

      // Workers get typeIndex 0
      workers.forEach(function(s) { s.typeIndex = 0; });

      // Map workers to parent agents
      var spanByTaskUuid = {};
      var spanByWorkerId = {};
      agents.forEach(function(s) {
        if (s.taskUuid) spanByTaskUuid[s.taskUuid] = s;
      });
      workers.forEach(function(s) { spanByWorkerId[s.id] = s; });

      // Group workers by parent agent id
      var workersByAgentId = {};
      workers.forEach(function(w) {
        if (!w.parentId) return;
        var parts = w.parentId.split(':');
        var parentType = parts[0];
        var parentIdVal = parts.slice(1).join(':');
        var parentSpan = null;
        if (parentType === 'task') parentSpan = spanByTaskUuid[parentIdVal];
        else if (parentType === 'worker') parentSpan = spanByWorkerId[parentIdVal];
        if (!parentSpan) return;
        var agentId = parentSpan.type === 'agent' ? parentSpan.id : parentSpan._parentAgentId;
        if (!agentId) return;
        w._parentAgentId = agentId;
        if (!workersByAgentId[agentId]) workersByAgentId[agentId] = [];
        workersByAgentId[agentId].push(w);
      });

      // Compute stats per type group
      var typeStats = {};
      typeOrder.forEach(function(aType) {
        var group = typeMap[aType];
        var totalTools = 0;
        var totalWorkers = 0;
        var seenAgentIds = {};
        group.forEach(function(s) {
          totalTools += s.toolCalls || 0;
          if (!seenAgentIds[s.id]) {
            seenAgentIds[s.id] = true;
            totalWorkers += (workersByAgentId[s.id] || []).length;
          }
        });
        typeStats[aType] = { tools: totalTools, workers: totalWorkers };
      });

      // Layout constants
      var labelWidth = 120;
      var rowHeight = 36;
      var topMargin = 30;
      var bottomMargin = 20;
      var rightMargin = 40;
      var svgWidth = Math.max(container.clientWidth - 28, 600);
      var chartWidth = svgWidth - labelWidth - rightMargin;

      var svgHeight = topMargin + agentRowCount * rowHeight + bottomMargin;

      // Time scale
      var xScale = d3.scaleLinear()
        .domain([tMin, tMax])
        .range([0, chartWidth]);

      // Resolve color for a span
      function spanColor(s) {
        var base = agentHex(s.agentType);
        if (s.typeIndex > 0) return shiftColor(base, s.typeIndex);
        return base;
      }

      container.innerHTML = '';
      var svg = d3.select(container).append('svg')
        .attr('width', svgWidth)
        .attr('height', svgHeight);

      // Defs: arrow markers
      var defs = svg.append('defs');
      defs.append('marker')
        .attr('id', 'trace-arrow-' + sid)
        .attr('viewBox', '0 0 10 10')
        .attr('refX', 8).attr('refY', 5)
        .attr('markerWidth', 6).attr('markerHeight', 6)
        .attr('orient', 'auto')
        .append('path')
        .attr('d', 'M 0 0 L 10 5 L 0 10 z')
        .attr('fill', 'rgba(255,255,255,0.3)');

      defs.append('marker')
        .attr('id', 'trace-return-' + sid)
        .attr('viewBox', '0 0 10 10')
        .attr('refX', 5).attr('refY', 2)
        .attr('markerWidth', 6).attr('markerHeight', 6)
        .attr('orient', 'auto')
        .append('path')
        .attr('d', 'M 0 10 L 5 0 L 10 10 z')
        .attr('fill', 'rgba(168,130,255,0.35)');

      // Tooltip
      var tooltip = d3.select(container).append('div')
        .attr('class', 'trace-tooltip')
        .style('display', 'none');

      // Time axis
      var axisG = svg.append('g')
        .attr('transform', 'translate(' + labelWidth + ',' + topMargin + ')');

      var tickCount = Math.min(8, Math.floor(chartWidth / 80));
      var ticks = xScale.ticks(tickCount);

      function drawAxisTicks(totalRows) {
        ticks.forEach(function(t) {
          var x = xScale(t);
          axisG.append('line')
            .attr('class', 'axis-line')
            .attr('x1', x).attr('y1', -10)
            .attr('x2', x).attr('y2', totalRows * rowHeight);
          axisG.append('text')
            .attr('class', 'axis-text')
            .attr('x', x).attr('y', -14)
            .attr('text-anchor', 'middle')
            .text(formatTraceTime(t, tMin));
        });
      }
      drawAxisTicks(agentRowCount);

      // Arrows layer
      var arrowG = svg.append('g')
        .attr('transform', 'translate(' + labelWidth + ',' + topMargin + ')');

      // Rows layer
      var rowsG = svg.append('g')
        .attr('transform', 'translate(0,' + topMargin + ')');

      // Session bar precomputed values
      var sessionBarStart = xScale(tMin + tRange * 0.02);
      var sessionBarEnd = xScale(tMax - tRange * 0.05);
      var sessionBarW = Math.max(4, sessionBarEnd - sessionBarStart);

      // Expanded workers state: agentId -> { workerRows: [], g: <g element> }
      var expandedState = {};

      // --- Drawing functions ---

      function drawSessionBar() {
        rowsG.append('text')
          .attr('class', 'row-label')
          .attr('x', 8)
          .attr('y', rowHeight / 2)
          .style('fill', '#7950f2')
          .text('session');
        rowsG.append('rect')
          .attr('class', 'span-bar')
          .attr('x', labelWidth + sessionBarStart)
          .attr('y', 4)
          .attr('width', sessionBarW)
          .attr('height', rowHeight - 8)
          .attr('fill', '#7950f2')
          .attr('opacity', 0.4)
          .attr('rx', 3).attr('ry', 3);

        // Token stats on session bar (if available)
        if (sessionData) {
          var parts = [];
          if (sessionData.input_tokens) parts.push('In:' + fmtTokens(sessionData.input_tokens));
          if (sessionData.output_tokens) parts.push('Out:' + fmtTokens(sessionData.output_tokens));
          var cacheTotal = (sessionData.cache_creation_tokens || 0) + (sessionData.cache_read_tokens || 0);
          if (cacheTotal) parts.push('Cache:' + fmtTokens(cacheTotal));
          if (sessionData.tool_call_count) parts.push(sessionData.tool_call_count + ' tools');
          if (parts.length > 0) {
            rowsG.append('text')
              .attr('x', labelWidth + sessionBarStart + 6)
              .attr('y', rowHeight / 2)
              .attr('class', 'span-label')
              .style('fill', 'rgba(255,255,255,0.6)')
              .style('font-size', '10px')
              .text(parts.join('  '));
          }
        }
      }

      function drawArrows() {
        // Down arrows from session to each non-resume agent
        agents.forEach(function(s) {
          if (s.isResume) return;
          var startX = xScale(s.start);
          var fromY = rowHeight - 4;
          var toY = s.row * rowHeight + rowHeight / 2;
          arrowG.append('path')
            .attr('class', 'arrow-line')
            .attr('d', 'M' + startX + ',' + fromY + ' L' + startX + ',' + toY)
            .attr('marker-end', 'url(#trace-arrow-' + sid + ')');
        });

        // Return arrows (dashed, up from agent end to session)
        agents.forEach(function(s) {
          if (!s.end || s.isResume) return;
          var endX = xScale(s.end);
          var fromY = s.row * rowHeight + 4;
          var toY = rowHeight - 4;
          arrowG.append('path')
            .attr('d', 'M' + endX + ',' + fromY + ' L' + endX + ',' + toY)
            .attr('fill', 'none')
            .attr('stroke', 'rgba(168,130,255,0.2)')
            .attr('stroke-width', 1)
            .attr('stroke-dasharray', '3,3')
            .attr('marker-end', 'url(#trace-return-' + sid + ')');
        });
      }

      function drawAgentBars() {
        var labeledTypes = {};

        typeOrder.forEach(function(aType) {
          var group = typeMap[aType];
          var firstRow = typeFirstRow[aType];
          var stats = typeStats[aType];

          group.forEach(function(s) {
            var y = s.row * rowHeight;
            var color = spanColor(s);

            // Type label: only on the first row of each type group
            if (s.row === firstRow && !labeledTypes[aType]) {
              rowsG.append('text')
                .attr('class', 'row-label')
                .attr('x', 8)
                .attr('y', y + rowHeight / 2)
                .text(aType);
              labeledTypes[aType] = true;
            }

            // Bar
            var barX = xScale(s.start);
            var barEnd = s.end ? xScale(s.end) : xScale(s.start) + 8;
            var barW = Math.max(4, barEnd - barX);

            var bar = rowsG.append('rect')
              .attr('class', 'span-bar' + (s.isResume ? ' resume' : ''))
              .attr('x', labelWidth + barX)
              .attr('y', y + 4)
              .attr('width', barW)
              .attr('height', rowHeight - 8)
              .attr('fill', color)
              .attr('opacity', s.isResume ? 0.7 : 0.9)
              .style('cursor', s.taskUuid ? 'pointer' : 'default');

            if (s.isResume) {
              bar.attr('stroke', 'rgba(255,255,255,0.4)')
                .attr('stroke-width', 1.5)
                .attr('stroke-dasharray', '4,2');
            }

            // Click to view task — works with taskUuid or searches by agent_type
            (function(span) {
              bar.on('click', function() {
                if (span.taskUuid) {
                  showTaskOverlay(span.taskUuid);
                } else {
                  // Search task dirs by agent type for this session
                  searchAndShowTask(sid, span.agentType, span.start);
                }
              });
            })(s);
            bar.style('cursor', 'pointer');

            // Duration + tool count text
            // For completed spans, show duration. For running spans, show agent type + short ID.
            var durText = s.end ? fmtDuration((s.end - s.start) / 1000) : (s.agentType + ' ' + (s.id || '').slice(0, 6));
            var toolText = s.toolCalls > 0 ? ' \u00b7 ' + s.toolCalls + ' tools' : '';

            // Check if there's a next bar on the same row (resume) — limit outside text
            var nextBarOnRow = agents.find(function(a) {
              return a.row === s.row && a.start > s.start;
            });
            var gapToNext = nextBarOnRow ? xScale(nextBarOnRow.start) - (barX + barW) : Infinity;

            // Clip path to prevent text overflow beyond bar
            var clipId = 'clip-' + sid.replace(/[^a-z0-9]/gi,'').slice(0,6) + '-' + (s.id || '').replace(/[^a-z0-9]/gi,'').slice(0,6) + '-' + s.row;
            defs.append('clipPath').attr('id', clipId)
              .append('rect')
              .attr('x', labelWidth + barX)
              .attr('y', y)
              .attr('width', barW)
              .attr('height', rowHeight);

            if (s.end && barW > 40) {
              var fullText = durText + toolText;
              var estWidth = fullText.length * 7;

              if (estWidth <= barW - 12) {
                rowsG.append('text')
                  .attr('class', 'span-label')
                  .attr('x', labelWidth + barX + 6)
                  .attr('y', y + rowHeight / 2)
                  .attr('clip-path', 'url(#' + clipId + ')')
                  .text(fullText);
              } else if (durText.length * 7 <= barW - 12) {
                rowsG.append('text')
                  .attr('class', 'span-label')
                  .attr('x', labelWidth + barX + 6)
                  .attr('y', y + rowHeight / 2 - 5)
                  .attr('clip-path', 'url(#' + clipId + ')')
                  .text(durText);
                if (s.toolCalls > 0) {
                  rowsG.append('text')
                    .attr('class', 'span-label')
                    .attr('x', labelWidth + barX + 6)
                    .attr('y', y + rowHeight / 2 + 7)
                    .style('font-size', '9px')
                    .style('fill', 'rgba(255,255,255,0.6)')
                    .attr('clip-path', 'url(#' + clipId + ')')
                    .text(s.toolCalls + ' tools');
                }
              } else {
                rowsG.append('text')
                  .attr('class', 'span-label')
                  .attr('x', labelWidth + barX + 4)
                  .attr('y', y + rowHeight / 2 - 5)
                  .style('font-size', '9px')
                  .attr('clip-path', 'url(#' + clipId + ')')
                  .text(durText);
                if (s.toolCalls > 0) {
                  rowsG.append('text')
                    .attr('class', 'span-label')
                    .attr('x', labelWidth + barX + 4)
                    .attr('y', y + rowHeight / 2 + 7)
                    .style('font-size', '8px')
                    .style('fill', 'rgba(255,255,255,0.5)')
                    .attr('clip-path', 'url(#' + clipId + ')')
                    .text(s.toolCalls + ' tools');
                }
              }
            } else {
              // Bar too narrow for in-bar text — show outside (after bar end)
              var outsideText = durText;
              if (gapToNext > 120) outsideText += toolText;
              if (gapToNext > 40) {
                // Clip outside text to available gap so it never overlaps next bar
                var outsideClipId = 'oclip-' + sid.replace(/[^a-z0-9]/gi,'').slice(0,6) + '-' + (s.id || '').replace(/[^a-z0-9]/gi,'').slice(0,6) + '-' + s.row;
                defs.append('clipPath').attr('id', outsideClipId)
                  .append('rect')
                  .attr('x', labelWidth + barX + barW)
                  .attr('y', y)
                  .attr('width', Math.min(gapToNext, 200))
                  .attr('height', rowHeight);
                rowsG.append('text')
                  .attr('class', 'span-duration')
                  .attr('x', labelWidth + barX + barW + 4)
                  .attr('y', y + rowHeight / 2)
                  .attr('clip-path', 'url(#' + outsideClipId + ')')
                  .text(outsideText);
              } else if (gapToNext > 8) {
                // Very tight gap — show abbreviated text clipped to gap
                var tightClipId = 'tclip-' + sid.replace(/[^a-z0-9]/gi,'').slice(0,6) + '-' + (s.id || '').replace(/[^a-z0-9]/gi,'').slice(0,6) + '-' + s.row;
                defs.append('clipPath').attr('id', tightClipId)
                  .append('rect')
                  .attr('x', labelWidth + barX + barW)
                  .attr('y', y)
                  .attr('width', gapToNext - 2)
                  .attr('height', rowHeight);
                rowsG.append('text')
                  .attr('class', 'span-duration')
                  .attr('x', labelWidth + barX + barW + 3)
                  .attr('y', y + rowHeight / 2)
                  .style('font-size', '9px')
                  .attr('clip-path', 'url(#' + tightClipId + ')')
                  .text(durText);
              } else {
                // No space right — show inside with clip (at least partial)
                rowsG.append('text')
                  .attr('class', 'span-label')
                  .attr('x', labelWidth + barX + 3)
                  .attr('y', y + rowHeight / 2)
                  .style('font-size', '9px')
                  .attr('clip-path', 'url(#' + clipId + ')')
                  .text(durText);
              }
            }

            // Worker toggle indicator per agent (including resumes that have workers)
            var wList = workersByAgentId[s.id];
            var wCount = wList ? wList.length : 0;
            // Also check if this resume's task_uuid has workers
            if (wCount === 0 && s.taskUuid) {
              // Workers might be keyed by taskUuid through parent_id
              workers.forEach(function(w) {
                if (w.parentId === 'task:' + s.taskUuid) {
                  if (!workersByAgentId[s.id]) workersByAgentId[s.id] = [];
                  workersByAgentId[s.id].push(w);
                  w._parentAgentId = s.id;
                }
              });
              wList = workersByAgentId[s.id];
              wCount = wList ? wList.length : 0;
            }
            // Only show worker indicator on the last span in this row
            // (i.e., skip if there's a later resume on the same row)
            var isLastInRow = !agents.some(function(a) {
              return a.row === s.row && a.start > s.start;
            });
            if (wCount > 0 && isLastInRow) {
              var durationTextW = (s.end && barW <= 60) ? 80 : 0;
              var indicatorX = labelWidth + barX + barW + 4 + durationTextW + 8;
              var indicator = rowsG.append('text')
                .attr('x', indicatorX)
                .attr('y', y + rowHeight / 2)
                .attr('fill', '#a882ff')
                .attr('font-size', '10px')
                .attr('font-family', 'var(--mono)')
                .attr('dominant-baseline', 'central')
                .style('cursor', 'pointer')
                .text('[' + wCount + ' worker' + (wCount > 1 ? 's' : '') + ']');
              (function(agentId) {
                indicator.on('click', function() { toggleWorkers(agentId); });
              })(s.id);
            }

            // Tooltip — show full span details on hover
            (function(span, wc) {
              bar.on('mouseover', function(event) {
                var lines = [
                  span.agentType + (span.isResume ? ' (resumed)' : ''),
                  'Start: ' + fmtTime(new Date(span.start).toISOString()),
                ];
                if (span.end) {
                  lines.push('End: ' + fmtTime(new Date(span.end).toISOString()));
                  lines.push('Duration: ' + fmtDuration((span.end - span.start) / 1000));
                } else {
                  lines.push('Status: running');
                }
                if (span.toolCalls > 0) lines.push('Tools: ' + span.toolCalls);
                if (wc > 0) lines.push('Workers: ' + wc);
                if (span.taskUuid) lines.push('Task: ' + span.taskUuid);
                lines.push('ID: ' + span.id);
                tooltip.style('display', 'block').html(lines.join('\n'));
              })
              .on('mousemove', function(event) {
                tooltip
                  .style('left', (event.offsetX + 12) + 'px')
                  .style('top', (event.offsetY - 10) + 'px');
              })
              .on('mouseout', function() {
                tooltip.style('display', 'none');
              });
            })(s, wCount);
          });

          // No grayed stats — tool counts shown per bar via tooltip and worker indicators
        });
      }

      // --- Worker expansion ---

      function toggleWorkers(agentId) {
        if (expandedState[agentId]) {
          collapseWorkers(agentId);
        } else {
          expandWorkers(agentId);
        }
      }

      function expandWorkers(agentId) {
        var wList = workersByAgentId[agentId];
        if (!wList || wList.length === 0) return;

        wList.sort(function(a, b) { return a.start - b.start; });

        // Find the agent's row to insert workers after
        var agentRow = rowByAgentId[agentId];
        if (agentRow == null) return;

        var wCount = wList.length;

        // Insert workers directly below their parent agent row.
        // Shift all rows below agentRow down by wCount.
        var shiftAmount = wCount;
        agents.forEach(function(a) {
          if (a.row > agentRow) a.row += shiftAmount;
        });
        // Also shift previously expanded workers that are below
        Object.keys(expandedState).forEach(function(aid) {
          var info = expandedState[aid];
          info.workers.forEach(function(w) {
            if (w._expandedRow > agentRow) w._expandedRow += shiftAmount;
          });
        });
        // Update type first rows
        typeOrder.forEach(function(aType) {
          if (typeFirstRow[aType] > agentRow) typeFirstRow[aType] += shiftAmount;
        });
        // Update rowByAgentId
        agents.forEach(function(a) { rowByAgentId[a.id] = a.row; });
        agentRowCount += shiftAmount;

        var workerStartRow = agentRow + 1;

        // Assign rows to workers
        wList.forEach(function(w, idx) {
          w._expandedRow = workerStartRow + idx;
        });

        expandedState[agentId] = {
          count: wCount,
          workers: wList,
          startRow: workerStartRow
        };

        // Full redraw since rows shifted
        fullRedraw();
      }

      function collapseWorkers(agentId) {
        if (!expandedState[agentId]) return;
        var info = expandedState[agentId];
        var shiftAmount = info.count;
        var agentRow = rowByAgentId[agentId];

        // Shift rows back up
        agents.forEach(function(a) {
          if (a.row > agentRow + shiftAmount) a.row -= shiftAmount;
        });
        Object.keys(expandedState).forEach(function(aid) {
          if (aid === agentId) return;
          var inf = expandedState[aid];
          inf.workers.forEach(function(w) {
            if (w._expandedRow > agentRow + shiftAmount) w._expandedRow -= shiftAmount;
          });
        });
        typeOrder.forEach(function(aType) {
          if (typeFirstRow[aType] > agentRow + shiftAmount) typeFirstRow[aType] -= shiftAmount;
        });
        agents.forEach(function(a) { rowByAgentId[a.id] = a.row; });
        agentRowCount -= shiftAmount;

        delete expandedState[agentId];
        fullRedraw();
      }

      function fullRedraw() {
        var totalRows = agentRowCount;
        // Count expanded worker rows
        Object.keys(expandedState).forEach(function(aid) {
          // workers are already counted in agentRowCount via the shift
        });
        var newHeight = topMargin + totalRows * rowHeight + bottomMargin;
        svg.attr('height', newHeight);

        axisG.selectAll('*').remove();
        arrowG.selectAll('*').remove();
        rowsG.selectAll('*').remove();

        drawAxisTicks(totalRows);
        drawSessionBar();
        drawArrows();
        drawAgentBars();

        // Redraw expanded workers
        Object.keys(expandedState).forEach(function(aid) {
          var info = expandedState[aid];
          var parentRow = rowByAgentId[aid];
          var safeId = aid.replace(/[^a-zA-Z0-9]/g, '_');
          var wg = rowsG.append('g').attr('class', 'worker-group-' + safeId);

          info.workers.forEach(function(w, idx) {
            w._expandedRow = info.startRow + idx;
            var y = w._expandedRow * rowHeight;
            var color = agentHex(w.agentType);

            wg.append('text')
              .attr('class', 'row-label')
              .attr('x', 20)
              .attr('y', y + rowHeight / 2)
              .attr('fill', 'rgba(255,255,255,0.45)')
              .attr('font-size', '10px')
              .text('\u2514 ' + (w.agentType || 'worker'));

            var barX = xScale(w.start);
            var barEnd = w.end ? xScale(w.end) : xScale(w.start) + 8;
            var barW = Math.max(4, barEnd - barX);

            wg.append('rect')
              .attr('class', 'span-bar')
              .attr('x', labelWidth + barX)
              .attr('y', y + 6)
              .attr('width', barW)
              .attr('height', rowHeight - 12)
              .attr('fill', color)
              .attr('opacity', 0.6)
              .attr('rx', 2);

            if (w.end) {
              wg.append('text')
                .attr('class', 'span-duration')
                .attr('x', labelWidth + barX + barW + 4)
                .attr('y', y + rowHeight / 2)
                .attr('font-size', '10px')
                .text(fmtDuration((w.end - w.start) / 1000));
            }

            // Arrow from parent to worker
            var parentY = parentRow * rowHeight + rowHeight - 4;
            var workerY = y + rowHeight / 2;
            arrowG.append('path')
              .attr('class', 'arrow-line')
              .attr('d', 'M' + barX + ',' + parentY +
                ' L' + barX + ',' + workerY)
              .attr('marker-end', 'url(#trace-arrow-' + sid + ')')
              .attr('opacity', 0.5);
          });
        });
      }

      // --- Initial render ---
      drawSessionBar();
      drawArrows();
      drawAgentBars();
    }

    function formatTraceTime(ms, baseMs) {
      var relative = (ms - baseMs) / 1000;
      if (relative < 60) return '+' + relative.toFixed(0) + 's';
      if (relative < 3600) return '+' + (relative / 60).toFixed(1) + 'm';
      return '+' + (relative / 3600).toFixed(1) + 'h';
    }

    function shiftColor(hexColor, index) {
      // Darken/lighten for same-type variants
      try {
        var r = parseInt(hexColor.slice(1,3), 16);
        var g = parseInt(hexColor.slice(3,5), 16);
        var b = parseInt(hexColor.slice(5,7), 16);
        var shift = (index % 2 === 0) ? -30 * ((index + 2) / 2) : 30 * ((index + 1) / 2);
        r = Math.max(0, Math.min(255, r + shift));
        g = Math.max(0, Math.min(255, g + shift));
        b = Math.max(0, Math.min(255, b + shift));
        return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
      } catch(e) {
        return hexColor;
      }
    }

    // ===== Tree View (improved) =====
    function renderTreeView(treeData) {
      return '<div class="tree">' + renderNode(treeData) + '</div>';
    }

    function renderNode(node) {
      // Skip event nodes
      if (node.type === 'event') return '';

      var color = agentColor(node.agent_type);
      var badgeClass = 'badge-' + color;
      var icon = '';
      var label = '';

      if (node.type === 'session') {
        badgeClass = 'badge-session';
        icon = 'S';
        label = 'Session';
      } else if (node.type === 'agent') {
        icon = 'A';
        label = esc(node.agent_type || 'agent');
      } else if (node.type === 'worker') {
        badgeClass = node.agent_type ? 'badge-' + color : 'badge-worker';
        icon = 'W';
        label = esc(node.agent_type || 'worker');
      }

      var parts = [];
      if (node.duration_seconds != null) parts.push(fmtDuration(node.duration_seconds));
      if (node.children) {
        var wc = node.children.filter(function(c) { return c.type === 'worker'; }).length;
        if (wc) parts.push(wc + ' workers');
      }
      var meta = parts.join(' / ');

      // Show tools dict as compact inline: "Bash:2 Edit:1 Read:3"
      var toolsInline = toolSummaryInline(node.tools);
      var toolsHtml = toolsInline ? '<span class="node-tools-inline">' + esc(toolsInline) + '</span>' : '';

      // Filter out event children
      var validChildren = (node.children || []).filter(function(c) { return c.type !== 'event'; });
      var childrenHtml = validChildren.map(function(c) { return renderNode(c); }).join('');
      var hasChildren = validChildren.length > 0;

      if (!hasChildren) {
        return '<div style="padding:3px 8px;font-size:12px;font-family:var(--mono);display:flex;align-items:center;gap:6px;">' +
          '<span class="badge ' + badgeClass + '">' + icon + '</span>' +
          '<span class="node-label">' + label + '</span>' +
          toolsHtml +
          (meta ? '<span class="node-meta">' + esc(meta) + '</span>' : '') +
        '</div>';
      }

      return '<details>' +
        '<summary>' +
          '<span class="badge ' + badgeClass + '">' + icon + '</span>' +
          '<span class="node-label">' + label + '</span>' +
          toolsHtml +
          (meta ? '<span class="node-meta">' + esc(meta) + '</span>' : '') +
        '</summary>' +
        childrenHtml +
      '</details>';
    }

    // ===== Expand/Collapse controls =====
    function expandAllSessions() {
      if (globalUnit === 'time') {
        // Time view: expand session cards or project headers
        if (currentProject) {
          document.querySelectorAll('.session-card').forEach(function(card) {
            if (!card.classList.contains('expanded')) {
              var head = card.querySelector('.session-head');
              if (head) toggleSession(head);
            }
          });
        } else {
          // Expand all projects in time view
          document.querySelectorAll('.project-header[data-project-slug]').forEach(function(header) {
            var slug = header.dataset.projectSlug;
            if (!expandedProjectSlugs.has(slug)) {
              toggleProjectTimeExpand(header, slug);
            }
          });
        }
      } else {
        // Decomp view: expand all projects or sessions
        if (currentProject) {
          // Expand all sessions in decomp
          document.querySelectorAll('.decomp-bar-row[data-sid]').forEach(function(row) {
            var sid = row.dataset.sid;
            if (!expandedSessionIds.has(sid)) {
              decompToggleSession(row, sid);
            }
          });
        } else {
          // Expand all projects in decomp
          document.querySelectorAll('.decomp-bar-row[data-project-slug]').forEach(function(row) {
            var slug = row.dataset.projectSlug;
            if (!expandedProjectSlugs.has(slug)) {
              decompToggleProject(row, slug);
            }
          });
        }
      }
    }

    function collapseAllSessions() {
      if (globalUnit === 'time') {
        if (currentProject) {
          document.querySelectorAll('.session-card.expanded').forEach(function(card) {
            var sid = card.dataset.sid;
            card.classList.remove('expanded');
            if (cytoscapeInstances[sid]) {
              cytoscapeInstances[sid].destroy();
              delete cytoscapeInstances[sid];
            }
          });
        } else {
          // Collapse all projects in time view
          Array.from(expandedProjectSlugs).forEach(function(slug) {
            var header = document.querySelector('.project-header[data-project-slug="' + slug + '"]');
            if (header) toggleProjectTimeExpand(header, slug);
          });
        }
      } else {
        if (currentProject) {
          Array.from(expandedSessionIds).forEach(function(sid) {
            var row = document.querySelector('.decomp-bar-row[data-sid="' + sid + '"]');
            if (row) decompToggleSession(row, sid);
          });
        } else {
          Array.from(expandedProjectSlugs).forEach(function(slug) {
            var row = document.querySelector('.decomp-bar-row[data-project-slug="' + slug + '"]');
            if (row) decompToggleProject(row, slug);
          });
        }
      }
    }

    // ===== Stats =====
    var statsViewMode = 'absolute'; // 'absolute' or 'percentage'
    var globalToolData = null; // cached /api/stats/tools response
    var expandedAgentType = null; // currently expanded agent type in stats
    var timelineGranularity = null; // null = auto, 'hour'|'day'|'week'|'month'
    var timelinePeriod = 'all'; // 'all'|'24h'|'7d'|'30d'
    var rawTimelineCache = null; // cache raw timeline data for re-renders

    async function loadStats() {
      var el = document.getElementById('stats-content');
      try {
        var results = await Promise.all([
          fetch('/api/stats').then(function(r) { return r.json(); }),
          fetch('/api/stats/tools').then(function(r) { return r.json(); })
        ]);
        var statsData = results[0];
        globalToolData = results[1];
        renderStats(statsData, el);
      } catch(e) {
        el.innerHTML = '<div class="empty-state">Failed to load statistics</div>';
      }
    }

    function renderStats(data, el) {
      if (!data.totals) {
        el.innerHTML = '<div class="empty-state">No data available</div>';
        return;
      }

      var t = data.totals;
      var html = '<div class="stats-grid">';
      var cards = [
        { v: t.sessions, l: 'Sessions' },
        { v: t.events, l: 'Events' },
        { v: t.agents, l: 'Agents' },
        { v: t.workers, l: 'Workers' },
        { v: t.tool_calls, l: 'Tool Calls' },
      ];
      cards.forEach(function(c) {
        html += '<div class="stat-card"><div class="value">' + c.v + '</div><div class="label">' + c.l + '</div></div>';
      });
      html += '</div>';

      // Agent type breakdown with toggle and clickable bars
      if (data.by_agent_type && Object.keys(data.by_agent_type).length) {
        var totalAgents = Object.values(data.by_agent_type).reduce(function(s, v) { return s + v; }, 0);
        var maxVal = Math.max.apply(null, Object.values(data.by_agent_type));

        html += '<div class="stats-section"><h3>Agent Types</h3>';
        html += '<div class="stats-toggle">';
        html += '<button class="stats-toggle-btn' + (statsViewMode === 'absolute' ? ' active' : '') + '" onclick="setStatsViewMode(\'absolute\')">Counts</button>';
        html += '<button class="stats-toggle-btn' + (statsViewMode === 'percentage' ? ' active' : '') + '" onclick="setStatsViewMode(\'percentage\')">Percentage</button>';
        html += '</div>';

        var sortedTypes = Object.entries(data.by_agent_type).sort(function(a, b) { return b[1] - a[1]; });
        sortedTypes.forEach(function(entry) {
          var type = entry[0], count = entry[1];
          var pct = maxVal > 0 ? (count / maxVal * 100) : 0;
          var pctOfTotal = totalAgents > 0 ? (count / totalAgents * 100).toFixed(1) : '0.0';
          var color = 'var(--' + agentColor(type) + ')';
          var displayCount = statsViewMode === 'percentage' ? pctOfTotal + '%' : count;
          var barWidth = statsViewMode === 'percentage' ? (count / totalAgents * 100) : pct;

          html += '<div class="bar-row" onclick="toggleAgentDetail(\'' + esc(type) + '\')" title="Click for details">' +
            '<span class="bar-label">' + esc(type) + '</span>' +
            '<div class="bar-track"><div class="bar-fill" style="width:' + barWidth + '%;background:' + color + '"></div></div>' +
            '<span class="bar-count">' + displayCount + '</span>' +
          '</div>';

          // Agent detail panel (expanded)
          if (expandedAgentType === type) {
            html += renderAgentDetailPanel(type);
          }
        });
        html += '</div>';
      }

      // Tool usage section (from /api/stats/tools — single call)
      html += renderGlobalToolUsage();

      // Path frequencies
      if (data.path_frequencies && data.path_frequencies.length) {
        html += '<div class="stats-section"><h3>Agent Flow Patterns</h3><ul class="path-list">';
        data.path_frequencies.slice(0, 20).forEach(function(pf) {
          var flowHtml = pf.path.map(function(p) {
            return '<span style="color:var(--' + agentColor(p) + ')">' + esc(p) + '</span>';
          }).join('<span class="arrow"> &rarr; </span>');
          html += '<li class="path-item"><span class="path-flow">' + flowHtml + '</span><span class="path-count">' + pf.count + '</span></li>';
        });
        html += '</ul></div>';
      }

      // Timeline
      if (data.timeline && data.timeline.length) {
        rawTimelineCache = data.timeline;
        html += renderTimelineSection(data.timeline);
      }

      // Averages
      if (data.averages) {
