                  .attr('clip-path', 'url(#' + clipId + ')')
                  .text(durText);
              }
            }

            // Worker toggle indicator per agent (including resumes that have workers)
            var wList = workersByAgentId[s.id];
            var wCount = wList ? wList.length : 0;
            // Also check if this resume's task_uuid has workers
            if (wCount === 0 && s.taskUuid) {
              // Workers might be keyed by taskUuid through parent_id
              workers.forEach(function(w) {
                if (w.parentId === 'task:' + s.taskUuid) {
                  if (!workersByAgentId[s.id]) workersByAgentId[s.id] = [];
                  workersByAgentId[s.id].push(w);
                  w._parentAgentId = s.id;
                }
              });
              wList = workersByAgentId[s.id];
              wCount = wList ? wList.length : 0;
            }
            // Only show worker indicator on the last span in this row
            // (i.e., skip if there's a later resume on the same row)
            var isLastInRow = !agents.some(function(a) {
              return a.row === s.row && a.start > s.start;
            });
            if (wCount > 0 && isLastInRow) {
              var durationTextW = (s.end && barW <= 60) ? 80 : 0;
              var indicatorX = labelWidth + barX + barW + 4 + durationTextW + 8;
              var indicator = rowsG.append('text')
                .attr('x', indicatorX)
                .attr('y', y + rowHeight / 2)
                .attr('fill', '#a882ff')
                .attr('font-size', '10px')
                .attr('font-family', 'var(--mono)')
                .attr('dominant-baseline', 'central')
                .style('cursor', 'pointer')
                .text('[' + wCount + ' worker' + (wCount > 1 ? 's' : '') + ']');
              (function(agentId) {
                indicator.on('click', function() { toggleWorkers(agentId); });
              })(s.id);
            }

            // Tooltip
            (function(span, wc) {
              bar.on('mouseover', function(event) {
                var lines = [
                  span.agentType + (span.isResume ? ' (resumed)' : ' (fresh)'),
                  'ID: ' + span.id.slice(0, 12) + '...',
                  'Start: ' + fmtTime(new Date(span.start).toISOString()),
                ];
                if (span.end) {
                  lines.push('End: ' + fmtTime(new Date(span.end).toISOString()));
                  lines.push('Duration: ' + fmtDuration((span.end - span.start) / 1000));
                } else {
                  lines.push('Status: running');
                }
                lines.push('Workers: ' + wc);
                if (span.taskUuid) lines.push('Task: ' + span.taskUuid.slice(0, 16) + '...');
                tooltip.style('display', 'block').html(lines.join('\n'));
              })
              .on('mousemove', function(event) {
                tooltip
                  .style('left', (event.offsetX + 12) + 'px')
                  .style('top', (event.offsetY - 10) + 'px');
              })
              .on('mouseout', function() {
                tooltip.style('display', 'none');
              });
            })(s, wCount);
          });

          // No grayed stats — tool counts shown per bar via tooltip and worker indicators
        });
      }

      // --- Worker expansion ---

      function toggleWorkers(agentId) {
        if (expandedState[agentId]) {
          collapseWorkers(agentId);
        } else {
          expandWorkers(agentId);
        }
      }

      function expandWorkers(agentId) {
        var wList = workersByAgentId[agentId];
        if (!wList || wList.length === 0) return;

        wList.sort(function(a, b) { return a.start - b.start; });

        // Find the agent's row to insert workers after
        var agentRow = rowByAgentId[agentId];
        if (agentRow == null) return;

        var wCount = wList.length;

        // Insert workers directly below their parent agent row.
        // Shift all rows below agentRow down by wCount.
        var shiftAmount = wCount;
        agents.forEach(function(a) {
          if (a.row > agentRow) a.row += shiftAmount;
        });
        // Also shift previously expanded workers that are below
        Object.keys(expandedState).forEach(function(aid) {
          var info = expandedState[aid];
          info.workers.forEach(function(w) {
            if (w._expandedRow > agentRow) w._expandedRow += shiftAmount;
          });
        });
        // Update type first rows
        typeOrder.forEach(function(aType) {
          if (typeFirstRow[aType] > agentRow) typeFirstRow[aType] += shiftAmount;
        });
        // Update rowByAgentId
        agents.forEach(function(a) { rowByAgentId[a.id] = a.row; });
        agentRowCount += shiftAmount;

        var workerStartRow = agentRow + 1;

        // Assign rows to workers
        wList.forEach(function(w, idx) {
          w._expandedRow = workerStartRow + idx;
        });

        expandedState[agentId] = {
          count: wCount,
          workers: wList,
          startRow: workerStartRow
        };

        // Full redraw since rows shifted
        fullRedraw();
      }

      function collapseWorkers(agentId) {
        if (!expandedState[agentId]) return;
        var info = expandedState[agentId];
        var shiftAmount = info.count;
        var agentRow = rowByAgentId[agentId];

        // Shift rows back up
        agents.forEach(function(a) {
          if (a.row > agentRow + shiftAmount) a.row -= shiftAmount;
        });
        Object.keys(expandedState).forEach(function(aid) {
          if (aid === agentId) return;
          var inf = expandedState[aid];
          inf.workers.forEach(function(w) {
            if (w._expandedRow > agentRow + shiftAmount) w._expandedRow -= shiftAmount;
          });
        });
        typeOrder.forEach(function(aType) {
          if (typeFirstRow[aType] > agentRow + shiftAmount) typeFirstRow[aType] -= shiftAmount;
        });
        agents.forEach(function(a) { rowByAgentId[a.id] = a.row; });
        agentRowCount -= shiftAmount;

        delete expandedState[agentId];
        fullRedraw();
      }

      function fullRedraw() {
        var totalRows = agentRowCount;
        // Count expanded worker rows
        Object.keys(expandedState).forEach(function(aid) {
          // workers are already counted in agentRowCount via the shift
        });
        var newHeight = topMargin + totalRows * rowHeight + bottomMargin;
        svg.attr('height', newHeight);

        axisG.selectAll('*').remove();
        arrowG.selectAll('*').remove();
        rowsG.selectAll('*').remove();

        drawAxisTicks(totalRows);
        drawSessionBar();
        drawArrows();
        drawAgentBars();

        // Redraw expanded workers
        Object.keys(expandedState).forEach(function(aid) {
          var info = expandedState[aid];
          var parentRow = rowByAgentId[aid];
          var safeId = aid.replace(/[^a-zA-Z0-9]/g, '_');
          var wg = rowsG.append('g').attr('class', 'worker-group-' + safeId);

          info.workers.forEach(function(w, idx) {
            w._expandedRow = info.startRow + idx;
            var y = w._expandedRow * rowHeight;
            var color = agentHex(w.agentType);

            wg.append('text')
              .attr('class', 'row-label')
              .attr('x', 20)
              .attr('y', y + rowHeight / 2)
              .attr('fill', 'rgba(255,255,255,0.45)')
              .attr('font-size', '10px')
              .text('\u2514 ' + (w.agentType || 'worker'));

            var barX = xScale(w.start);
            var barEnd = w.end ? xScale(w.end) : xScale(w.start) + 8;
            var barW = Math.max(4, barEnd - barX);

            wg.append('rect')
              .attr('class', 'span-bar')
              .attr('x', labelWidth + barX)
              .attr('y', y + 6)
              .attr('width', barW)
              .attr('height', rowHeight - 12)
              .attr('fill', color)
              .attr('opacity', 0.6)
              .attr('rx', 2);

            if (w.end) {
              wg.append('text')
                .attr('class', 'span-duration')
                .attr('x', labelWidth + barX + barW + 4)
                .attr('y', y + rowHeight / 2)
                .attr('font-size', '10px')
                .text(fmtDuration((w.end - w.start) / 1000));
            }

            // Arrow from parent to worker
            var parentY = parentRow * rowHeight + rowHeight - 4;
            var workerY = y + rowHeight / 2;
            arrowG.append('path')
              .attr('class', 'arrow-line')
              .attr('d', 'M' + barX + ',' + parentY +
                ' L' + barX + ',' + workerY)
              .attr('marker-end', 'url(#trace-arrow-' + sid + ')')
              .attr('opacity', 0.5);
          });
        });
      }

      // --- Initial render ---
      drawSessionBar();
      drawArrows();
      drawAgentBars();
    }

    function formatTraceTime(ms, baseMs) {
      var relative = (ms - baseMs) / 1000;
      if (relative < 60) return '+' + relative.toFixed(0) + 's';
      if (relative < 3600) return '+' + (relative / 60).toFixed(1) + 'm';
      return '+' + (relative / 3600).toFixed(1) + 'h';
    }

    function shiftColor(hexColor, index) {
      // Darken/lighten for same-type variants
      try {
        var r = parseInt(hexColor.slice(1,3), 16);
        var g = parseInt(hexColor.slice(3,5), 16);
        var b = parseInt(hexColor.slice(5,7), 16);
        var shift = (index % 2 === 0) ? -30 * ((index + 2) / 2) : 30 * ((index + 1) / 2);
        r = Math.max(0, Math.min(255, r + shift));
        g = Math.max(0, Math.min(255, g + shift));
        b = Math.max(0, Math.min(255, b + shift));
        return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
      } catch(e) {
        return hexColor;
      }
    }

    // ===== Tree View (improved) =====
    function renderTreeView(treeData) {
      return '<div class="tree">' + renderNode(treeData) + '</div>';
    }

    function renderNode(node) {
      // Skip event nodes
      if (node.type === 'event') return '';

      var color = agentColor(node.agent_type);
      var badgeClass = 'badge-' + color;
      var icon = '';
      var label = '';

      if (node.type === 'session') {
        badgeClass = 'badge-session';
        icon = 'S';
        label = 'Session';
      } else if (node.type === 'agent') {
        icon = 'A';
        label = esc(node.agent_type || 'agent');
      } else if (node.type === 'worker') {
        badgeClass = node.agent_type ? 'badge-' + color : 'badge-worker';
        icon = 'W';
        label = esc(node.agent_type || 'worker');
      }

      var parts = [];
      if (node.duration_seconds != null) parts.push(fmtDuration(node.duration_seconds));
      if (node.children) {
        var wc = node.children.filter(function(c) { return c.type === 'worker'; }).length;
        if (wc) parts.push(wc + ' workers');
      }
      var meta = parts.join(' / ');

      // Show tools dict as compact inline: "Bash:2 Edit:1 Read:3"
      var toolsInline = toolSummaryInline(node.tools);
      var toolsHtml = toolsInline ? '<span class="node-tools-inline">' + esc(toolsInline) + '</span>' : '';

      // Filter out event children
      var validChildren = (node.children || []).filter(function(c) { return c.type !== 'event'; });
      var childrenHtml = validChildren.map(function(c) { return renderNode(c); }).join('');
      var hasChildren = validChildren.length > 0;

      if (!hasChildren) {
        return '<div style="padding:3px 8px;font-size:12px;font-family:var(--mono);display:flex;align-items:center;gap:6px;">' +
          '<span class="badge ' + badgeClass + '">' + icon + '</span>' +
          '<span class="node-label">' + label + '</span>' +
          toolsHtml +
          (meta ? '<span class="node-meta">' + esc(meta) + '</span>' : '') +
        '</div>';
      }

      return '<details>' +
        '<summary>' +
          '<span class="badge ' + badgeClass + '">' + icon + '</span>' +
          '<span class="node-label">' + label + '</span>' +
          toolsHtml +
          (meta ? '<span class="node-meta">' + esc(meta) + '</span>' : '') +
        '</summary>' +
        childrenHtml +
      '</details>';
    }

    // ===== Expand/Collapse controls =====
    function expandAllSessions() {
      document.querySelectorAll('.session-card').forEach(function(card) {
        if (!card.classList.contains('expanded')) {
          var head = card.querySelector('.session-head');
          if (head) toggleSession(head);
        }
      });
    }

    function collapseAllSessions() {
      document.querySelectorAll('.session-card.expanded').forEach(function(card) {
        var sid = card.dataset.sid;
        card.classList.remove('expanded');
        if (cytoscapeInstances[sid]) {
          cytoscapeInstances[sid].destroy();
          delete cytoscapeInstances[sid];
        }
      });
    }

    // ===== Stats =====
    var statsViewMode = 'absolute'; // 'absolute' or 'percentage'
    var globalToolData = null; // cached /api/stats/tools response
    var expandedAgentType = null; // currently expanded agent type in stats

    async function loadStats() {
      var el = document.getElementById('stats-content');
      try {
        var results = await Promise.all([
          fetch('/api/stats').then(function(r) { return r.json(); }),
          fetch('/api/stats/tools').then(function(r) { return r.json(); })
        ]);
        var statsData = results[0];
        globalToolData = results[1];
        renderStats(statsData, el);
      } catch(e) {
        el.innerHTML = '<div class="empty-state">Failed to load statistics</div>';
      }
    }

    function renderStats(data, el) {
      if (!data.totals) {
        el.innerHTML = '<div class="empty-state">No data available</div>';
        return;
      }

      var t = data.totals;
      var html = '<div class="stats-grid">';
      var cards = [
        { v: t.sessions, l: 'Sessions' },
        { v: t.events, l: 'Events' },
        { v: t.agents, l: 'Agents' },
        { v: t.workers, l: 'Workers' },
        { v: t.tool_calls, l: 'Tool Calls' },
      ];
      cards.forEach(function(c) {
        html += '<div class="stat-card"><div class="value">' + c.v + '</div><div class="label">' + c.l + '</div></div>';
      });
      html += '</div>';

      // Agent type breakdown with toggle and clickable bars
      if (data.by_agent_type && Object.keys(data.by_agent_type).length) {
        var totalAgents = Object.values(data.by_agent_type).reduce(function(s, v) { return s + v; }, 0);
        var maxVal = Math.max.apply(null, Object.values(data.by_agent_type));

        html += '<div class="stats-section"><h3>Agent Types</h3>';
        html += '<div class="stats-toggle">';
        html += '<button class="stats-toggle-btn' + (statsViewMode === 'absolute' ? ' active' : '') + '" onclick="setStatsViewMode(\'absolute\')">Counts</button>';
        html += '<button class="stats-toggle-btn' + (statsViewMode === 'percentage' ? ' active' : '') + '" onclick="setStatsViewMode(\'percentage\')">Percentage</button>';
        html += '</div>';

        var sortedTypes = Object.entries(data.by_agent_type).sort(function(a, b) { return b[1] - a[1]; });
        sortedTypes.forEach(function(entry) {
          var type = entry[0], count = entry[1];
          var pct = maxVal > 0 ? (count / maxVal * 100) : 0;
          var pctOfTotal = totalAgents > 0 ? (count / totalAgents * 100).toFixed(1) : '0.0';
          var color = 'var(--' + agentColor(type) + ')';
          var displayCount = statsViewMode === 'percentage' ? pctOfTotal + '%' : count;
          var barWidth = statsViewMode === 'percentage' ? (count / totalAgents * 100) : pct;

          html += '<div class="bar-row" onclick="toggleAgentDetail(\'' + esc(type) + '\')" title="Click for details">' +
            '<span class="bar-label">' + esc(type) + '</span>' +
            '<div class="bar-track"><div class="bar-fill" style="width:' + barWidth + '%;background:' + color + '"></div></div>' +
            '<span class="bar-count">' + displayCount + '</span>' +
          '</div>';

          // Agent detail panel (expanded)
          if (expandedAgentType === type) {
            html += renderAgentDetailPanel(type);
          }
        });
        html += '</div>';
      }

      // Tool usage section (from /api/stats/tools — single call)
      html += renderGlobalToolUsage();

      // Path frequencies
      if (data.path_frequencies && data.path_frequencies.length) {
        html += '<div class="stats-section"><h3>Agent Flow Patterns</h3><ul class="path-list">';
        data.path_frequencies.slice(0, 20).forEach(function(pf) {
          var flowHtml = pf.path.map(function(p) {
            return '<span style="color:var(--' + agentColor(p) + ')">' + esc(p) + '</span>';
          }).join('<span class="arrow"> &rarr; </span>');
          html += '<li class="path-item"><span class="path-flow">' + flowHtml + '</span><span class="path-count">' + pf.count + '</span></li>';
        });
        html += '</ul></div>';
      }

      // Timeline
      if (data.timeline && data.timeline.length) {
        var maxCount = Math.max.apply(null, data.timeline.map(function(t) { return t.count; }));
        html += '<div class="stats-section"><h3>Timeline (hourly)</h3><div class="timeline-chart">';
        data.timeline.forEach(function(t) {
          var pct = maxCount > 0 ? (t.count / maxCount * 100) : 0;
          var label = fmtTimelineLabel(t.hour);
          html += '<div class="timeline-bar-wrap">' +
            '<div class="timeline-count">' + t.count + '</div>' +
            '<div class="timeline-bar" style="height:' + Math.max(pct, 3) + '%"></div>' +
            '<div class="timeline-label">' + esc(label) + '</div>' +
          '</div>';
        });
        html += '</div></div>';
      }

      // Averages
      if (data.averages) {
        html += '<div class="stats-section"><h3>Averages</h3><div class="avg-grid">';
        html += '<div class="avg-item"><div class="value">' + fmtDuration(data.averages.session_duration) + '</div><div class="label">Avg Session Duration</div></div>';
        html += '<div class="avg-item"><div class="value">' + (data.averages.agents_per_session || 0).toFixed(1) + '</div><div class="label">Agents / Session</div></div>';
        html += '</div></div>';
      }

      el.innerHTML = html;
    }

    function setStatsViewMode(mode) {
      statsViewMode = mode;
      loadStats();
    }

    function toggleAgentDetail(type) {
      expandedAgentType = expandedAgentType === type ? null : type;
      loadStats();
    }

    function renderAgentDetailPanel(type) {
      if (!globalToolData) return '';

      var agentTypes = globalToolData.agent_types || {};
      var toolsForAgent = agentTypes[type] || {};
      var sorted = Object.entries(toolsForAgent).sort(function(a, b) { return b[1] - a[1]; });
      var totalTools = sorted.reduce(function(s, e) { return s + e[1]; }, 0);

      // Count sessions using this agent type
      var sessionCount = 0;
      sessionsCache.forEach(function(s) {
        if (s.agent_types && s.agent_types.indexOf(type) !== -1) sessionCount++;
      });

      var html = '<div class="agent-detail-panel">';
      html += '<h4>' + esc(type) + ' Details</h4>';
      html += '<div class="agent-detail-row"><span class="dl">Sessions using this type</span><span class="dv">' + sessionCount + '</span></div>';
      html += '<div class="agent-detail-row"><span class="dl">Total tool calls</span><span class="dv">' + totalTools + '</span></div>';

      if (sorted.length > 0) {
        // Mini stacked bar
        html += '<div style="margin:8px 0 4px 0;">';
        html += '<div class="tool-usage-bar" style="height:20px;">';
        sorted.forEach(function(entry) {
          var pct = totalTools > 0 ? (entry[1] / totalTools * 100) : 0;
          html += '<div class="tool-usage-segment" style="width:' + pct + '%;background:' + getToolColor(entry[0]) + '" title="' + esc(entry[0]) + ': ' + entry[1] + '"></div>';
        });
        html += '</div></div>';

        // Tool table
        html += '<table class="tool-stats-table">';
        html += '<thead><tr><th>Tool</th><th>Calls</th><th>%</th></tr></thead><tbody>';
        sorted.forEach(function(entry) {
          var pct = totalTools > 0 ? (entry[1] / totalTools * 100).toFixed(1) : '0.0';
          html += '<tr>';
          html += '<td><span class="tool-color-dot" style="background:' + getToolColor(entry[0]) + ';display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:middle;"></span>' + esc(entry[0]) + '</td>';
          html += '<td>' + entry[1] + '</td>';
          html += '<td>' + pct + '%</td>';
          html += '</tr>';
        });
        html += '</tbody></table>';
      } else {
        html += '<div style="color:var(--text-dim);font-size:11px;margin-top:6px;">No tool data for this agent type</div>';
      }

      html += '</div>';
      return html;
    }

    // ===== Tool Usage Statistics Section (single /api/stats/tools call) =====
    function renderGlobalToolUsage() {
      if (!globalToolData) return '';

      var totals = globalToolData.totals || {};
      var agentTypes = globalToolData.agent_types || {};
      var sorted = Object.entries(totals)
        .filter(function(e) { return e[0] !== 'supercharge'; })
        .sort(function(a, b) { return b[1] - a[1]; });

      if (sorted.length === 0) return '';

      var total = sorted.reduce(function(s, e) { return s + e[1]; }, 0);
      var superchargeCount = totals.supercharge || 0;

      var html = '<div class="stats-section"><h3>Tool Usage</h3>';

      // Supercharge highlight
      if (superchargeCount > 0) {
        html += '<div style="margin-bottom:10px;font-size:11px;">';
        html += '<span class="supercharge-highlight">supercharge</span> bash calls: <b style="color:var(--text-bright)">' + superchargeCount + '</b>';
        html += '</div>';
      }

      // Stacked bar
      html += '<div class="tool-usage-bar">';
      sorted.forEach(function(entry) {
        var pct = total > 0 ? (entry[1] / total * 100) : 0;
        var label = pct > 5 ? entry[0] : '';
        html += '<div class="tool-usage-segment" style="width:' + pct + '%;background:' + getToolColor(entry[0]) + '" title="' + esc(entry[0]) + ': ' + entry[1] + '">' + esc(label) + '</div>';
      });
      html += '</div>';

      // Table
      html += '<table class="tool-stats-table">';
      html += '<thead><tr><th>Tool</th><th>Calls</th><th>%</th></tr></thead><tbody>';
      sorted.forEach(function(entry) {
        var pct = total > 0 ? (entry[1] / total * 100).toFixed(1) : '0.0';
        html += '<tr>';
        html += '<td><span class="tool-color-dot" style="background:' + getToolColor(entry[0]) + ';display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:middle;"></span>' + esc(entry[0]) + '</td>';
        html += '<td>' + entry[1] + '</td>';
        html += '<td>' + pct + '%</td>';
        html += '</tr>';
      });
      html += '</tbody></table>';

      // Per-agent-type grouped bars
      var agentTypeKeys = Object.keys(agentTypes);
      if (agentTypeKeys.length > 0) {
        // Collect all tool names across agents
        var allTools = {};
        agentTypeKeys.forEach(function(at) {
          Object.keys(agentTypes[at]).forEach(function(t) { allTools[t] = true; });
        });
        var toolNames = Object.keys(allTools).sort();

        html += '<h4 style="font-size:11px;color:var(--text-bright);margin-top:16px;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px;">Tool Usage by Agent Type</h4>';
        html += '<div class="agent-tool-grid">';

        var maxAgentTotal = 0;
        agentTypeKeys.forEach(function(at) {
          var atTotal = Object.values(agentTypes[at]).reduce(function(s, v) { return s + v; }, 0);
          if (atTotal > maxAgentTotal) maxAgentTotal = atTotal;
        });

        agentTypeKeys.sort(function(a, b) {
          var aTotal = Object.values(agentTypes[a]).reduce(function(s, v) { return s + v; }, 0);
          var bTotal = Object.values(agentTypes[b]).reduce(function(s, v) { return s + v; }, 0);
          return bTotal - aTotal;
        }).forEach(function(at) {
          var atTools = agentTypes[at];
          var atTotal = Object.values(atTools).reduce(function(s, v) { return s + v; }, 0);

          html += '<div class="agent-tool-row">';
          html += '<div class="agent-tool-row-label" style="color:var(--' + agentColor(at) + ')">' + esc(at) + '</div>';
          html += '<div class="agent-tool-row-bar">';

          var sortedAgentTools = Object.entries(atTools).sort(function(a, b) { return b[1] - a[1]; });
          sortedAgentTools.forEach(function(entry) {
            var pct = maxAgentTotal > 0 ? (entry[1] / maxAgentTotal * 100) : 0;
            html += '<div class="agent-tool-row-segment" style="width:' + pct + '%;background:' + getToolColor(entry[0]) + '" title="' + esc(entry[0]) + ': ' + entry[1] + '"></div>';
          });

          html += '</div>';
          html += '<span style="font-family:var(--mono);font-size:10px;color:var(--text-dim);min-width:35px;text-align:right;">' + atTotal + '</span>';
          html += '</div>';
        });

        html += '</div>';
      }

      html += '</div>';
      return html;
    }

    // ===== Browse =====
    async function loadBrowse() {
      var el = document.getElementById('browse-content');
      try {
        var resp = await fetch('/api/browse');
        var data = await resp.json();
        renderBrowse(data, el);
      } catch(e) {
        el.innerHTML = '<div class="empty-state">Failed to load file tree</div>';
      }
    }

    function renderBrowse(data, el) {
      if (!data.tree) {
        el.innerHTML = '<div class="empty-state">No SuperchargeAI directory found</div>';
        return;
      }

      var taskMeta = {};
      if (data.tasks) {
        Object.entries(data.tasks).forEach(function(entry) {
          entry[1].forEach(function(t) {
            taskMeta[t.folder] = t;
          });
        });
      }

      var html = '<div class="browse-tree">';
      html += renderBrowseNode(data.tree, taskMeta, true);
      html += '</div>';
      el.innerHTML = html;
    }

    function renderBrowseNode(node, taskMeta, isRoot) {
      if (node.type === 'file') {
        return '<div class="file-entry">' +
          '<span class="file-icon">&#128196;</span>' +
          '<span class="file-name">' + esc(node.name) + '</span>' +
          '<span class="file-meta">' + fmtSize(node.size || 0) + '</span>' +
        '</div>';
      }

      var meta = taskMeta[node.name];
      var annotation = '';
      if (meta) {
        var color = agentColor(meta.agent_type);
        annotation = ' <span class="task-badge badge-' + color + '">' + esc(meta.agent_type) + '</span>';
        if (meta.created_at) {
          annotation += ' <span class="file-meta">' + esc(fmtTime(meta.created_at)) + '</span>';
        }
      }

      var children = (node.children || []).map(function(c) { return renderBrowseNode(c, taskMeta, false); }).join('');
      var openAttr = isRoot ? ' open' : '';

      return '<details' + openAttr + '>' +
        '<summary>' +
          '<span class="dir-icon">&#128193;</span> ' +
          '<span class="file-name">' + esc(node.name) + '</span>' +
          annotation +
        '</summary>' +
        children +
      '</details>';
    }

    // ===== Global Unit Selector & Decomposition Bars =====
    var globalUnit = 'time'; // 'time' | 'tokens' | 'tools'
    var decompStack = []; // breadcrumb stack: [{level, label, data}]
    var decompTokenCache = {}; // session_id -> token data
    var decompSpansCache = {}; // session_id -> spans data

    function setGlobalUnit(unit) {
      globalUnit = unit;
      document.querySelectorAll('.unit-btn').forEach(function(b) {
        b.classList.toggle('active', b.dataset.unit === unit);
      });

      var sessionList = document.getElementById('session-list');
      var decompView = document.getElementById('decomp-view');
      var expandBtn = document.getElementById('ctrl-expand');
      var collapseBtn = document.getElementById('ctrl-collapse');

      if (unit === 'time') {
        sessionList.style.display = '';
        decompView.style.display = 'none';
        expandBtn.style.display = '';
        collapseBtn.style.display = '';
      } else {
        sessionList.style.display = 'none';
        decompView.style.display = '';
        expandBtn.style.display = 'none';
        collapseBtn.style.display = 'none';
        decompStack = [];
        renderDecompSessionLevel();
      }
    }

    function decompSessionValue(s) {
      if (globalUnit === 'tokens') {
        return (s.input_tokens || 0) + (s.output_tokens || 0) +
               (s.cache_creation_tokens || 0) + (s.cache_read_tokens || 0);
      }
      return s.tool_call_count || 0;
    }

    function decompFormatValue(val) {
      if (globalUnit === 'tokens') return fmtTokens(val) + ' tokens';
      return val + ' tools';
    }

    function decompUnitLabel() {
      return globalUnit === 'tokens' ? 'Total Tokens' : 'Total Tool Calls';
    }

    // Level 0: All sessions as bars
    function renderDecompSessionLevel() {
      var el = document.getElementById('decomp-view');
      if (!sessionsCache || sessionsCache.length === 0) {
        el.innerHTML = '<div class="empty-state">No sessions recorded yet</div>';
        return;
      }

      var sorted = sessionsCache.slice().sort(function(a, b) {
        return decompSessionValue(b) - decompSessionValue(a);
      });

      var maxVal = sorted.length > 0 ? decompSessionValue(sorted[0]) : 1;
      if (maxVal === 0) maxVal = 1;

      var totalVal = sorted.reduce(function(s, sess) { return s + decompSessionValue(sess); }, 0);

      decompStack = [{ level: 'sessions', label: 'All Sessions' }];

      var html = renderDecompBreadcrumb();
      html += '<div class="decomp-total-label">' + decompUnitLabel() + ': <b>' + decompFormatValue(totalVal) + '</b></div>';
      html += '<div class="decomp-bars">';

      sorted.forEach(function(s) {
        var val = decompSessionValue(s);
        var pct = maxVal > 0 ? (val / maxVal * 100) : 0;
        var name = s.name || truncId(s.session_id, 30);
        html += '<div class="decomp-bar-row" data-sid="' + esc(s.session_id) + '" onclick="decompToggleSession(this, \'' + esc(s.session_id) + '\')">';
        html += '<div class="decomp-bar-label" title="' + esc(s.session_id) + '">' + esc(name) + '</div>';
        html += '<div class="decomp-bar-track"><div class="decomp-bar-fill" style="width:' + pct + '%;background:#7950f2;">' + (pct > 15 ? decompFormatValue(val) : '') + '</div></div>';
        html += '<div class="decomp-bar-value">' + decompFormatValue(val) + '</div>';
        html += '</div>';
        // Placeholder for inline expansion
        html += '<div class="decomp-children" id="decomp-children-' + esc(s.session_id) + '" style="display:none;margin-left:20px;"></div>';
      });

      html += '</div>';
      el.innerHTML = html;
    }

    // Inline expand/collapse a session's children
    async function decompToggleSession(rowEl, sessionId) {
      var childDiv = document.getElementById('decomp-children-' + sessionId);
      if (!childDiv) return;
      // Ensure rowEl is the session bar row, not a child
      var sessionRow = document.querySelector('.decomp-bar-row[data-sid="' + sessionId + '"]');
      if (sessionRow) rowEl = sessionRow;

      // Toggle - collapse
      if (childDiv.style.display !== 'none') {
        childDiv.style.display = 'none';
        childDiv.innerHTML = '';
        // Restore parent bar to original value
        var ghost = rowEl.querySelector('.decomp-bar-ghost');
        if (ghost) ghost.remove();
        var parentFill = rowEl.querySelector('.decomp-bar-fill');
        var parentValEl = rowEl.querySelector('.decomp-bar-value');
        if (parentFill && parentFill.dataset.origWidth) {
          parentFill.style.width = parentFill.dataset.origWidth;
          parentFill.textContent = parentFill.dataset.origText || '';
          if (parentValEl) parentValEl.textContent = parentValEl.dataset.origText || '';
        }
        return;
      }

      childDiv.style.display = 'block';
      childDiv.innerHTML = '<div class="empty-state" style="font-size:11px">Loading...</div>';

      try {
        // Fetch data
        if (!decompTokenCache[sessionId]) {
          var tokResp = await fetch('/api/sessions/' + encodeURIComponent(sessionId) + '/tokens');
          decompTokenCache[sessionId] = await tokResp.json();
        }
        if (!decompSpansCache[sessionId]) {
          var spResp = await fetch('/api/sessions/' + encodeURIComponent(sessionId) + '/spans');
          decompSpansCache[sessionId] = await spResp.json();
        }

        var tokenData = decompTokenCache[sessionId] || {};
        var spans = decompSpansCache[sessionId] || [];

        // Group by agent_type
        var typeGroups = {};
        if (globalUnit === 'tokens') {
          Object.entries(tokenData).forEach(function(entry) {
            var agentId = entry[0], info = entry[1];
            var aType = info.agent_type || 'unknown';
            if (!typeGroups[aType]) typeGroups[aType] = { value: 0, agents: [] };
            typeGroups[aType].value += info.total || 0;
            typeGroups[aType].agents.push({ id: agentId, value: info.total || 0, info: info });
          });
        } else {
          spans.forEach(function(sp) {
            if (sp.type !== 'agent') return;
            var aType = sp.agent_type || 'unknown';
            if (!typeGroups[aType]) typeGroups[aType] = { value: 0, agents: [] };
            typeGroups[aType].value += sp.tool_calls || 0;
            typeGroups[aType].agents.push({ id: sp.id, value: sp.tool_calls || 0, info: sp });
          });
        }

        // Sort groups by value
        var groups = Object.entries(typeGroups).sort(function(a, b) { return b[1].value - a[1].value; });
        // Scale relative to SAME max as parent bars (max across all sessions)
        var maxSessVal = sessionsCache.reduce(function(m, s) { var v = decompSessionValue(s); return v > m ? v : m; }, 1);
        if (maxSessVal === 0) maxSessVal = 1;
        var sessionObj = sessionsCache.find(function(s) { return s.session_id === sessionId; });
        var sessionVal = sessionObj ? decompSessionValue(sessionObj) : 1;

        var html = '';
        groups.forEach(function(entry) {
          var aType = entry[0], data = entry[1];
          var pct = (data.value / maxSessVal * 100);
          var color = agentHex(aType);
          html += '<div class="decomp-bar-row" onclick="event.stopPropagation(); decompToggleAgentType(this, \'' + esc(sessionId) + '\', \'' + esc(aType) + '\')">';
          html += '<div class="decomp-bar-label">' + esc(aType) + '</div>';
          html += '<div class="decomp-bar-track"><div class="decomp-bar-fill" style="width:' + pct + '%;background:' + color + ';">' + (pct > 20 ? decompFormatValue(data.value) : '') + '</div></div>';
          html += '<div class="decomp-bar-value">' + decompFormatValue(data.value) + '</div>';
          html += '</div>';
          html += '<div class="decomp-children" id="decomp-type-' + esc(sessionId) + '-' + esc(aType) + '" style="display:none;margin-left:20px;"></div>';
        });

        if (groups.length === 0) {
          html = '<div class="empty-state" style="font-size:11px">No data for this unit</div>';
        }

        // Update parent bar: ghost background at original width, fill shrinks to unattributed
        var childrenTotal = groups.reduce(function(s, entry) { return s + entry[1].value; }, 0);
        var unattributed = Math.max(0, sessionVal - childrenTotal);
        var parentFill = rowEl.querySelector('.decomp-bar-fill');
        var parentTrack = rowEl.querySelector('.decomp-bar-track');
        var parentValEl = rowEl.querySelector('.decomp-bar-value');
        if (parentFill && parentTrack) {
          // Save originals for restore on collapse
          var origWidth = parentFill.style.width;
          parentFill.dataset.origWidth = origWidth;
          parentFill.dataset.origText = parentFill.textContent;
          if (parentValEl) parentValEl.dataset.origText = parentValEl.textContent;
          parentTrack.style.position = 'relative';
          var ghost = document.createElement('div');
          ghost.className = 'decomp-bar-ghost';
          ghost.style.cssText = 'position:absolute;top:0;left:0;height:100%;width:' + origWidth + ';background:#7950f2;opacity:0.15;border-radius:4px;pointer-events:none;';
          parentTrack.insertBefore(ghost, parentFill);
          // Shrink fill to unattributed portion
          var maxSessVal = sessionsCache.reduce(function(m, s) { var v = decompSessionValue(s); return v > m ? v : m; }, 1);
          var unPct = maxSessVal > 0 ? (unattributed / maxSessVal * 100) : 0;
          parentFill.style.width = unPct + '%';
          parentFill.textContent = unattributed > 0 ? decompFormatValue(unattributed) : '';
          if (parentValEl) parentValEl.textContent = unattributed > 0 ? decompFormatValue(unattributed) : '0';
        }

        // Unattributed remainder is already shown in the shrunken parent bar.
        // No separate row needed — the parent bar IS the orchestrator.

        childDiv.innerHTML = html;
      } catch(e) {
        childDiv.innerHTML = '<div class="empty-state" style="font-size:11px">Failed to load</div>';
      }
    }

    // Inline expand agent type -> individual invocations
    function decompToggleAgentType(rowEl, sessionId, agentType) {
      var childDiv = document.getElementById('decomp-type-' + sessionId + '-' + agentType);
      if (!childDiv) return;

      if (childDiv.style.display !== 'none') {
        childDiv.style.display = 'none';
        childDiv.innerHTML = '';
        // Restore parent bar
        var ghost = rowEl.querySelector('.decomp-bar-ghost');
        if (ghost) ghost.remove();
        var pf = rowEl.querySelector('.decomp-bar-fill');
        var pv = rowEl.querySelector('.decomp-bar-value');
        if (pf && pf.dataset.origWidth) {
          pf.style.width = pf.dataset.origWidth;
          pf.textContent = pf.dataset.origText || '';
          if (pv) pv.textContent = pv.dataset.origText || '';
        }
        return;
      }

      childDiv.style.display = 'block';
      var tokenData = decompTokenCache[sessionId] || {};
      var spans = decompSpansCache[sessionId] || [];

      var invocations = [];
      if (globalUnit === 'tokens') {
        Object.entries(tokenData).forEach(function(entry) {
          var agentId = entry[0], info = entry[1];
          if ((info.agent_type || 'unknown') === agentType) {
            // Find task_uuid from spans if available
            var matchSpan = spans.find(function(sp) { return sp.id === agentId && sp.type === 'agent'; });
            var taskUuid = matchSpan ? (matchSpan.task_uuid || '') : '';
            invocations.push({ id: agentId, value: info.total || 0, taskUuid: taskUuid, startTs: matchSpan ? (matchSpan.start || '') : '' });
          }
        });
      } else {
        spans.forEach(function(sp) {
          if (sp.type !== 'agent' || (sp.agent_type || 'unknown') !== agentType) return;
          invocations.push({ id: sp.id, value: sp.tool_calls || 0, taskUuid: sp.task_uuid || '', isResume: sp.is_resume, startTs: sp.start || '' });
        });
      }

      // Sort by start time (preserve chronological order for numbering)
      invocations.sort(function(a, b) { return (a.startTs || '').localeCompare(b.startTs || ''); });
      // Use same global scale as parent bars
      var maxSessVal = sessionsCache.reduce(function(m, s) { var v = decompSessionValue(s); return v > m ? v : m; }, 1);
      if (maxSessVal === 0) maxSessVal = 1;
      var color = agentHex(agentType);

      // Track seen agent IDs for numbering (same agent resumed = same number)
      var agentIdToNum = {};
      var nextNum = 1;

      var html = '';
      invocations.forEach(function(inv, idx) {
        var pct = (inv.value / maxSessVal * 100);
        // Number agents: same agent_id = same #, different = new #
        var num;
        if (agentIdToNum[inv.id] !== undefined) {
          num = agentIdToNum[inv.id];
        } else {
          num = nextNum++;
          agentIdToNum[inv.id] = num;
        }
        var label = '#' + num + (inv.isResume ? ' (cont.)' : '');
        // View task icon (📄) separate from expand
        var viewBtn = '';
        if (inv.taskUuid) {
          viewBtn = '<span class="decomp-view-btn" onclick="event.stopPropagation(); showTaskOverlay(\'' + esc(inv.taskUuid) + '\')" title="View task">&#128196;</span>';
        } else {
          viewBtn = '<span class="decomp-view-btn" onclick="event.stopPropagation(); searchAndShowTask(\'\', \'' + esc(agentType) + '\', 0)" title="View task">&#128196;</span>';
        }
        html += '<div class="decomp-bar-row">';
        html += '<div class="decomp-bar-label">' + esc(label) + ' ' + viewBtn + '</div>';
        html += '<div class="decomp-bar-track"><div class="decomp-bar-fill" style="width:' + pct + '%;background:' + shiftColor(color, idx) + ';">' + (pct > 20 ? decompFormatValue(inv.value) : '') + '</div></div>';
        html += '<div class="decomp-bar-value">' + decompFormatValue(inv.value) + '</div>';
        html += '</div>';
      });

      // Ghost bar on parent agent type row
      var parentFill = rowEl.querySelector('.decomp-bar-fill');
      var parentTrack = rowEl.querySelector('.decomp-bar-track');
      var parentValEl = rowEl.querySelector('.decomp-bar-value');
      if (parentFill && parentTrack) {
        parentFill.dataset.origWidth = parentFill.style.width;
        parentFill.dataset.origText = parentFill.textContent;
        if (parentValEl) parentValEl.dataset.origText = parentValEl.textContent;
        parentTrack.style.position = 'relative';
        var ghost = document.createElement('div');
        ghost.className = 'decomp-bar-ghost';
        ghost.style.cssText = 'position:absolute;top:0;left:0;height:100%;width:' + parentFill.style.width + ';background:' + color + ';opacity:0.15;border-radius:4px;pointer-events:none;';
        parentTrack.insertBefore(ghost, parentFill);
        // Show just the label, no filled bar (children explain the breakdown)
        parentFill.style.width = '0%';
        parentFill.textContent = '';
        if (parentValEl) parentValEl.textContent = '';
      }

      childDiv.innerHTML = html || '<div class="empty-state" style="font-size:11px">No invocations</div>';
    }

    // Level 1: Drill into a session -> agent type groups (legacy, kept for breadcrumb nav)
    async function decompDrillSession(sessionId) {
      var el = document.getElementById('decomp-view');
      el.innerHTML = '<div class="empty-state">Loading...</div>';

      var session = sessionsCache.find(function(s) { return s.session_id === sessionId; });
      var sessionName = session ? (session.name || truncId(sessionId, 30)) : truncId(sessionId, 30);

      try {
        // Fetch token data and spans in parallel
        var promises = [];
        if (!decompTokenCache[sessionId]) {
          promises.push(
            fetch('/api/sessions/' + encodeURIComponent(sessionId) + '/tokens')
              .then(function(r) { return r.json(); })
              .then(function(d) { decompTokenCache[sessionId] = d; })
          );
        }
        if (!decompSpansCache[sessionId]) {
          promises.push(
            fetch('/api/sessions/' + encodeURIComponent(sessionId) + '/spans')
              .then(function(r) { return r.json(); })
              .then(function(d) { decompSpansCache[sessionId] = d; })
          );
        }
        if (promises.length) await Promise.all(promises);

        var tokenData = decompTokenCache[sessionId] || {};
        var spans = decompSpansCache[sessionId] || [];

        // Group by agent_type
        var typeGroups = {};
        if (globalUnit === 'tokens') {
          Object.entries(tokenData).forEach(function(entry) {
            var agentId = entry[0], info = entry[1];
            var aType = info.agent_type || 'unknown';
            if (!typeGroups[aType]) typeGroups[aType] = { value: 0, agents: {} };
            typeGroups[aType].value += info.total || 0;
            typeGroups[aType].agents[agentId] = info;
          });
        } else {
          // Tools: group spans by agent_type
          spans.forEach(function(sp) {
            if (sp.type !== 'agent') return;
            var aType = sp.agent_type || 'unknown';
            if (!typeGroups[aType]) typeGroups[aType] = { value: 0, agents: {} };
            var tc = sp.tool_calls || 0;
            typeGroups[aType].value += tc;
            if (!typeGroups[aType].agents[sp.id]) {
              typeGroups[aType].agents[sp.id] = { tool_calls: 0, agent_type: aType };
            }
            typeGroups[aType].agents[sp.id].tool_calls += tc;
          });
        }

        var sorted = Object.entries(typeGroups).sort(function(a, b) { return b[1].value - a[1].value; });
        var maxVal = sorted.length > 0 ? sorted[0][1].value : 1;
        if (maxVal === 0) maxVal = 1;
        var totalVal = sorted.reduce(function(s, e) { return s + e[1].value; }, 0);

        decompStack = [
          { level: 'sessions', label: 'All Sessions' },
          { level: 'session', label: sessionName, sessionId: sessionId }
        ];

        var html = renderDecompBreadcrumb();
        html += '<div class="decomp-total-label">' + esc(sessionName) + ' - ' + decompUnitLabel() + ': <b>' + decompFormatValue(totalVal) + '</b></div>';
        html += '<div class="decomp-bars">';

        sorted.forEach(function(entry) {
          var aType = entry[0], info = entry[1];
          var pct = maxVal > 0 ? (info.value / maxVal * 100) : 0;
          var color = agentHex(aType);
          html += '<div class="decomp-bar-row" onclick="decompDrillAgentType(\'' + esc(sessionId) + '\', \'' + esc(aType) + '\')">';
          html += '<div class="decomp-bar-label">' + esc(aType) + '</div>';
          html += '<div class="decomp-bar-track"><div class="decomp-bar-fill" style="width:' + pct + '%;background:' + color + ';">' + (pct > 15 ? decompFormatValue(info.value) : '') + '</div></div>';
          html += '<div class="decomp-bar-value">' + decompFormatValue(info.value) + '</div>';
          html += '</div>';
        });

        html += '</div>';
        el.innerHTML = html;
      } catch(e) {
        el.innerHTML = '<div class="empty-state">Failed to load data</div>';
      }
    }

    // Level 2: Drill into agent type -> individual invocations
    function decompDrillAgentType(sessionId, agentType) {
      var el = document.getElementById('decomp-view');
      var tokenData = decompTokenCache[sessionId] || {};
      var spans = decompSpansCache[sessionId] || [];
      var session = sessionsCache.find(function(s) { return s.session_id === sessionId; });
      var sessionName = session ? (session.name || truncId(sessionId, 30)) : truncId(sessionId, 30);

      // Collect individual invocations for this agent type
      var invocations = [];
      if (globalUnit === 'tokens') {
        Object.entries(tokenData).forEach(function(entry) {
          var agentId = entry[0], info = entry[1];
          if ((info.agent_type || 'unknown') !== agentType) return;
          var matchSpan = spans.find(function(sp) { return sp.id === agentId && sp.type === 'agent'; });
          var taskUuid = matchSpan ? (matchSpan.task_uuid || '') : '';
          invocations.push({
            id: agentId,
            label: agentType + ' ' + truncId(agentId, 7),
            value: info.total || 0,
            agentType: agentType,
            taskUuid: taskUuid
          });
        });
      } else {
        // Group spans by agent id
        var byId = {};
        spans.forEach(function(sp) {
          if (sp.type !== 'agent') return;
          if ((sp.agent_type || 'unknown') !== agentType) return;
          if (!byId[sp.id]) byId[sp.id] = { value: 0, taskUuid: sp.task_uuid || '' };
          byId[sp.id].value += sp.tool_calls || 0;
          if (sp.task_uuid) byId[sp.id].taskUuid = sp.task_uuid;
        });
        Object.entries(byId).forEach(function(entry) {
          invocations.push({
            id: entry[0],
            label: agentType + ' ' + truncId(entry[0], 7),
            value: entry[1].value,
            agentType: agentType,
            taskUuid: entry[1].taskUuid || ''
          });
        });
      }

      invocations.sort(function(a, b) { return b.value - a.value; });
      var maxVal = invocations.length > 0 ? invocations[0].value : 1;
      if (maxVal === 0) maxVal = 1;
      var totalVal = invocations.reduce(function(s, e) { return s + e.value; }, 0);

      decompStack = [
        { level: 'sessions', label: 'All Sessions' },
        { level: 'session', label: sessionName, sessionId: sessionId },
        { level: 'agentType', label: agentType, sessionId: sessionId, agentType: agentType }
      ];

      var html = renderDecompBreadcrumb();
      html += '<div class="decomp-total-label">' + esc(agentType) + ' - ' + decompUnitLabel() + ': <b>' + decompFormatValue(totalVal) + '</b></div>';
      html += '<div class="decomp-bars">';

      var color = agentHex(agentType);
      invocations.forEach(function(inv, idx) {
        var pct = maxVal > 0 ? (inv.value / maxVal * 100) : 0;
        var barColor = idx === 0 ? color : shiftColor(color, idx);
        var viewBtn = '';
        if (inv.taskUuid) {
          viewBtn = ' <span class="decomp-view-btn" onclick="event.stopPropagation(); showTaskOverlay(\'' + esc(inv.taskUuid) + '\')" title="View task">&#128196;</span>';
        } else {
          viewBtn = ' <span class="decomp-view-btn" onclick="event.stopPropagation(); searchAndShowTask(\'\', \'' + esc(agentType) + '\', 0)" title="View task">&#128196;</span>';
        }
        html += '<div class="decomp-bar-row" onclick="decompDrillInvocation(\'' + esc(sessionId) + '\', \'' + esc(agentType) + '\', \'' + esc(inv.id) + '\')">';
        html += '<div class="decomp-bar-label" title="' + esc(inv.id) + '">' + esc(inv.label) + viewBtn + '</div>';
        html += '<div class="decomp-bar-track"><div class="decomp-bar-fill" style="width:' + pct + '%;background:' + barColor + ';">' + (pct > 15 ? decompFormatValue(inv.value) : '') + '</div></div>';
        html += '<div class="decomp-bar-value">' + decompFormatValue(inv.value) + '</div>';
        html += '</div>';
      });

      html += '</div>';
      el.innerHTML = html;
    }

    // Level 3: Drill into invocation -> agent + workers
    function decompDrillInvocation(sessionId, agentType, agentId) {
      var el = document.getElementById('decomp-view');
      var tokenData = decompTokenCache[sessionId] || {};
      var spans = decompSpansCache[sessionId] || [];
      var session = sessionsCache.find(function(s) { return s.session_id === sessionId; });
      var sessionName = session ? (session.name || truncId(sessionId, 30)) : truncId(sessionId, 30);

      // Find the agent span and its workers
      var items = [];
      if (globalUnit === 'tokens') {
        var agentInfo = tokenData[agentId];
        if (agentInfo) {
          items.push({
            label: agentType + ' (agent)',
            value: agentInfo.total || 0,
            color: agentHex(agentType),
            isAgent: true
          });
        }
        // Workers: find spans whose parent_id references this agent's task_uuid
        var agentSpan = spans.find(function(sp) { return sp.id === agentId && sp.type === 'agent'; });
        var taskUuid = agentSpan ? agentSpan.task_uuid : null;
        spans.forEach(function(sp) {
          if (sp.type !== 'worker') return;
          var isChild = false;
          if (sp.parent_id === 'task:' + taskUuid && taskUuid) isChild = true;
          if (sp.parent_id === 'worker:' + agentId) isChild = true;
          if (!isChild) return;
          // Worker token data from spans.tokens or estimate from token cache
          var wTokens = 0;
          if (sp.tokens) {
            wTokens = (sp.tokens.input_tokens || 0) + (sp.tokens.output_tokens || 0) +
                      (sp.tokens.cache_creation || 0) + (sp.tokens.cache_read || 0);
          }
          items.push({
            label: (sp.agent_type || 'worker') + ' / ' + truncId(sp.id, 8),
            value: wTokens,
            color: agentHex(sp.agent_type || 'worker'),
            isAgent: false
          });
        });
      } else {
        // Tools mode
        var agentSpans = spans.filter(function(sp) { return sp.id === agentId && sp.type === 'agent'; });
        var agentTools = agentSpans.reduce(function(s, sp) { return s + (sp.tool_calls || 0); }, 0);
        items.push({
          label: agentType + ' (agent)',
          value: agentTools,
          color: agentHex(agentType),
          isAgent: true
        });
        // Workers
        var agentSpan = agentSpans[0];
        var taskUuid = agentSpan ? agentSpan.task_uuid : null;
        spans.forEach(function(sp) {
          if (sp.type !== 'worker') return;
          var isChild = false;
          if (sp.parent_id === 'task:' + taskUuid && taskUuid) isChild = true;
          if (sp.parent_id === 'worker:' + agentId) isChild = true;
          if (!isChild) return;
          items.push({
            label: (sp.agent_type || 'worker') + ' / ' + truncId(sp.id, 8),
            value: sp.tool_calls || 0,
            color: agentHex(sp.agent_type || 'worker'),
            isAgent: false
          });
        });
      }

      items.sort(function(a, b) { return b.value - a.value; });
      var maxVal = items.length > 0 ? items[0].value : 1;
      if (maxVal === 0) maxVal = 1;
      var totalVal = items.reduce(function(s, e) { return s + e.value; }, 0);

      decompStack = [
        { level: 'sessions', label: 'All Sessions' },
        { level: 'session', label: sessionName, sessionId: sessionId },
        { level: 'agentType', label: agentType, sessionId: sessionId, agentType: agentType },
        { level: 'invocation', label: truncId(agentId, 10), sessionId: sessionId, agentType: agentType, agentId: agentId }
      ];

      var html = renderDecompBreadcrumb();
      html += '<div class="decomp-total-label">' + esc(agentType) + ' / ' + esc(truncId(agentId, 10)) + ' - ' + decompUnitLabel() + ': <b>' + decompFormatValue(totalVal) + '</b></div>';
      html += '<div class="decomp-bars">';

      items.forEach(function(item) {
        var pct = maxVal > 0 ? (item.value / maxVal * 100) : 0;
        html += '<div class="decomp-bar-row" style="cursor:default;">';
        html += '<div class="decomp-bar-label">' + esc(item.label) + '</div>';
        html += '<div class="decomp-bar-track"><div class="decomp-bar-fill" style="width:' + pct + '%;background:' + item.color + ';">' + (pct > 15 ? decompFormatValue(item.value) : '') + '</div></div>';
        html += '<div class="decomp-bar-value">' + decompFormatValue(item.value) + '</div>';
        html += '</div>';
      });

      html += '</div>';
      el.innerHTML = html;
    }

    // Breadcrumb navigation
    function renderDecompBreadcrumb() {
      if (decompStack.length <= 1) return '';
      var html = '<div class="decomp-breadcrumb">';
      decompStack.forEach(function(crumb, i) {
        if (i < decompStack.length - 1) {
          html += '<span class="decomp-breadcrumb-item" onclick="decompNavigateTo(' + i + ')">' + esc(crumb.label) + '</span>';
          html += '<span class="decomp-breadcrumb-sep">&rsaquo;</span>';
        } else {
          html += '<span class="decomp-breadcrumb-current">' + esc(crumb.label) + '</span>';
        }
      });
      html += '</div>';
      return html;
    }

    function decompNavigateTo(index) {
      var crumb = decompStack[index];
      if (!crumb) return;
      if (crumb.level === 'sessions') {
        renderDecompSessionLevel();
      } else if (crumb.level === 'session') {
        decompDrillSession(crumb.sessionId);
      } else if (crumb.level === 'agentType') {
        decompDrillAgentType(crumb.sessionId, crumb.agentType);
      }
    }

    // ===== Auto-refresh =====
    function startAutoRefresh() {
      loadSessions();
      refreshTimer = setInterval(loadSessions, 10000);
    }

    // ===== Init =====
    startAutoRefresh();
  </script>
</body>
